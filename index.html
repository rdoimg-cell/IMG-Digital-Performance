/* ---------- kartu khusus Profile Audience ---------- */
const GEN_DEMO = [['male', 'Male'], ['female', 'Female'], ['other', 'Other']];
const UMUR_DEMO = [['u17', '13–17'], ['u24', '18–24'], ['u34', '25–34'], ['u44', '35–44'],
                   ['u54', '45–54'], ['u64', '55–64'], ['u65', '65+']];

/* Bobot dan angka demografi satu kumpulan baris. */
function hitungDemo(rows, ix, ada){
  let w = 0; const nil = {};
  for (const r of rows){
    w += r[ix.dem_w] || 0;
    for (const k of ada) nil[k] = (nil[k] || 0) + (r[ix['dem_' + k]] || 0);
  }
  return {w, nil};
}

/* Dipecah per cluster / channel: satu baris per kelompok, supaya komposisinya
   bisa dibandingkan berdampingan. Dulu menu Grouping by tetap muncul di
   Profile Audience tapi tidak mengubah apa pun -- seluruh baris selalu
   dijumlahkan jadi satu komposisi. */
function tabelAudiens(D, gkol, ada){
  const per = new Map();
  for (const r of D.rows){
    const g = String(r[D.ix[gkol]]);
    if (!per.has(g)) per.set(g, []);
    per.get(g).push(r);
  }
  const baris = [];
  for (const [g, rows] of per){
    const {w, nil} = hitungDemo(rows, D.ix, ada);
    if (!w) continue;                       // kelompok tanpa demografi dilewat
    baris.push({g, w, pct: k => (nil[k] || 0) / w * 100});
  }
  if (!baris.length) return `<div class="kosong-kartu"><b>No demographics for this range yet.</b><br>
    The demographic columns are only filled in for some months. Try a more recent period.</div>`;
  baris.sort((a, b) => b.w - a.w);          // yang paling banyak ditonton dulu

  const tabel = (judul, kolom) => {
    const pakai = kolom.filter(([k]) => ada.includes(k));
    if (!pakai.length) return '';
    return `<div class="kartu tab">
      <div class="nm" style="margin-bottom:8px">${esc(judul)}</div>
      <div class="tw"><table class="vtab dtab">
        <thead><tr><th>${esc(labelGrup(DS.grup))}</th>
          ${pakai.map(([, lb]) => `<th class="ka">${esc(lb)}</th>`).join('')}</tr></thead>
        <tbody>${baris.map(x => `<tr>
          <td class="jd" title="${esc(x.g)}">${esc(x.g)}</td>
          ${pakai.map(([k]) => `<td class="ka">${PC(x.pct(k))}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
      <div class="ket">Each row is weighted by views and read on its own. Rows can fall a
        little short of 100% — YouTube leaves out viewers it cannot classify.</div>
    </div>`;
  };
  return tabel('Viewer gender', GEN_DEMO) + tabel('Viewer age group', UMUR_DEMO);
}

function kartuAudiens(D, P){
  const ada = (DATA.demo_yt || []);
  if (!ada.length) return `<div class="kosong-kartu">This file carries no demographic data.</div>`;

  const gkol = DS.grup ? kolomGrup(D.S, D.ix, DS.grup) : null;
  if (gkol) return tabelAudiens(D, gkol, ada);

  const {w, nil} = hitungDemo(D.rows, D.ix, ada);
  if (!w) return `<div class="kosong-kartu"><b>No demographics for this range yet.</b><br>
    The demographic columns are only filled in for some months. Try a more recent period.</div>`;

  const pct = k => (nil[k] || 0) / w * 100;
  const GEN = GEN_DEMO, UMUR = UMUR_DEMO;
  const bar = (arr, warna) => {
    const it = arr.filter(([k]) => ada.includes(k)).map(([k, lb]) => ({k: lb, v: pct(k)}));
    const mx = Math.max(...it.map(x => x.v)) || 1;
    return it.map(x => `<div class="bar-row">
      <span class="lb">${x.k}</span><span class="vl">${PC(x.v)}</span>
      <span class="bar-track"><span class="bar-fill"
        style="width:${Math.max(2, x.v / mx * 100).toFixed(1)}%;background:${warna}"></span></span>
    </div>`).join('');
  };
  const c = DATA.demo_cakupan;
  const rentang = c ? `${BLN_EN[c.from[1] - 1]} ${c.from[0]} – ${BLN_EN[c.to[1] - 1]} ${c.to[0]}` : '—';
  return `<div class="kartu">
      <div class="nm">Viewer gender</div>
      <div class="rinci" style="border:0;padding-top:10px">${bar(GEN, WARNA[0])}</div>
      <div class="ket">Weighted by views, so larger channels carry more weight.</div>
    </div>
    <div class="kartu">
      <div class="nm">Viewer age group</div>
      <div class="rinci" style="border:0;padding-top:10px">${bar(UMUR, WARNA[2])}</div>
      <div class="ket">The demographic columns are only filled in for <b>${rentang}</b> — shorter
        than the period you picked, so these figures do not represent the whole range.</div>
    </div>`;
}

/* ---------- tabel Top N video ---------- */
/* Dimensi Top 10/20/30 tidak meringkas apa pun: yang tampil judul videonya satu
   per satu. Kepala kolomnya bisa diklik untuk mengurutkan langsung dari tabel. */
function barisVideoTerurut(D){
  const S = D.S, ix = D.ix;
  const kol = (S.metrik || []).filter(m => DS.metrik.includes(m.id));
  const pakai = kol.length ? kol : [S.metrik[0]].filter(Boolean);
  // kolom keterangan (judul/channel/tanggal/kategori) juga boleh jadi pengurut
  const TEKS = ['judul', 'channel', 'tgl', 'kategori'];
  const sah = new Set([...pakai.map(m => m.id), ...TEKS.filter(k => ix[k] !== undefined)]);
  const urutId = (DS.vsort && sah.has(DS.vsort.id)) ? DS.vsort.id
               : (pakai[0] ? pakai[0].id : null);
  const arah = DS.vsort && sah.has(DS.vsort.id) ? DS.vsort.arah
             : -1;
  const rows = D.rows.slice();
  if (urutId && ix[urutId] !== undefined){
    const teks = TEKS.includes(urutId);
    rows.sort((a, b) => teks
      ? String(a[ix[urutId]]).localeCompare(String(b[ix[urutId]]), 'id') * arah
      : ((a[ix[urutId]] || 0) - (b[ix[urutId]] || 0)) * arah);
  }
  return {pakai, urutId, arah, rows};
}

function tabelVideo(D){
  const S = D.S, ix = D.ix;
  const {pakai, urutId, arah, rows} = barisVideoTerurut(D);
  if (!rows.length) return `<div class="kosong-kartu"><b>No videos for this combination.</b></div>`;
  const tampil = rows.slice(0, S.n);

  const panah = id => id === urutId ? (arah < 0 ? ' ▼' : ' ▲') : '';
  const th = (id, teks, kanan) =>
    `<th class="${kanan ? 'ka' : ''}${id === urutId ? ' aktif' : ''}"${
      id ? ` data-urut="${id}" title="Click to sort by ${esc(teks)}"` : ''}>${esc(teks)}${
      id ? panah(id) : ''}</th>`;

  const kepala = th('', '#') + th('judul', 'Video title')
    + (ix.channel !== undefined ? th('channel', 'Channel') : '')
    + (ix.tgl !== undefined ? th('tgl', 'Upload date') : '')
    + (ix.kategori !== undefined ? th('kategori', 'Category') : '')
    + pakai.map(m => th(m.id, namaBersih(m.label), true)).join('');

  const isi = tampil.map((r, i) => `<tr>
    <td class="no">${i + 1}</td>
    <td class="jd" title="${esc(r[ix.judul])}">${esc(r[ix.judul])}</td>
    ${ix.channel !== undefined ? `<td>${esc(r[ix.channel])}</td>` : ''}
    ${ix.tgl !== undefined ? `<td class="tg">${esc(r[ix.tgl])}</td>` : ''}
    ${ix.kategori !== undefined ? `<td>${esc(r[ix.kategori])}</td>` : ''}
    ${pakai.map(m => `<td class="ka">${formatMetrik(m.id, m.label, r[ix[m.id]] || 0)}</td>`).join('')}
  </tr>`).join('');

  // Daftar pendeknya dibangun dari enam metrik peringkat. Mengurutkan memakai
  // kolom di luar itu tetap boleh, tapi harus dikatakan apa artinya.
  const kolomTeks = ['judul', 'channel', 'tgl', 'kategori'].includes(urutId);
  const dijamin = kolomTeks || (S.peringkat || []).includes(urutId);
  const namaKolom = kolomTeks
    ? ({judul: 'Video title', channel: 'Channel', tgl: 'Upload date', kategori: 'Category'}[urutId])
    : namaBersih((pakai.find(m => m.id === urutId) || {}).label || urutId);
  const catatan = dijamin
    ? `Showing ${Math.min(S.n, rows.length)} of ${rows.length.toLocaleString('en-US')
      } shortlisted videos, sorted by ${esc(namaKolom)}.`
    : `⚠️ Sorted by <b>${esc(namaKolom)}</b>,
       which is not one of the metrics this shortlist was built from — a video outside the
       shortlist could rank higher on it. Ranking is exact for ${
         (S.peringkat || []).map(k => esc(namaBersih(
           ((S.metrik || []).find(m => m.id === k) || {}).label || k))).join(', ')}.`;

  return `<div class="kartu vid">
    <div class="tw"><table class="vtab">
      <thead><tr>${kepala}</tr></thead><tbody>${isi}</tbody></table></div>
    <div class="ket">${catatan}</div>
  </div>`;
}

function pasangUrutVideo(el){
  el.querySelectorAll('.vtab th[data-urut]').forEach(h => {
    h.onclick = () => {
      const id = h.dataset.urut;
      // klik pertama: besar ke kecil. Klik lagi di kolom yang sama: dibalik.
      DS.vsort = (DS.vsort && DS.vsort.id === id)
        ? {id, arah: -DS.vsort.arah}
        : {id, arah: (id === 'judul' || id === 'channel' || id === 'kategori' || id === 'tgl') ? 1 : -1};
      renderDash();
    };
  });
}

/* ---------- unduh isi dashboard sebagai Excel ---------- */
/* Kartu di layar sengaja dipangkas 10 teratas supaya terbaca. Berkas Excel
   TIDAK dipangkas: kalau ada 35 program, ketiga puluh lima program itu yang
   ikut turun. Yang dipangkas cuma tampilannya, bukan datanya. */
function sheetsDash(){
  const P = ACTIVE_P;
  const D = barisDash(P), S = D.S;
  if (S.kosong || !D.rows.length) return null;
  const ix = D.ix;

  const pakai = metrikTerpakai(S);
  const judulMet = m => namaBersih(m.label);

  const namaBln = t => `${BLN_EN[(t - 1) % 12]} ${Math.floor((t - 1) / 12)}`;

  /* 1) Saringan yang sedang aktif -- supaya berkasnya bisa dibaca ulang
        berbulan-bulan kemudian tanpa menebak-nebak asalnya. */
  const grup = DS.grup ? labelGrup(DS.grup) : 'No grouping';
  const saring = [
    ['Setting', 'Value'],
    ['Period', P ? (P.labelEn || P.label) : 'All data'],
    ...(DS.fokus ? [['Showing only', DS.fokus]] : []),
    ['Platform', ACTIVE_PLAT || (S.gabung ? 'All platforms' : 'YouTube')],
    ['Cluster', ACTIVE_CL || 'All'],
    ['Channel', ACTIVE_CH || 'All channels'],
    ['Breakdown', JUDUL_BRK[DS.breakdown] || DS.breakdown],
  ];
  if (DS.breakdown === 'content')
    saring.push(['Source', DS.sumber === 'komp' ? 'Competitor (Scraping)' : 'IMG (YouTube Studio)']);
  if ((S.dim || []).includes(DS.dim)) saring.push(['Dimension', NAMA_DIM[DS.dim] || DS.dim]);
  saring.push(['Grouping by', grup],
              ['Sorted by', (DS.vsort && DS.vsort.id) || (pakai[0] ? pakai[0].id : '—')],
              ['Sort direction', (DS.vsort && DS.vsort.arah === 1) ? 'Smallest first' : 'Largest first'],
              ['Metrics', pakai.map(judulMet).join(', ')],
              ['Data source', S.nama],
              ['Downloaded', DATA.meta.generated]);
  const kur = saringanTakTerpakai(D);
  if (kur.length)
    saring.push(['Note', `${S.nama} has no such column, so the `
      + kur.join(' and ').replace(/<\/?b>/g, '') + ' filter was NOT applied.']);

  const sheets = [{nama: 'Filters', baris: saring}];

  /* Dimensi Top N: yang diturunkan seluruh daftar pendeknya, bukan cuma 10-30
     baris yang tampil di layar. Urutannya sama dengan yang sedang terlihat. */
  if (S.video){
    const {pakai: kolV, rows: rowsV, urutId} = barisVideoTerurut(D);
    saring.push(['Rows shown on screen', S.n],
                ['Rows in this file', rowsV.length],
                ['Sorted by', urutId],
                ['Shortlist', `Top 30 per month per channel for each of: `
                  + (S.peringkat || []).join(', ')]);
    const kepala = ['#', 'Video title'];
    if (ix.channel !== undefined) kepala.push('Channel');
    if (ix.tgl !== undefined) kepala.push('Upload date');
    if (ix.kategori !== undefined) kepala.push('Category');
    const baris = [kepala.concat(kolV.map(judulMet))];
    rowsV.forEach((r, i) => {
      const b = [i + 1, String(r[ix.judul])];
      if (ix.channel !== undefined) b.push(String(r[ix.channel]));
      if (ix.tgl !== undefined) b.push(String(r[ix.tgl]));
      if (ix.kategori !== undefined) b.push(String(r[ix.kategori]));
      baris.push(b.concat(kolV.map(m => r[ix[m.id]] || 0)));
    });
    sheets.push({nama: 'Videos', baris});
    return sheets;
  }

  /* 2) Deret bulanan tiap metrik. */
  const perBulan = new Map();
  for (const r of D.rows){
    const t = r[0] * 12 + r[1];
    if (!perBulan.has(t)) perBulan.set(t, []);
    perBulan.get(t).push(r);
  }
  const bulan = [...perBulan.keys()].sort((a, b) => a - b);
  sheets.push({nama: 'Monthly', baris: [
    ['Month', ...pakai.map(judulMet)],
    ...bulan.map(t => [namaBln(t), ...pakai.map(m => nilaiMetrik(perBulan.get(t), ix, m.id, S))]),
  ]});

  /* 3) Rincian LENGKAP -- tanpa pemangkasan 10 teratas. */
  const gkol = DS.grup ? kolomGrup(S, ix, DS.grup) : null;
  const dalam = kolomDim(S, ix);
  const namaDim = namaDimAktif(S);

  // Berkasnya memakai kolom pengurut yang sama dengan yang sedang terlihat di
  // layar, supaya urutan di Excel tidak mengejutkan.
  const gabung = (rows, kol) =>
    urutkanDaftar(daftarGabung(rows, ix, S, kol, pakai), pakai, urutanTabel(pakai));

  if (gkol && dalam){
    const per = new Map();
    for (const r of D.rows){
      const g = String(r[ix[gkol]]);
      if (!per.has(g)) per.set(g, []);
      per.get(g).push(r);
    }
    const urutG = urutkanGrup([...per.entries()].map(([g, rows]) =>
      ({g, rows, tot: nilaiMetrik(rows, ix, pakai[0] ? pakai[0].id : 'views', S)})), DS.grup);
    const baris = [[labelGrup(DS.grup), namaDim, ...pakai.map(judulMet)]];
    for (const {g, rows} of urutG)
      for (const x of gabung(rows, dalam))
        baris.push([g, x.k, ...pakai.map(m => x.v[m.id] || 0)]);
    sheets.push({nama: 'Breakdown', baris});
  } else if (gkol){
    const baris = [[labelGrup(DS.grup), ...pakai.map(judulMet)]];
    for (const x of gabung(D.rows, gkol)) baris.push([x.k, ...pakai.map(m => x.v[m.id] || 0)]);
    sheets.push({nama: 'Breakdown', baris});
  } else if (dalam){
    const baris = [[namaDim, ...pakai.map(judulMet)]];
    for (const x of gabung(D.rows, dalam)) baris.push([x.k, ...pakai.map(m => x.v[m.id] || 0)]);
    sheets.push({nama: 'Breakdown', baris});
  }

  /* 4) Kalau tidak ada pengelompokan pun, rincian per channel tetap ikut turun.
        Di layar sengaja tidak ditampilkan (No grouping = tidak dipecah), tapi
        di berkas kerja angka per channel hampir selalu dibutuhkan. */
  if (!gkol && ix.channel !== undefined){
    const baris = [['Channel', ...pakai.map(judulMet)]];
    for (const x of gabung(D.rows, 'channel')) baris.push([x.k, ...pakai.map(m => x.v[m.id] || 0)]);
    sheets.push({nama: 'Per Channel', baris});
  }
  return sheets;
}

function unduhDash(btn){
  try {
    const sheets = sheetsDash();
    if (!sheets) return kabar(btn, 'No data');
    const bagian = [JUDUL_BRK[DS.breakdown] || 'Dashboard'];
    if (ACTIVE_CL) bagian.push(ACTIVE_CL);
    if (ACTIVE_P) bagian.push((ACTIVE_P.labelEn || ACTIVE_P.label).replace(/[\/\\:]/g, '-'));
    unduhXLSX('Ask IMG Analytics - ' + bagian.join(' - '), sheets);
    kabar(btn, '✓ Downloaded');
  } catch (e){ kabar(btn, 'Failed: ' + e.message); }
}

/* ---------- render seluruh dashboard ---------- */
function renderDash(){
  const el = document.getElementById('dash');
  if (!el || !el.classList.contains('on')) return;
  const P = ACTIVE_P;
  const D = barisDash(P);
  const S = D.S;

  const JUDUL = JUDUL_BRK;

  if (S.kosong){
    el.innerHTML = `<div class="dash-hd"><div><h2>${JUDUL[DS.breakdown]}</h2>
      <div class="dash-sub">${esc(ACTIVE_PLAT || 'YouTube')}</div></div></div>
      <div class="kosong-kartu">${S.kosong}</div>`;
    return;
  }

  // Periode pembanding. Kalau periodenya dipilih dari menu, pembandingnya
  // sudah ikut dihitung di sana -- termasuk aturan kuartal & tahun yang
  // dibandingkan dengan periode sama tahun sebelumnya. Periode yang datang
  // dari kalimat pertanyaan tidak punya itu, jadi dipakai rentang sama
  // panjang yang persis mendahuluinya.
  let Psbl = null;
  if (P && P.sbl) Psbl = P.sbl;
  else if (P){
    const pjg = (P.y2 * 12 + P.m2) - (P.y1 * 12 + P.m1) + 1;
    const e = P.y1 * 12 + P.m1 - 1, st = e - pjg + 1;
    if (st > 0) Psbl = mkP(Math.floor((st - 1) / 12), (st - 1) % 12 + 1,
                           Math.floor((e - 1) / 12), (e - 1) % 12 + 1);
  }

  const chips = [];
  chips.push(`<span class="chip">${esc(P ? (P.labelEn || P.label) : 'All data')}</span>`);
  chips.push(`<span class="chip">${esc(ACTIVE_PLAT || (S.gabung ? 'All platforms' : 'YouTube'))}</span>`);
  if (ACTIVE_CL) chips.push(`<span class="chip">${esc(ACTIVE_CL)}</span>`);
  if (ACTIVE_CH) chips.push(`<span class="chip">${esc(ACTIVE_CH)}</span>`);
  if (DS.breakdown === 'content'){
    chips.push(`<span class="chip">${DS.sumber === 'komp' ? 'Competitor' : 'IMG'}</span>`);
    // Chip dimensi hanya kalau dimensinya memang berlaku. Sisi kompetitor tidak
    // punya dimensi editorial, jadi jangan pajang 'Category' yang tak terpakai.
    if ((S.dim || []).includes(DS.dim))
      chips.push(`<span class="chip">${esc(NAMA_DIM[DS.dim] || DS.dim)}</span>`);
  }
  if (DS.fokus)
    chips.push(`<span class="chip fokus" id="chipFokus" title="Click to show every value again"
      >Only ${esc(DS.fokus)} <b>✕</b></span>`);
  if (DS.grup) chips.push(`<span class="chip">By ${esc(labelGrup(DS.grup))}</span>`);
  chips.push(`<span class="chip abu">Source: ${esc(S.nama)}</span>`);

  // rentang yang benar-benar ada isinya
  const bl = [...new Set(D.rows.map(r => r[0] * 12 + r[1]))].sort((a, b) => a - b);
  const namaBln = t => `${BLN_EN[(t - 1) % 12]} ${Math.floor((t - 1) / 12)}`;
  const rg = !bl.length ? null
    : bl.length === 1 ? namaBln(bl[0])
    : `${namaBln(bl[0])} – ${namaBln(bl[bl.length - 1])}`;

  const Dl = Psbl ? barisDash(Psbl) : null;
  const adaPembanding = !!(Dl && Dl.rows.length);

  // hal-hal yang berlaku untuk seluruh kartu ditulis sekali saja di sini
  const catatan = [];
  if (bl.length === 1)
    catatan.push(`This range covers a single month only, so no trend line can be drawn yet.`);
  if (Psbl && !adaPembanding && D.rows.length)
    catatan.push(`${esc(S.nama)} has no data for ${esc(Psbl.labelEn || Psbl.label)} yet,
      so there is nothing to compare against.`);
  if (!ACTIVE_PLAT && DS.breakdown !== 'overview' && DATA.ts_socmed && D.rows.length)
    catatan.push(`Only Overview can combine every platform. ${JUDUL[DS.breakdown]} exists for
      YouTube alone, so the figures below are YouTube only.`);
  const kur = saringanTakTerpakai(D);
  if (kur.length && D.rows.length)
    catatan.push(`⚠️ ${S.nama} has no such column, so the ${kur.join(' and ')} filter
      was <b>not applied</b> to the figures below.`);

  let isi;
  if (!D.rows.length){
    isi = `<div class="kosong-kartu"><b>No data for this combination.</b><br>
      ${S.nama} has no rows matching the period and filters selected.
      Try widening the period, or clearing the Cluster / Channel filter.</div>`;
  } else if (DS.breakdown === 'audience'){
    // Kalau dipecah per kelompok bentuknya tabel lebar, jadi tidak dimasukkan
    // ke kisi dua kolom -- di sana tabelnya terjepit.
    isi = DS.grup ? kartuAudiens(D, P)
                  : `<div class="kartu-grid">${kartuAudiens(D, P)}</div>`;
  } else if (S.video){
    isi = tabelVideo(D);
  } else {
    // Ringkasan tiap metrik di atas (angka besar + tren), lalu SATU tabel yang
    // memuat seluruh metrik terpilih sebagai kolom bersebelahan. Dulu tiap
    // metrik punya kartunya sendiri, jadi views dan revenue tampil sebagai dua
    // daftar terpisah dan tidak bisa dibaca berdampingan.
    const pakai = metrikTerpakai(S);
    const opt = {adaPembanding, Psbl};
    isi = `<div class="ubin-grid">${pakai.map(m => ubinMetrik(m, D, Dl, opt)).join('')}</div>`
        + tabelDash(D);
  }

  el.innerHTML = `
    <div class="dash-hd">
      <button class="unduh-dash" onclick="unduhDash(this)"
        title="Every row is included in the file, not just the top 10 shown here">⬇ Download Excel</button>
      <div>
        <h2>${JUDUL[DS.breakdown]}</h2>
        <div class="dash-sub">${rg ? `Data available <b>${rg}</b>` : 'No data under these filters yet'}
          ${adaPembanding ? ` · compared with <b>${esc(Psbl.labelEn || Psbl.label)}</b>` : ''}</div>
        ${catatan.length ? `<div class="dash-note">${catatan.join(' ')}</div>` : ''}
      </div>
    </div>
    <div class="chip-set">${chips.join('')}</div>
    ${isi}`;

  pasangTooltip(el, D);
  if (S.video) pasangUrutVideo(el);
  else { pasangUrutTabel(el); pasangFokus(el); }
  const cf = document.getElementById('chipFokus');
  if (cf) cf.onclick = () => {
    DS.fokus = null; DS.fokusDi = ''; DS.vsort = null; renderDash();
  };
}

/* ---------- crosshair + tooltip pada grafik ---------- */
function pasangTooltip(el, D){
  el.querySelectorAll('.plot').forEach(plot => {
    const kunci = plot.dataset.kunci;
    const deret = deretBulan(D.rows, D.ix, kunci);
    const met = (sumberDash().metrik || []).find(m => m.id === kunci) || {label: kunci};
    const tip = plot.querySelector('.tip');
    const cross = plot.querySelector('.cross');
    plot.querySelectorAll('.hv').forEach(c => {
      const tunjuk = () => {
        const i = +c.dataset.i, d = deret[i];
        if (!d) return;
        const bln = `${BLN_EN[(d.t - 1) % 12]} ${Math.floor((d.t - 1) / 12)}`;
        tip.innerHTML = `<b>${formatMetrik(kunci, met.label, d.v)}</b><br><span class="s">${bln}</span>`;
        const r = plot.getBoundingClientRect(), b = c.getBoundingClientRect();
        tip.style.left = (b.left - r.left + b.width / 2) + 'px';
        tip.style.top = (b.top - r.top + b.height / 2) + 'px';
        tip.style.opacity = 1;
        if (cross){ cross.setAttribute('x1', c.getAttribute('cx'));
                    cross.setAttribute('x2', c.getAttribute('cx'));
                    cross.setAttribute('opacity', '.5'); }
      };
      c.addEventListener('mouseenter', tunjuk);
      c.addEventListener('touchstart', tunjuk, {passive: true});
    });
    plot.addEventListener('mouseleave', () => {
      tip.style.opacity = 0;
      if (cross) cross.setAttribute('opacity', '0');
    });
  });
}

/* Metrik/dimensi/grouping yang tidak ada di sumber baru dibuang, supaya tidak
   ada kartu kosong dan tidak ada menu yang menjanjikan sesuatu yang tak ada. */
function rapikanDash(){
  const baru = sumberDash();
  const sah = new Set((baru.metrik || []).map(m => m.id));
  DS.metrik = DS.metrik.filter(x => sah.has(x));
  if (!DS.metrik.length && (baru.metrik || []).length) DS.metrik = [baru.metrik[0].id];
  if ((baru.dim || []).length && !baru.dim.includes(DS.dim)) DS.dim = baru.dim[0];
  // Nilai yang dipusatkan milik SATU dimensi. Kalau dimensinya -- atau
  // breakdown / sumbernya -- berganti, nilai itu tidak ada lagi di sana, jadi
  // fokusnya dilepas. Mengganti Grouping by TIDAK melepasnya: justru memilih
  // pengelompokan setelah memusatkan satu nilai adalah cara memakainya.
  if (DS.fokus && DS.fokusDi !== kunciFokus()) { DS.fokus = null; DS.fokusDi = ''; }
  const g = grupTersedia(baru).map(x => x[0]);
  if (DS.grup && !g.includes(DS.grup)) DS.grup = '';
  bangunFilterDash(); renderDash();
}

/* ---------- panel filter dashboard di sidebar ---------- */
function bangunFilterDash(){
  const el = document.getElementById('filDash');
  if (!el) return;
  const S = sumberDash();

  const BREAK = [
    ['overview', 'Overview',          true],
    ['content',  'Content',           !!(DATA.ts_dim_ch || DATA.ts_komp)],
    ['audience', 'Profile Audience',  !!(DATA.demo_yt || []).length],
    ['revenue',  'Source Revenue',    !!DATA.ts_revenue_source],
  ].filter(x => x[2]);

  const opsi = (arr, aktif) => arr.map(([v, t]) =>
    `<option value="${v}"${v === aktif ? ' selected' : ''}>${esc(t)}</option>`).join('');

  let html = `<span class="fl">Breakdown</span>
    <select id="selBrk" class="kecil">${opsi(BREAK.map(b => [b[0], b[1]]), DS.breakdown)}</select>`;

  if (DS.breakdown === 'content' && !S.kosong){
    const sumberAda = [];
    if (DATA.ts_dim_ch) sumberAda.push(['img', 'IMG (YouTube Studio)']);
    if (DATA.ts_komp)   sumberAda.push(['komp', 'Competitor (Scraping)']);
    html += `<div class="satu tampil" style="margin-top:8px"><span class="fl">Source</span>
      <select id="selSum" class="kecil">${opsi(sumberAda, DS.sumber)}</select></div>`;
    if ((S.dim || []).length > 1){
      html += `<div class="satu tampil" style="margin-top:7px"><span class="fl">Dimension</span>
        <select id="selDim" class="kecil">${
          opsi(S.dim.map(d => [d, NAMA_DIM[d] || d]), DS.dim)}</select></div>`;
    }
  }

  const grup = grupTersedia(S);
  if (grup.length){
    html += `<div class="satu tampil" style="margin-top:7px"><span class="fl">Grouping by</span>
      <select id="selGrp" class="kecil">${
        opsi([['', 'No grouping'], ...grup], DS.grup)}</select></div>`;
  }

  if (DS.breakdown !== 'audience' && !S.kosong){
    const daftar = S.metrik || [];
    const terpilih = daftar.filter(m => DS.metrik.includes(m.id));
    const ringkas = terpilih.length === 0 ? 'Select Metrics'
      : terpilih.length === 1 ? namaBersih(terpilih[0].label)
      : `${terpilih.length} Metrics selected`;
    html += `<div style="margin-top:9px"><span class="fl">Metrics</span>
      <div class="mdrop" id="mdMet">
        <button type="button" class="mdbtn" id="mdBtn" aria-expanded="false">
          <span>${esc(ringkas)}</span><i>▾</i></button>
        <div class="mdlist" id="mdList">
          ${daftar.map(m => `<label data-id="${m.id}" class="${DS.metrik.includes(m.id) ? 'on' : ''}">
              <input type="checkbox" ${DS.metrik.includes(m.id) ? 'checked' : ''}>
              <span>${esc(namaBersih(m.label))}</span></label>`).join('')}
        </div>
      </div>
      <div class="met-info">${daftar.length} metrics available in this source${
        DS.breakdown === 'content' && DS.sumber === 'komp'
          ? ' — the Scraping file simply has no revenue, watch time, subscriber, or impression columns.'
          : S.gabung
          ? ' — only metrics that mean the same thing on every platform. Watch time, impressions,'
            + ' CTR and RPM exist on YouTube alone; portal visits are not video views, so they'
            + ' stay under Platform = Portal.'
          : ''}</div></div>`;

    // Menu Sort dihapus: yang menentukan urutan adalah kepala kolom yang diklik
    // di tabelnya sendiri, sama seperti tabel Top N video.
  } else if (DS.breakdown === 'audience'){
    html += `<div class="met-info" style="margin-top:9px">Profile Audience shows the gender and
      age-group mix; the metric picker does not apply here.</div>`;
  }

  el.innerHTML = html;

  const rapikan = rapikanDash;

  document.getElementById('selBrk').onchange = e => { DS.breakdown = e.target.value; rapikan(); };
  const sSum = document.getElementById('selSum');
  if (sSum) sSum.onchange = e => { DS.sumber = e.target.value; rapikan(); };
  // Ganti Dimension bisa berarti ganti TABEL (dimensi Top N memakai daftar
  // video, yang metriknya lain), jadi menunya ikut dibangun ulang -- bukan cuma
  // digambar ulang. Kalau tidak, menu Metrics tertinggal memajang metrik dari
  // tabel sebelumnya.
  const sDim = document.getElementById('selDim');
  if (sDim) sDim.onchange = e => {
    DS.dim = e.target.value;
    DS.vsort = null;                 // urutan tabel ikut disetel ulang
    rapikanDash();
  };
  const sGrp = document.getElementById('selGrp');
  if (sGrp) sGrp.onchange = e => { DS.grup = e.target.value; rapikan(); };

  /* daftar metrik: tampil sebagai satu baris ringkas, dibuka kalau diklik --
     24 metrik yang terhampar sekaligus memenuhi seluruh panel kiri. */
  const drop = document.getElementById('mdMet');
  if (drop){
    const btn = document.getElementById('mdBtn');
    btn.onclick = ev => {
      ev.stopPropagation();
      const buka = drop.classList.toggle('buka');
      btn.setAttribute('aria-expanded', buka ? 'true' : 'false');
    };
    drop.querySelectorAll('.mdlist label').forEach(lb => {
      lb.onclick = ev => {
        ev.preventDefault(); ev.stopPropagation();
        const id = lb.dataset.id, i = DS.metrik.indexOf(id);
        if (i >= 0){
          if (DS.metrik.length === 1) return;      // sisakan minimal satu
          DS.metrik.splice(i, 1);
        } else {
          if (DS.metrik.length >= 6) return;       // lebih dari enam kartu sulit dibaca
          DS.metrik.push(id);
        }
        lb.classList.toggle('on');
        lb.querySelector('input').checked = DS.metrik.includes(id);
        const n = DS.metrik.length;
        const sat = (sumberDash().metrik || []).find(m => m.id === DS.metrik[0]);
        btn.firstElementChild.textContent =
          n === 1 && sat ? namaBersih(sat.label) : `${n} Metrics selected`;
        renderDash();
      };
    });
    document.addEventListener('click', e => {
      if (!drop.contains(e.target)){
        drop.classList.remove('buka');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }
}

bangunFilterDash();

/* ---------- pindah antara Dashboard dan Tanya ---------- */
(function pasangMode(){
  const bD = document.getElementById('mDash'), bC = document.getElementById('mChat');
  const dash = document.getElementById('dash'), chat = document.getElementById('chat');
  const inp = document.querySelector('.inp'), nav = document.getElementById('nav');
  const pilih = mode => {
    const d = mode === 'dash';
    bD.classList.toggle('on', d); bC.classList.toggle('on', !d);
    dash.classList.toggle('on', d);
    chat.style.display = d ? 'none' : '';
    if (nav) nav.style.display = d ? 'none' : '';
    if (inp) inp.style.display = d ? 'none' : '';
    // Baris "Menampilkan ... periode dan nama yang ditulis di pertanyaan tetap
    // diutamakan" bicara soal mengetik pertanyaan -- tidak berlaku di Dashboard.
    const now = document.getElementById('nowP');
    if (now) now.style.display = d ? 'none' : '';
    if (d) renderDash();
  };
  bD.onclick = () => pilih('dash');
  bC.onclick = () => pilih('chat');
  pilih('dash');
})();
