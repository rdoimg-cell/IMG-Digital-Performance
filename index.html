/* ---------- SYARAT ANGKA ---------- */
/* "ER di atas 2%", "revenue di bawah 100 juta", "RPM di bawah rata-rata" */
function bacaSyarat(qRaw){
  const q = qRaw.toLowerCase();
  const m = q.match(/(di\s*atas|lebih\s*dari|melebihi|minimal|>=?|di\s*bawah|kurang\s*dari|maksimal|<=?)\s*(rata-?rata|median|[\d.,]+)\s*(%|persen|juta|jt|ribu|rb|miliar)?/);
  if (!m) return null;
  const naik = /atas|lebih|melebihi|minimal|>/.test(m[1]);
  const rel  = /rata|median/.test(m[2]);
  let nilai = rel ? null : parseFloat(m[2].replace(/\./g, '').replace(',', '.'));
  const sat = m[3] || '';
  if (nilai !== null){
    if (/juta|jt/.test(sat)) nilai *= 1e6;
    else if (/ribu|rb/.test(sat)) nilai *= 1e3;
    else if (/miliar/.test(sat)) nilai *= 1e9;
  }
  // metrik apa yang dimaksud
  let metrik = 'views';
  if (/\ber\b|engagement/.test(q)) metrik = 'er';
  else if (/rpm/.test(q)) metrik = 'rpm';
  else if (/cpm/.test(q)) metrik = 'cpm';
  else if (/ctr/.test(q)) metrik = 'ctr';
  else if (/revenue|pendapatan/.test(q)) metrik = 'revenue';
  else if (/bounce/.test(q)) metrik = 'bounce';
  else if (/follower|subscriber/.test(q)) metrik = 'followers';
  return {naik, rel, nilai, metrik, teks: m[0].trim()};
}

/* Terapkan syarat ke daftar hasil. Mengembalikan {list, info} */
function terapkanSyarat(list, syarat, ambilNilai){
  if (!syarat) return {list, info: ''};
  USED_SYARAT = true;
  const nilai = list.map(ambilNilai).filter(v => isFinite(v));
  if (!nilai.length) return {list, info: ''};
  const ambang = syarat.rel
    ? nilai.reduce((a,b) => a+b, 0) / nilai.length
    : syarat.nilai;
  const hasil = list.filter(x => syarat.naik ? ambilNilai(x) > ambang : ambilNilai(x) < ambang);
  const sat = ['er','ctr','bounce','pct'].includes(syarat.metrik) ? '%' : '';
  const label = syarat.rel ? `rata-rata (${N(ambang)}${sat})` : `${N(ambang)}${sat}`;
  return {list: hasil,
          info: `Disaring: ${syarat.metrik.toUpperCase()} ${syarat.naik ? 'di atas' : 'di bawah'} <b>${label}</b> — `
                + `${hasil.length} dari ${list.length} baris memenuhi.`};
}


/* ---------- KONTEKS PERTANYAAN TERAKHIR ----------
   Setiap pertanyaan tetap dijawab berdiri sendiri, tapi pertanyaan lanjutan
   seperti "bagaimana bulan sebelumnya?" disusun ulang memakai konteks terakhir. */
let LAST_Q = null, LAST_P = null;

function sambungLanjutan(qRaw){
  const q = qRaw.toLowerCase().trim();
  if (!LAST_Q) return null;

  const geser = n => {
    const dasar = LAST_P || (DATA.coverage && DATA.coverage.youtube
      ? mkP(DATA.coverage.youtube.to[0], DATA.coverage.youtube.to[1],
            DATA.coverage.youtube.to[0], DATA.coverage.youtube.to[1]) : null);
    if (!dasar) return null;
    const pjg = (dasar.y2*12 + dasar.m2) - (dasar.y1*12 + dasar.m1) + 1;
    const e = dasar.y1*12 + dasar.m1 - 1 + (n + 1) * pjg;
    const st = e - pjg + 1;
    return mkP(Math.floor((st-1)/12), (st-1)%12+1, Math.floor((e-1)/12), (e-1)%12+1);
  };

  // Penanda KUAT: kalimat pendek yang memang menyambung, mis.
  // "bagaimana dengan bulan sebelumnya?" -> dipakai lebih dulu daripada jawaban biasa.
  const pendek = q.split(/\s+/).length <= 6;
  const awalanLanjut = /^(bagaimana|gimana|kalau|yang tadi|tadi)\b/.test(q);
  if (pendek && awalanLanjut && /\b(bulan|periode)\s+(sebelumnya|lalu)\b/.test(q)){
    const P2 = geser(-1);
    return P2 ? {kuat: true, q: LAST_Q, P: P2, alasan: `melanjutkan "<b>${esc(LAST_Q)}</b>" untuk ${P2.label}`} : null;
  }
  if (pendek && awalanLanjut && /\b(bulan|periode)\s+(berikutnya|sesudahnya|setelahnya)\b/.test(q)){
    const P2 = geser(1);
    return P2 ? {kuat: true, q: LAST_Q, P: P2, alasan: `melanjutkan "<b>${esc(LAST_Q)}</b>" untuk ${P2.label}`} : null;
  }
  // "yang tadi tapi untuk iNews" / "kalau di Okezone?"
  // sengaja cariNama, bukan channelDisebut: konteks lanjutan harus datang dari
  // KATA di pertanyaan, bukan dari filter sidebar
  const ent = cariNama(qRaw, ENTITAS.channel) || cariNama(qRaw, ENTITAS.lain);
  if (ent && q.split(/\s+/).length <= 7 &&
      /^(yang tadi|tadi|kalau|bagaimana|gimana|untuk|di)\b/.test(q)){
    return {kuat: false, q: `${LAST_Q} ${ent}`, P: LAST_P, alasan: `melanjutkan "<b>${esc(LAST_Q)}</b>" untuk <b>${esc(ent)}</b>`};
  }
  return null;
}

/* ---------- ANSWER ENGINE ---------- */
function answer(qRaw){
  const q = qRaw.toLowerCase();
  const has = (...w) => w.some(x => q.includes(x));
  SRC = null;
  USED_ENT = [];
  USED_SYARAT = false;
  FILTER_DIPAKAI = new Set();

  // Lapis 1: maksud yang memang belum didukung -> tolak, jangan tampilkan tabel apa pun
  const tolak = maksudBelumDidukung(qRaw);
  if (tolak) return tolak;

  // Periode dari kalimat; kalau tidak ada, pakai pilihan di panel kiri.
  const P = parsePeriod(qRaw) || ACTIVE_P;

  // "Q1 vs Q2 2026" -> tabel perbandingan dua periode
  const pair = parsePeriodPair(qRaw);
  if (pair) return comparePeriods(qRaw, pair[0], pair[1]);

  /* --- perbandingan 2 cluster spesifik (urutan mengikuti kalimat user) --- */
  const named = DATA.cluster
    .filter(c => q.includes(c.cluster.toLowerCase()))
    .sort((a,b) => q.indexOf(a.cluster.toLowerCase()) - q.indexOf(b.cluster.toLowerCase()));
  if(named.length >= 2 && has('vs','banding','dibanding','compare','lawan')){
    const [a,b] = named;
    USED_ENT = named.map(x => x.cluster);
    const win = a.views > b.views ? a : b, lose = a.views > b.views ? b : a;
    const gap = ((win.views/lose.views - 1)*100).toFixed(1);
    return card(`⚖️ ${a.cluster} vs ${b.cluster}`,
      table(['Metrik', a.cluster, b.cluster],[
        ['Total views', N(a.views), N(b.views)],
        ['Jumlah video', N(a.videos), N(b.videos)],
        ['Rata-rata views/video', N(a.views/a.videos), N(b.views/b.videos)],
        ['Likes', N(a.likes), N(b.likes)],
        ['Comments', N(a.comments), N(b.comments)],
        ['Engagement Rate', PC(a.er), PC(b.er)],
      ]),
      `<b>${win.cluster}</b> unggul ${gap}% di total views. Tapi cek ER — volume besar tidak selalu berarti engagement lebih baik.`);
  }


  /* --- breakdown dimensi per cluster/unit IMG (matriks) --- */
  if(DATA.ts_dim_ch && (() => {
    // Kata "per channel" saja tidak cukup ("RPM per channel" bukan permintaan matriks).
    // Syarat: ada kata breakdown/matriks, ATAU ada nama dimensi + kata "per cluster/unit/channel".
    const tegas  = has('breakdown','break down','rincian per','rinci per','matriks','silang');
    const pecah  = has('per cluster','tiap cluster','setiap cluster','masing-masing cluster',
                       'per unit','tiap unit','setiap unit','masing-masing unit',
                       'per channel','tiap channel','setiap channel','masing-masing channel');
    const adaDim = has('kategori','category','program','acara','part','divisi','sub part','subpart',
                       'original','repack','type content','durasi','panjang video');
    return tegas || (pecah && adaDim);
  })()){
    SRC = 'studio';

    // dimensi apa yang diminta
    const DIMS = [
      {k:'kategori', kata:['kategori','category'],                 label:'Kategori'},
      {k:'program',  kata:['program','acara'],                     label:'Program'},
      {k:'part',     kata:['part','divisi'],                       label:'Part'},
      {k:'subpart',  kata:['sub part','subpart'],                  label:'Sub Part'},
      {k:'original', kata:['original','repack'],                   label:'Original/Repack'},
      {k:'type',     kata:['type content','shorts','vod',' live'], label:'Type Content'},
      {k:'durasi',   kata:['durasi','panjang video'],              label:'Durasi'},
    ];
    const D = DIMS.find(x => x.kata.some(w => q.includes(w))) || DIMS[0];

    // metrik apa yang dipakai
    const M = /revenue|pendapatan|duit|cuan/.test(q) ? {k:'revenue', label:'Revenue', f:RP}
            : /watch|jam tayang|durasi tonton/.test(q) ? {k:'watch', label:'Watch time', f:v=>N(v)+' jam'}
            : /video|episode|jumlah konten/.test(q) ? {k:'videos', label:'Jumlah video', f:N}
            : {k:'views', label:'Views', f:N};

    // kolom: per channel kalau diminta, kalau tidak per unit
    const perChannel = /per channel|tiap channel|setiap channel|masing-masing channel/.test(q);
    const ch2unit = {};
    (DATA.studio || []).forEach(x => ch2unit[x.channel] = x.unit);

    const t = TS('ts_dim_ch'), ix = t.ix;
    const rows = t.rows.filter(r => r[ix.dim] === D.k && inP(r, P));
    if(!rows.length) return card(ttc(`🧮 Breakdown ${D.label}`, P, null),
      kosong('studio', P), '');

    // kalau user menyebut satu cluster, batasi ke cluster itu (kolom = channel-nya)
    let batasUnit = unitDisebut(qRaw);
    if(batasUnit) USED_ENT.push(batasUnit);

    const kolomDari = r => perChannel || batasUnit ? r[ix.channel] : (ch2unit[r[ix.channel]] || '(lain)');
    const mat = new Map(), kolomSet = new Map();
    for(const r of rows){
      const u = ch2unit[r[ix.channel]] || '(lain)';
      if(batasUnit && u !== batasUnit) continue;
      const baris = r[ix.key], kolom = kolomDari(r), v = Number(r[ix[M.k]]) || 0;
      if(!mat.has(baris)) mat.set(baris, new Map());
      mat.get(baris).set(kolom, (mat.get(baris).get(kolom) || 0) + v);
      kolomSet.set(kolom, (kolomSet.get(kolom) || 0) + v);
    }
    if(!mat.size) return card(ttc(`🧮 Breakdown ${D.label}`, P, batasUnit),
      '<div>Tidak ada data untuk kombinasi itu.</div>', '');

    // kolom diurutkan dari yang terbesar; batasi 8 kolom supaya tabel tetap terbaca
    let kolom = [...kolomSet.entries()].sort((a,b) => b[1]-a[1]).map(x => x[0]);
    const dipotong = kolom.length > 8 ? kolom.length - 8 : 0;
    if(dipotong) kolom = kolom.slice(0, 8);

    const baris = [...mat.entries()]
      .map(([k, m2]) => ({k, m2, tot: [...m2.values()].reduce((a,b)=>a+b,0)}))
      .sort((a,b) => b.tot - a.tot)
      .slice(0, 14);
    const totalUmum = baris.reduce((a,x)=>a+x.tot,0);

    const head = [D.label, ...kolom, 'Total'];
    const isi = baris.map((r,i) => [
      rk(i) + esc(r.k),
      ...kolom.map(c => {
        const v = r.m2.get(c) || 0;
        return v ? M.f(v) : '<span style="color:var(--mut)">–</span>';
      }),
      `<b>${M.f(r.tot)}</b>`,
    ]);
    // baris total di bawah
    isi.push(['<b>TOTAL</b>',
      ...kolom.map(c => `<b>${M.f(kolomSet.get(c) || 0)}</b>`),
      `<b>${M.f(totalUmum)}</b>`]);

    // temuan menonjol: untuk tiap kolom, dimensi apa yang paling dominan
    const juara = kolom.map(c => {
      let best = null, bv = 0;
      for(const r of baris){ const v = r.m2.get(c) || 0; if(v > bv){ bv = v; best = r.k; } }
      return best ? `<b>${esc(c)}</b>: ${esc(best)}` : null;
    }).filter(Boolean);

    return card(ttc(`🧮 ${D.label} per ${perChannel || batasUnit ? 'Channel' : 'Cluster'} — ${M.label}`, P, batasUnit),
      table(head, isi),
      `Dominan di tiap kolom → ${juara.join(' · ')}.`
      + (dipotong ? `<br>Menampilkan 8 kolom terbesar; ${dipotong} kolom lain disembunyikan agar tabel tetap terbaca.` : '')
      + (baris.length >= 14 ? `<br>Menampilkan 14 baris teratas.` : '')
      + `<br>Tanda – berarti tidak ada konten kategori itu di kolom tersebut.`
      + catatanCh({channel: batasUnit, hari: null}));
  }

  /* --- dimensi editorial DIPECAH PER BULAN ---
     Pertanyaan seperti "kategori cluster iNews per bulan Januari-Juli" dulu
     dijawab dengan satu tabel gabungan seluruh periode; kata "per bulan"-nya
     hilang begitu saja. Blok ini menangkapnya lebih dulu dan membuat matriks
     dimensi x bulan. */
  if(DATA.ts_dim && /\bper bulan\b|\btiap bulan\b|\bsetiap bulan\b|\bbulanan\b|\bper month\b|\bmasing-masing bulan\b/.test(q)){
    const DIMKATA = [
      ['kategori', ['kategori','category','jenis konten','tipe konten'], 'Kategori'],
      ['program',  ['program','acara','tayangan'],                       'Program'],
      ['part',     ['part','divisi'],                                    'Part'],
      ['subpart',  ['sub part','subpart'],                               'Sub Part'],
      ['original', ['original','repack'],                                'Original'],
      ['type',     ['type content','format konten'],                     'Type Content'],
      ['durasi',   ['8 menit','durasi','panjang video'],                 'Durasi'],
    ];
    const pilih = DIMKATA.find(d => d[1].some(k => q.includes(k)));
    if(pilih){
      SRC = 'studio';
      const [dim, , judulDim] = pilih;
      let CH = channelDisebut(qRaw); if(CH) USED_ENT.push(CH);
      if(!CH){ const U = unitDisebut(qRaw);
        if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
      const metrik = /revenue|pendapatan|duit|cuan/.test(q) ? 'revenue'
                   : /watch time|jam tonton/.test(q) ? 'watch'
                   : /video|jumlah konten/.test(q) ? 'videos' : 'views';
      const namaM = {views:'Views', revenue:'Revenue', watch:'Watch time', videos:'Jumlah video'}[metrik];
      const fmt = metrik === 'revenue' ? RP : metrik === 'watch' ? (v => N(v)+' jam') : N;
      const M = dimPerBulan(dim, P, CH, metrik);
      if(!M.bulan.length) return card(ttc(`📆 ${judulDim} per Bulan`, P, CH), kosong('studio', P), '');

      const BARIS_MAKS = 12, BULAN_MAKS = 14;
      const bulan = M.bulan.slice(-BULAN_MAKS);
      const mulai = M.bulan.length - bulan.length;
      const baris = M.baris.slice(0, BARIS_MAKS);
      const isi = baris.map((b,i) => [rk(i)+esc(b.key),
        ...bulan.map((_,j) => { const v = b.nilai[mulai+j]; return v ? fmt(v) : '–'; }),
        `<b>${fmt(b.total)}</b>`]);
      // baris TOTAL hanya jujur kalau tidak ada baris yang dipotong
      if(baris.length === M.baris.length)
        isi.push([`<b>TOTAL</b>`,
          ...bulan.map((_,j) => `<b>${fmt(M.baris.reduce((s,b)=>s+b.nilai[mulai+j],0))}</b>`),
          `<b>${fmt(M.baris.reduce((s,b)=>s+b.total,0))}</b>`]);

      const labelBulan = t => `${BLN_ID[(t-1)%12].slice(0,3)} ${Math.floor((t-1)/12)}`;
      const dipotong = [];
      if(baris.length < M.baris.length) dipotong.push(`${M.baris.length - baris.length} baris ${judulDim.toLowerCase()} lain disembunyikan`);
      if(bulan.length < M.bulan.length) dipotong.push(`${M.bulan.length - bulan.length} bulan terawal disembunyikan`);
      return card(ttc(`📆 ${judulDim} per Bulan — ${namaM}`, P, CH),
        table([judulDim, ...bulan.map(labelBulan), 'Total'], isi)
        + (dipotong.length ? `<div style="margin-top:6px;font-size:11px;color:var(--mut)">${dipotong.join(' · ')}.</div>` : ''),
        `Matriks ${judulDim.toLowerCase()} × bulan, diurutkan dari total ${namaM.toLowerCase()} terbesar. `
        + `Tanda – berarti tidak ada konten ${judulDim.toLowerCase()} itu di bulan tersebut.`
        + catatanCh({channel: CH, hari: null}));
    }
  }

  /* --- kategori konten --- */
  if(has('kategori','category','jenis konten','tipe konten') && DATA.ts_dim){
    SRC = 'studio';
    let CH = channelDisebut(qRaw); if(CH) USED_ENT.push(CH);
    if(!CH){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
    const KT = kategoriDisebut(qRaw); if(KT) USED_ENT.push(KT);
    const SY = bacaSyarat(qRaw);
    const R = dimRollup('kategori', P, CH);
    if(KT) R.list = R.list.filter(x => x.key.toLowerCase() === KT.toLowerCase());
    const amb = x => SY && SY.metrik==='er' ? x.eng/x.views*100
               : SY && SY.metrik==='revenue' ? x.revenue
               : SY && SY.metrik==='ctr' ? x.ctr : x.views;
    const F = terapkanSyarat(R.list, SY, amb); if(SY) USED_ENT.push(SY.teks);
    const g = F.list.map(x => ({...x, kategori: x.key}));
    if(!g.length) return card(ttc('🗂️ Kategori Konten', P, CH),
      SY ? `<div>Tidak ada kategori yang memenuhi syarat <b>${esc(SY.teks)}</b>.</div>` : kosong('studio', P), '');
    return card(ttc('🗂️ Performa per Kategori Konten', P, CH),
      table(['Kategori','Video','Views','Views/Video','Revenue','ER'],
        g.slice(0,12).map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views),
          N(c.views/c.videos), RP(c.revenue), PC(c.eng/c.views*100)])),
      `<b>${esc(g[0].key)}</b> menyumbang views terbesar. Tapi yang paling efisien per video: `
      + `<b>${esc([...g].sort((a,b)=>b.views/b.videos-a.views/a.videos)[0].key)}</b>. `
      + catatanCh(R) + (F.info ? '<br>' + F.info : ''));
  }

  /* --- program --- */
  if(has('program','acara','tayangan') && DATA.ts_dim){
    SRC = 'studio';
    const PG = programDisebut(qRaw);
    // satu nama bisa jadi program sekaligus channel (mis. 'Rakyat Bersuara');
    // di jawaban program, anggap itu nama program saja
    let CH = channelDisebut(qRaw);
    if (CH && PG && CH.toLowerCase() === PG.toLowerCase()) CH = null;
    if (CH) USED_ENT.push(CH);
    // tanpa channel, coba cluster -- blok ini dulu tidak pernah memanggil unitDisebut,
    // sehingga filter cluster dari sidebar diam-diam tidak pernah terpakai di sini
    if (!CH){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
    const SY = bacaSyarat(qRaw);
    const R = dimRollup('program', P, CH);
    let base = R.list;
    if(PG){ USED_ENT.push(PG); base = base.filter(x => x.key.toLowerCase() === PG.toLowerCase()); }
    const amb = x => SY && SY.metrik==='er' ? x.eng/x.views*100
               : SY && SY.metrik==='revenue' ? x.revenue
               : SY && SY.metrik==='ctr' ? x.ctr : x.views;
    const F = terapkanSyarat(base, SY, amb); if(SY) USED_ENT.push(SY.teks);
    const g = F.list.map(x => ({...x, program: x.key}));
    if(!g.length) return card(ttc(PG ? `📺 Program ${PG}` : '📺 Program Terbaik', P, CH),
      diLuarCakupan('studio', P) ? kosong('studio', P)
      : `<div>Tidak ada data yang cocok${PG ? ` untuk program <b>${esc(PG)}</b>` : ''}${SY ? ` dengan syarat <b>${esc(SY.teks)}</b>` : ''}${CH ? ` di channel <b>${esc(CH)}</b>` : ''}.</div>`, '');
    if(PG && g.length === 1){
      const x = g[0];
      const perCh = DATA.ts_dim_ch ? (() => {
        const t = TS('ts_dim_ch'), ix = t.ix;
        const rr = t.rows.filter(r => r[ix.dim]==='program' && r[ix.key].toLowerCase()===PG.toLowerCase() && inP(r,P));
        const mp = new Map();
        for(const r of rr){
          const k = r[ix.channel]; const o = mp.get(k) || {channel:k, videos:0, views:0, revenue:0};
          o.videos += r[ix.videos]; o.views += r[ix.views]; o.revenue += r[ix.revenue]; mp.set(k,o);
        }
        return [...mp.values()].sort((a,b)=>b.views-a.views);
      })() : [];
      return card(ttc(`📺 Program: ${PG}`, P, CH),
        table(['Metrik','Nilai'],[
          ['Jumlah episode', N(x.videos)],
          ['Total views', N(x.views)],
          ['Views per episode', N(x.views/x.videos)],
          ['Revenue', RP(x.revenue)],
          ['Watch time', N(x.watch)+' jam'],
          ['Engagement per views', PC(x.eng/x.views*100)],
        ]) + (perCh.length > 1 ? `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">Per channel</div>`
          + table(['Channel','Episode','Views','Revenue'],
              perCh.map((c,i)=>[rk(i)+esc(c.channel), N(c.videos), N(c.views), RP(c.revenue)])) : ''),
        catatanCh(R));
    }
    return card(ttc('📺 Program Terbaik', P, CH),
      table(['Program','Episode','Views','Views/Episode','Revenue'],
        g.slice(0,12).map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views),
          N(c.views/c.videos), RP(c.revenue)])),
      `Dari ${g.length} program teratas. Paling efisien per episode: `
      + `<b>${esc([...g].sort((a,b)=>b.views/b.videos-a.views/a.videos)[0].key)}</b>. `
      + `Revenue tertinggi: <b>${esc([...g].sort((a,b)=>b.revenue-a.revenue)[0].key)}</b>.`
      + catatanCh(R) + (F.info ? '<br>' + F.info : ''));
  }

  /* --- part / sub part --- */
  if(has('part','divisi','tv content','digital content') && DATA.ts_dim){
    SRC = 'studio';
    let CH = channelDisebut(qRaw); if(CH) USED_ENT.push(CH);
    if(!CH){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
    const R = dimRollup('part', P, CH), gp = R.list;
    if(!gp.length) return card(ttc('🏢 Performa per Part', P, CH), kosong('studio', P), '');
    let body = table(['Part','Video','Views','Views/Video','Revenue','Watch Time'],
      gp.map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views),
        N(c.views/c.videos), RP(c.revenue), N(c.watch)+' jam']));
    const gs = dimRollup('subpart', P, CH).list;
    if(gs.length) body += `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">Sub Part</div>`
      + table(['Sub Part','Video','Views','Revenue'],
          gs.map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views), RP(c.revenue)]));
    const t = gp.reduce((a,x)=>a+x.views,0);
    return card(ttc('🏢 Performa per Part', P, CH), body,
      `<b>${esc(gp[0].key)}</b> menguasai ${PC(gp[0].views/t*100)} dari views.` + catatanCh(R));
  }

  /* --- original vs repack --- */
  if(has('original','repack','daur ulang') && DATA.ts_dim){
    SRC = 'studio';
    let CH = channelDisebut(qRaw); if(CH) USED_ENT.push(CH);
    if(!CH){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
    const R = dimRollup('original', P, CH), g = R.list, t = g.reduce((a,x)=>a+x.views,0);
    if(!g.length) return card(ttc('♻️ Original vs Repack', P, CH), kosong('studio', P), '');
    return card(ttc('♻️ Original vs Repack', P, CH),
      table(['Jenis','Video','Views','Views/Video','Revenue','Share'],
        g.map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views),
          N(c.views/c.videos), RP(c.revenue), PC(c.views/t*100)])),
      g.length>1 ? `Konten Original menghasilkan ${N(g[0].views/g[0].videos)} views/video, `
        + `Repack ${N(g[1].views/g[1].videos)} views/video — selisih `
        + `${Math.abs(((g[0].views/g[0].videos)/(g[1].views/g[1].videos)-1)*100).toFixed(0)}%.` : '');
  }

  /* --- durasi konten --- */
  if(has('durasi','duration','panjang video','berapa menit') && DATA.ts_dim){
    SRC = 'studio';
    let CH = channelDisebut(qRaw); if(CH) USED_ENT.push(CH);
    if(!CH){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CH = UNIT_CH[U]; CH.label = U; } }
    const R = dimRollup('durasi', P, CH), g = R.list;
    if(!g.length) return card(ttc('⏱️ Performa per Durasi Video', P, CH), kosong('studio', P), '');
    return card(ttc('⏱️ Performa per Durasi Video', P, CH),
      table(['Durasi','Video','Views','Views/Video','% Ditonton','Revenue'],
        g.map((c,i)=>[rk(i)+esc(c.key), N(c.videos), N(c.views),
          N(c.views/c.videos), PC(c.pct), RP(c.revenue)])),
      `Video <b>&gt;8 menit</b> mendominasi revenue karena bisa dipasangi lebih banyak iklan, `
      + `sementara video pendek unggul di persentase ditonton.`);
  }

  /* --- jam posting --- */
  if(has('jam','waktu posting','kapan posting','upload hour','jam tayang','prime time') && DATA.ts_jam){
    SRC = 'scraping';
    // Kalau ada filter cluster/channel, pakai ts_jam_ch (jam x cluster x channel).
    // Tabel itu tanpa sumbu tanggal -- Scraping cuma satu bulan, jadi tidak ada yang hilang.
    let R, all;
    if((ACTIVE_CL || ACTIVE_CH) && DATA.ts_jam_ch){
      const t2 = TS('ts_jam_ch'), ix2 = t2.ix;
      let br = t2.rows;
      if(ACTIVE_CH){ br = br.filter(r => String(r[ix2.channel]).toLowerCase() === ACTIVE_CH.toLowerCase());
                     FILTER_DIPAKAI.add('channel'); }
      else { br = br.filter(r => r[ix2.cluster] === ACTIVE_CL); FILTER_DIPAKAI.add('cluster'); }
      const mp = new Map();
      for(const r of br){
        const j = r[ix2.jam];
        let o = mp.get(j); if(!o){ o = {jam: j, videos: 0, views: 0, er_sum: 0}; mp.set(j, o); }
        o.videos += r[ix2.videos]; o.views += r[ix2.views]; o.er_sum += r[ix2.er_sum];
      }
      R = {list: [...mp.values()], hari: null};
    } else {
      R = tglRollup('ts_jam', P, 'jam', ['videos','views','er_sum']);
    }
    all = R.list.map(x=>({...x, er: x.videos ? x.er_sum/x.videos : 0})).sort((a,b)=>a.jam-b.jam);
    if(!all.length) return card(tt('🕐 Jam Unggah Terbaik', P), kosong('scraping', P), '');
    const g = [...all].sort((a,b)=>b.views-a.views);
    const tot = all.reduce((a,x)=>a+x.views,0), mx = Math.max(...all.map(x=>x.views));
    const spark = `<div style="display:flex;align-items:flex-end;gap:2px;height:64px;margin:12px 0 4px">`
      + all.map(x=>`<div title="Jam ${x.jam}: ${N(x.views)} views"
          style="flex:1;height:${Math.max(4,x.views/mx*100)}%;border-radius:3px 3px 0 0;
          background:linear-gradient(180deg,var(--acc2),var(--acc))"></div>`).join('')
      + `</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)">
         <span>00:00</span><span>views per jam unggah</span><span>23:00</span></div>`;
    return card(tt('🕐 Jam Unggah Terbaik', P),
      table(['Jam','Video','Views','Views/Video','ER'],
        g.slice(0,8).map((c,i)=>[rk(i)+`${String(c.jam).padStart(2,'0')}:00`,
          N(c.videos), N(c.views), N(c.views/c.videos), PC(c.er)])) + spark,
      `Jam <b>${String(g[0].jam).padStart(2,'0')}:00</b> menghasilkan views tertinggi `
      + `(${PC(g[0].views/tot*100)} dari total). Dihitung dari ${R.hari} hari data.`);
  }

  /* --- harian --- */
  if(has('harian','per hari','per tanggal','tanggal berapa','hari terbaik') && DATA.studio_daily){
    SRC = 'studio';
    // Kalau ada filter cluster/channel, deret harian disusun ulang dari ts_money
    // (punya kolom channel); studio_daily sudah teragregasi tanpa channel.
    let t0 = DATA.studio_daily, ix = {}; t0.cols.forEach((c,i)=>ix[c]=i);
    if((ACTIVE_CL || ACTIVE_CH) && DATA.ts_money){
      const tm = TS('ts_money'), ixm = tm.ix;
      let set = null;
      if(ACTIVE_CH){ set = new Set([ACTIVE_CH.toLowerCase()]); FILTER_DIPAKAI.add('channel'); }
      else if(UNIT_CH[ACTIVE_CL]){ set = new Set(UNIT_CH[ACTIVE_CL].map(x=>x.toLowerCase()));
                                   FILTER_DIPAKAI.add('cluster'); }
      if(set){
        const mp = new Map();
        for(const r of tm.rows){
          if(!set.has(String(r[ixm.channel]).toLowerCase())) continue;
          const d = r[ixm.tgl];
          let o = mp.get(d); if(!o){ o = [d,0,0,0,0,0]; mp.set(d,o); }
          o[1] += r[ixm.videos]; o[2] += r[ixm.views]; o[3] += r[ixm.revenue];
          o[4] += (r[ixm.likes]||0)+(r[ixm.shares]||0)+(r[ixm.comments]||0);
        }
        t0 = {cols: ['tgl','videos','views','revenue','eng','watch'], rows: [...mp.values()]};
        ix = {}; t0.cols.forEach((c,i)=>ix[c]=i);
      }
    }
    const t = {cols: t0.cols, rows: t0.rows.filter(r => inDate(r[ix.tgl], P))};
    if(!t.rows.length) return card(tt('📅 Performa Harian', P), kosong('studio', P), '');
    const rows = [...t.rows].sort((a,b)=>b[ix.views]-a[ix.views]);
    const mx = Math.max(...t.rows.map(r=>r[ix.views]));
    const spark = `<div style="display:flex;align-items:flex-end;gap:2px;height:64px;margin:12px 0 4px">`
      + t.rows.map(r=>`<div title="${r[ix.tgl]}: ${N(r[ix.views])} views"
          style="flex:1;height:${Math.max(4,r[ix.views]/mx*100)}%;border-radius:3px 3px 0 0;
          background:linear-gradient(180deg,var(--acc2),var(--acc))"></div>`).join('')
      + `</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)">
         <span>${t.rows[0][ix.tgl]}</span><span>views harian</span><span>${t.rows[t.rows.length-1][ix.tgl]}</span></div>`;
    return card(tt('📅 Performa Harian', P),
      table(['Tanggal','Video','Views','Revenue'],
        rows.slice(0,8).map((r,i)=>[rk(i)+r[ix.tgl], N(r[ix.videos]), N(r[ix.views]), RP(r[ix.revenue])])) + spark,
      `Hari terbaik: <b>${rows[0][ix.tgl]}</b> dengan ${N(rows[0][ix.views])} views. `
      + `Total ${t.rows.length} hari data.`);
  }

  /* --- demografi --- */
  if(has('demografi','umur','usia','gender','jenis kelamin','audiens','penonton perempuan','penonton laki') && DATA.ts_demografi){
    SRC = 'socmed';
    const cols = DATA.ts_demografi.cols.filter(c => c!=='y' && c!=='m' && c!=='platform' && c!=='unit');
    const adaUnit = DATA.ts_demografi.cols.includes('unit');
    const R = bulanRollup('ts_demografi', P, adaUnit ? ['platform','unit'] : ['platform'], [], cols);
    let g = R.list;
    // demografi punya kolom unit -> cluster bisa disaring; channel tidak ada di sini
    if(adaUnit && ACTIVE_CL && !ACTIVE_CH && g.some(x => x.unit === ACTIVE_CL)){
      g = g.filter(x => x.unit === ACTIVE_CL); FILTER_DIPAKAI.add('cluster');
    }
    if(!g.length) return card(tt('👤 Demografi Audiens', P), kosong('socmed', P), '');
    const ages = cols.filter(k=>k.includes('Years'));
    return card(tt('👤 Demografi Audiens Social Media', P),
      table(['Platform','Laki-laki','Perempuan', ...ages.map(a=>a.replace(' Years',''))],
        g.map(p=>[esc(p.platform), PC(p.Male), PC(p.Female), ...ages.map(a=>PC(p[a]))])),
      `Kelompok umur terbesar rata-rata <b>25–34 tahun</b>. `
      + `TikTok punya proporsi 18–24 tahun paling tinggi — cocok untuk konten yang menyasar anak muda. `
      + `Rata-rata dari ${R.bulan} bulan data.`);
  }

  /* --- monetisasi RPM/CPM --- */
  if(has('rpm','cpm','iklan','ads','monetisasi per') && DATA.ts_money){
    SRC = 'studio';
    const R = tglRollup('ts_money', P, 'channel', ['videos','views','revenue','rpm_sum','cpm_sum','likes','shares','comments']);
    const g = R.list.map(x=>({...x, rpm: x.videos?x.rpm_sum/x.videos:0, cpm: x.videos?x.cpm_sum/x.videos:0}))
                    .filter(x=>x.revenue>0).sort((a,b)=>b.rpm-a.rpm);
    let CHm = channelDisebut(qRaw); if(CHm) USED_ENT.push(CHm);
    if(!CHm){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CHm = UNIT_CH[U]; CHm.label = U; } }
    const SYm = bacaSyarat(qRaw);
    // CHm bisa satu nama channel ATAU daftar channel (kalau yang dipilih sebuah cluster)
    const setM = CHm ? new Set((Array.isArray(CHm) ? CHm : [CHm]).map(x => String(x).toLowerCase())) : null;
    let gm2 = setM ? g.filter(x => setM.has(String(x.channel).toLowerCase())) : g;
    const ambM = x => SYm && SYm.metrik==='cpm' ? x.cpm : SYm && SYm.metrik==='revenue' ? x.revenue : x.rpm;
    const Fm = terapkanSyarat(gm2, SYm, ambM); if(SYm) USED_ENT.push(SYm.teks);
    gm2 = Fm.list;
    if(!gm2.length) return card(ttc('💵 Efisiensi Monetisasi', P, CHm),
      diLuarCakupan('studio', P) ? kosong('studio', P)
      : `<div>Tidak ada channel yang cocok${SYm ? ` dengan syarat <b>${esc(SYm.teks)}</b>` : ''}.</div>`, '');
    return card(ttc('💵 Efisiensi Monetisasi per Channel', P, CHm),
      table(['Channel','RPM','CPM','Revenue','Like','Share'],
        gm2.slice(0,12).map((c,i)=>[rk(i)+esc(c.channel), RP(c.rpm), RP(c.cpm),
          RP(c.revenue), N(c.likes), N(c.shares)])),
      `RPM = pendapatan per 1.000 views, CPM = biaya pengiklan per 1.000 tayangan iklan. `
      + `RPM tertinggi: <b>${esc(gm2[0].channel)}</b> (${RP(gm2[0].rpm)}).`
      + (Fm.info ? '<br>' + Fm.info : ''));
  }

  /* --- kualitas trafik portal --- */
  if(has('bounce','durasi kunjungan','kualitas trafik','lama kunjungan') && DATA.ts_portal){
    SRC = 'portal';
    const R = rollup(TS('ts_portal'), P, ['group','portal'], ['visits','dur_sum','bounce_sum','n']);
    const g = R.list.map(x=>({...x, durasi_detik: x.n?x.dur_sum/x.n:0, bounce: x.n?x.bounce_sum/x.n:0}))
                    .filter(x=>x.visits>0).sort((a,b)=>b.durasi_detik-a.durasi_detik);
    if(!g.length) return card(tt('🎯 Kualitas Trafik Portal', P), kosong('portal', P), '');
    const mmss = d => `${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,'0')}`;
    return card(tt('🎯 Kualitas Trafik Portal', P),
      table(['Portal','Durasi Kunjungan','Bounce Rate','Visits'],
        g.slice(0,12).map((c,i)=>[rk(i)+esc(c.portal)+' '+(c.group==='Competitor'?'<span class="tag cmp">Kompetitor</span>':'<span class="tag img">IMG</span>'),
          mmss(c.durasi_detik), PC(c.bounce*100), N(c.visits)])),
      `Durasi kunjungan terlama: <b>${esc(g[0].portal)}</b> (${mmss(g[0].durasi_detik)}). `
      + `Bounce rate rendah + durasi lama = pembaca benar-benar membaca, bukan sekadar mampir.`);
  }

  /* --- revenue portal per tipe --- */
  if(has('artikel','banner','programmatic','direct sales','jenis penjualan','tipe revenue') && DATA.ts_portal_tipe){
    SRC = 'portal_sales';
    const adaChP = DATA.ts_portal_tipe.cols.includes('channel');
    const R = bulanRollup('ts_portal_tipe', P, adaChP ? ['tipe','channel'] : ['tipe'], ['revenue']);
    let g0 = R.list.filter(x=>x.revenue>0);
    // nama channel di sheet ini = nama portal/cluster ('iNews', 'Okezone', ...)
    if(adaChP && ACTIVE_CL && !ACTIVE_CH && g0.some(x => awalanSama(x.channel, ACTIVE_CL))){
      g0 = g0.filter(x => awalanSama(x.channel, ACTIVE_CL)); FILTER_DIPAKAI.add('cluster');
    }
    const gg = new Map();
    for(const x of g0){ const o = gg.get(x.tipe) || {tipe: x.tipe, revenue: 0}; o.revenue += x.revenue; gg.set(x.tipe, o); }
    const g = [...gg.values()].sort((a,b)=>b.revenue-a.revenue);
    if(!g.length) return card(tt('🧾 Revenue Portal per Jenis Penjualan', P), kosong('portal_sales', P), '');
    const t = g.reduce((a,x)=>a+x.revenue,0);
    return card(tt('🧾 Revenue Portal per Jenis Penjualan', P),
      table(['Jenis','Revenue','Share'],
        g.map((c,i)=>[rk(i)+esc(c.tipe), RP(c.revenue), PC(c.revenue/t*100)])),
      `Total <b>${RP(t)}</b> dari ${R.bulan} bulan. <b>${esc(g[0].tipe)}</b> menyumbang ${PC(g[0].revenue/t*100)}.`);
  }


  /* --- audit / kualitas nama channel --- */
  if(has('nama channel','penamaan','audit','kualitas data','cek data','duplikat','digabung') && DATA.audit){
    const a = DATA.audit;
    const tot = a.rename.reduce((x,r)=>x+r.baris,0);
    let body = a.rename.length
      ? table(['Ditulis di Excel','Diseragamkan jadi','Baris'],
          a.rename.map((r,i)=>[rk(i)+esc(r.dari), esc(r.jadi), N(r.baris)]))
      : '<div>Tidak ada nama yang perlu diseragamkan.</div>';

    if(a.unknown && a.unknown.length){
      body += `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--bad);font-weight:700">Belum dikenali</div>`
        + table(['Sheet','Nama','Mungkin maksudnya'],
            a.unknown.map(u=>[esc(u.sheet), esc(u.nama), u.mirip ? esc(u.mirip) : '—']));
    }

    body += `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">20 nama baku (acuan: sheet Youtube Studio)</div>`
      + `<div style="margin-top:6px;line-height:1.9">` +
        a.canon.map(c=>`<span class="tag img" style="margin:0 4px 4px 0">${esc(c)}</span>`).join('') + `</div>`;

    return card('🧹 Penyeragaman Nama Channel', body,
      a.unknown && a.unknown.length
        ? `<b style="color:var(--bad)">${a.unknown.length} nama belum dikenali</b> — perlu ditambahkan ke tabel alias, atau diperbaiki di Excel-nya.`
        : `<b>${N(tot)} baris</b> diseragamkan dari ${a.rename.length} varian penulisan. Semua nama sudah cocok dengan 20 channel baku. `
          + `File Excel <b>tidak diubah</b> — penyeragaman dilakukan saat data diolah, jadi otomatis berlaku lagi tiap kali update.`);
  }

  /* --- cakupan data --- */
  if(has('berapa channel','cakupan','coverage','data apa saja','sumber data','berapa banyak channel')){
    const g = DATA.cluster_channels || [];
    const img = g.filter(x=>x.img), cmp = g.filter(x=>!x.img);
    const sum = a => a.reduce((s,x)=>s+x.channels,0);
    return card('📚 Cakupan Data',
      table(['Cluster','Channel','Video Dianalisis','Status'],
        g.map(c=>[esc(c.cluster), N(c.channels), N(c.videos),
          c.img?'<span class="tag img">IMG</span>':'<span class="tag cmp">Kompetitor</span>'])),
      `<b>${sum(img)} channel IMG</b> dan <b>${sum(cmp)} channel kompetitor</b> di file Scraping. `
      + `YouTube & socmed punya data bulanan ${DATA.coverage?`${DATA.coverage.youtube.from[1]}/${DATA.coverage.youtube.from[0]}–${DATA.coverage.youtube.to[1]}/${DATA.coverage.youtube.to[0]}`:''}, `
      + `Scraping mencakup ${rentangSumber('scraping') || '—'}, `
      + `dan YouTube Studio ${rentangSumber('studio') || '—'} (rinci sampai per tanggal).`);
  }


  /* --- peringkat bersyarat: channel mana yang naik / turun --- */
  if(/\b(mana|siapa)\b/.test(q) && /\b(naik|turun|menurun|meningkat|tumbuh|anjlok|melonjak)\b/.test(q)){
    SRC = 'youtube';
    const cov = DATA.coverage.youtube;
    // periode pembanding: kalau user menyebut periode, bandingkan dengan sepanjang itu
    // sebelumnya; kalau tidak, bandingkan bulan terakhir dengan bulan sebelumnya
    let A, B;
    if(P){
      const pjg = (P.y2*12+P.m2) - (P.y1*12+P.m1) + 1;
      const e = P.y1*12 + P.m1 - 1, st = e - pjg + 1;
      B = mkP(Math.floor((st-1)/12), (st-1)%12+1, Math.floor((e-1)/12), (e-1)%12+1);
      A = P;
    } else {
      const t2 = cov.to[0]*12 + cov.to[1], t1 = t2 - 1;
      A = mkP(Math.floor((t2-1)/12), (t2-1)%12+1, Math.floor((t2-1)/12), (t2-1)%12+1);
      B = mkP(Math.floor((t1-1)/12), (t1-1)%12+1, Math.floor((t1-1)/12), (t1-1)%12+1);
    }
    const metrik = /revenue|pendapatan|duit|cuan/.test(q) ? 'revenue'
                 : /subscriber|follower/.test(q) ? 'subs_gained' : 'views';
    const namaM = {revenue:'Revenue', subs_gained:'Subscriber bertambah', views:'Views'}[metrik];
    const fmt = metrik === 'revenue' ? RP : N;
    const amb = Pq => { const o = {}; rollup(TS('ts_youtube'), Pq, ['channel'], [metrik]).list
                          .forEach(x => o[x.channel] = x[metrik]); return o; };
    const a = amb(A), b = amb(B);
    const naikTanya = /naik|meningkat|tumbuh|melonjak/.test(q);
    let rows = Object.keys({...a, ...b}).map(ch => {
      const va = a[ch] || 0, vb = b[ch] || 0;
      return {ch, va, vb, d: vb ? (va/vb - 1) * 100 : (va ? 100 : 0), abs: va - vb};
    }).filter(x => x.va || x.vb);
    rows = rows.filter(x => naikTanya ? x.abs > 0 : x.abs < 0)
               .sort((x,y) => naikTanya ? y.abs - x.abs : x.abs - y.abs);
    if(!rows.length) return card(`📉 Channel yang ${naikTanya ? 'naik' : 'turun'}`,
      `<div>Tidak ada channel yang ${naikTanya ? 'naik' : 'turun'} pada perbandingan ini.</div>`,
      `Membandingkan <b>${A.label}</b> terhadap <b>${B.label}</b>.`);
    const tot = rows.reduce((s2,x)=>s2+x.abs,0);
    return card(`${naikTanya ? '📈' : '📉'} Channel yang ${naikTanya ? 'Naik' : 'Turun'} — ${namaM}`,
      table(['Channel', B.label, A.label, 'Selisih', '%'],
        rows.slice(0,12).map((x,i)=>[rk(i)+esc(x.ch), fmt(x.vb), fmt(x.va),
          `<span style="color:${x.abs>=0?'var(--ok)':'var(--bad)'}">${x.abs>=0?'+':''}${fmt(x.abs)}</span>`,
          `${x.d>=0?'+':''}${x.d.toFixed(1)}%`])),
      `<b>${rows.length} channel</b> ${naikTanya ? 'naik' : 'turun'}, total ${fmt(Math.abs(tot))}. `
      + `Penyumbang terbesar: <b>${esc(rows[0].ch)}</b> (${fmt(Math.abs(rows[0].abs))}). `
      + `Membandingkan ${A.label} terhadap ${B.label}.`
      + covNote(A,'youtube') + covNote(B,'youtube'));
  }

  /* --- analisis kontribusi: apa yang membuat angka berubah --- */
  if(/\b(kenapa|mengapa|penyebab|sebabnya|apa yang menyebabkan|apa yang membuat|faktor)\b/.test(q)){
    SRC = 'youtube';
    const cov = DATA.coverage.youtube;
    const pasang = parsePeriodPair(qRaw);
    let A, B;
    if(pasang){ A = pasang[0]; B = pasang[1]; }
    else if(P){
      const pjg = (P.y2*12+P.m2) - (P.y1*12+P.m1) + 1;
      const e = P.y1*12 + P.m1 - 1, st = e - pjg + 1;
      A = P; B = mkP(Math.floor((st-1)/12), (st-1)%12+1, Math.floor((e-1)/12), (e-1)%12+1);
    } else {
      const t2 = cov.to[0]*12 + cov.to[1], t1 = t2 - 1;
      A = mkP(Math.floor((t2-1)/12), (t2-1)%12+1, Math.floor((t2-1)/12), (t2-1)%12+1);
      B = mkP(Math.floor((t1-1)/12), (t1-1)%12+1, Math.floor((t1-1)/12), (t1-1)%12+1);
    }
    const metrik = /revenue|pendapatan|duit|cuan/.test(q) ? 'revenue'
                 : /subscriber|follower/.test(q) ? 'subs_gained' : 'views';
    const namaM = {revenue:'Revenue', subs_gained:'Subscriber bertambah', views:'Views'}[metrik];
    const fmt = metrik === 'revenue' ? RP : N;
    const CHq = channelDisebut(qRaw); if(CHq) USED_ENT.push(CHq);
    const amb = Pq => { const o = {};
      rollup(TS('ts_youtube'), Pq, ['channel'], [metrik]).list
        .filter(x => !CHq || x.channel.toLowerCase() === CHq.toLowerCase())
        .forEach(x => o[x.channel] = x[metrik]); return o; };
    const a = amb(A), b = amb(B);
    const ta = Object.values(a).reduce((s2,v)=>s2+v,0), tb = Object.values(b).reduce((s2,v)=>s2+v,0);
    if(!ta && !tb) return card('🔎 Analisis Kontribusi', kosong('youtube', A), '');
    const rows = Object.keys({...a,...b}).map(ch => {
      const va = a[ch]||0, vb = b[ch]||0, d = va - vb;
      return {ch, va, vb, d, andil: (tb - ta) ? d / (ta - tb) * 100 : 0};
    }).filter(x => x.d).sort((x,y) => Math.abs(y.d) - Math.abs(x.d));
    const selisih = ta - tb;
    const turun = selisih < 0;
    const dugaTurun = /turun|menurun|anjlok|lebih rendah|berkurang|drop/.test(q);
    const dugaNaik  = /naik|meningkat|melonjak|lebih tinggi|bertambah/.test(q);
    // kalau arah perubahan ternyata berlawanan dengan dugaan di pertanyaan, katakan
    const koreksi = (dugaTurun && !turun) ? `<div class="warn"><span class="t">ℹ️ Arahnya justru sebaliknya</span>
        ${namaM} <b>tidak turun</b> pada perbandingan ini — malah <b>naik ${fmt(Math.abs(selisih))}</b>
        (${(Math.abs(selisih)/(tb||1)*100).toFixed(1)}%) dari ${B.label} ke ${A.label}.</div>`
      : (dugaNaik && turun) ? `<div class="warn"><span class="t">ℹ️ Arahnya justru sebaliknya</span>
        ${namaM} <b>tidak naik</b> pada perbandingan ini — malah <b>turun ${fmt(Math.abs(selisih))}</b>
        (${(Math.abs(selisih)/(tb||1)*100).toFixed(1)}%) dari ${B.label} ke ${A.label}.</div>` : '';
    const andilBesar = rows.some(x => Math.abs(x.andil) > 100);
    return card(`🔎 Apa yang Membuat ${namaM} ${turun ? 'Turun' : 'Naik'}?`, koreksi +
      table(['Channel', B.label, A.label, 'Selisih', 'Andil'],
        rows.slice(0,10).map((x,i)=>[rk(i)+esc(x.ch), fmt(x.vb), fmt(x.va),
          `<span style="color:${x.d>=0?'var(--ok)':'var(--bad)'}">${x.d>=0?'+':''}${fmt(x.d)}</span>`,
          `${x.andil>=0?'+':''}${x.andil.toFixed(0)}%`])),
      `Total ${namaM.toLowerCase()} ${turun ? 'turun' : 'naik'} <b>${fmt(Math.abs(selisih))}</b> `
      + `(${(Math.abs(selisih)/(tb||1)*100).toFixed(1)}%) dari ${B.label} ke ${A.label}. `
      + `Penyumbang perubahan terbesar: <b>${esc(rows[0].ch)}</b> (${rows[0].d >= 0 ? '+' : ''}${fmt(rows[0].d)}).`
      + (andilBesar ? `<br>Kolom "Andil" bisa melebihi 100% karena kenaikan di satu channel saling meniadakan dengan penurunan di channel lain.` : '')
      + `<br>⚠️ Ini <b>penguraian angka</b>, bukan sebab sesungguhnya — menunjukkan <i>di mana</i> perubahan terjadi, bukan <i>mengapa</i>.`
      + covNote(A,'youtube') + covNote(B,'youtube'));
  }

  /* --- deteksi anomali --- */
  if(has('anomali','janggal','aneh','tidak wajar','outlier','lonjakan','anjlok tiba')){
    SRC = 'studio';
    const t = DATA.studio_daily; if(!t) return card('🔍 Deteksi Anomali', kosong('studio', P), '');
    const ix = {}; t.cols.forEach((c,i)=>ix[c]=i);
    const rows = t.rows.filter(r => inDate(r[ix.tgl], P));
    if(rows.length < 5) return card(tt('🔍 Deteksi Anomali', P),
      '<div>Data harian terlalu sedikit untuk menilai kewajaran.</div>', '');
    const v = rows.map(r => r[ix.views]);
    const rata = v.reduce((a,b)=>a+b,0)/v.length;
    const sd = Math.sqrt(v.reduce((a,b)=>a+(b-rata)**2,0)/v.length);
    const skor = rows.map(r => ({tgl:r[ix.tgl], views:r[ix.views], videos:r[ix.videos],
                                 revenue:r[ix.revenue], z:(r[ix.views]-rata)/(sd||1)}))
                     .filter(x => Math.abs(x.z) >= 1.8)
                     .sort((a,b)=>Math.abs(b.z)-Math.abs(a.z));
    if(!skor.length) return card(tt('🔍 Deteksi Anomali', P),
      `<div>Tidak ada hari yang menyimpang jauh dari kebiasaan. Semua di rentang wajar `
      + `(${N(rata-1.8*sd)} – ${N(rata+1.8*sd)} views).</div>`,
      `Rata-rata harian ${N(rata)} views, simpangan baku ${N(sd)}. Dinilai dari ${rows.length} hari.`);
    return card(tt('🔍 Hari yang Menyimpang', P),
      table(['Tanggal','Views','Video','Revenue','Simpangan'],
        skor.slice(0,10).map((x,i)=>[rk(i)+x.tgl, N(x.views), N(x.videos), RP(x.revenue),
          `<span style="color:${x.z>=0?'var(--ok)':'var(--bad)'}">${x.z>=0?'▲':'▼'} ${Math.abs(x.z).toFixed(1)}σ</span>`])),
      `Rata-rata harian <b>${N(rata)}</b> views. ${skor.length} hari menyimpang lebih dari 1,8 simpangan baku. `
      + `Tanda ▲ berarti jauh di atas kebiasaan, ▼ jauh di bawah. `
      + `<br>⚠️ Ini penanda statistik, bukan berarti datanya salah — bisa jadi memang ada peristiwa besar hari itu.`);
  }

  /* --- korelasi antar metrik --- */
  if(has('korelasi','hubungan antara','berbanding lurus','berbanding terbalik','berkaitan dengan')){
    SRC = 'youtube';
    const R = rollup(TS('ts_youtube'), P, ['channel'], ['views','revenue','watch','subs_gained']).list;
    if(R.length < 3) return card(tt('🔗 Korelasi', P), kosong('youtube', P), '');
    const pearson = (xs, ys) => {
      const n = xs.length, mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
      let sxy=0, sx=0, sy=0;
      for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sx+=dx*dx; sy+=dy*dy; }
      return (sx&&sy) ? sxy/Math.sqrt(sx*sy) : 0;
    };
    const arti = r => Math.abs(r)>=.8 ? 'sangat kuat' : Math.abs(r)>=.6 ? 'kuat'
                    : Math.abs(r)>=.4 ? 'sedang' : Math.abs(r)>=.2 ? 'lemah' : 'hampir tidak ada';
    const pasang = [['Views','Revenue','views','revenue'], ['Views','Watch time','views','watch'],
                    ['Views','Subscriber','views','subs_gained'], ['Watch time','Revenue','watch','revenue'],
                    ['Subscriber','Revenue','subs_gained','revenue']];
    // deret bulanan (total seluruh channel) -> lebih informatif karena tidak
    // terpengaruh perbedaan ukuran antar channel
    const perBulan = new Map();
    for(const r of TS('ts_youtube').rows){
      if(!inP(r, P)) continue;
      const k = r[0]*12 + r[1];
      const o = perBulan.get(k) || {views:0, revenue:0, watch:0, subs_gained:0};
      const ixy = TS('ts_youtube').ix;
      o.views += r[ixy.views]; o.revenue += r[ixy.revenue];
      o.watch += r[ixy.watch]; o.subs_gained += r[ixy.subs_gained];
      perBulan.set(k, o);
    }
    const M = [...perBulan.values()];
    const baris = pasang.map(([na,nb,ka,kb]) => {
      const rc = pearson(R.map(x=>x[ka]), R.map(x=>x[kb]));
      const rm = M.length >= 3 ? pearson(M.map(x=>x[ka]), M.map(x=>x[kb])) : null;
      return [`${na} ↔ ${nb}`, rc.toFixed(2), rm===null ? '—' : rm.toFixed(2),
              rm===null ? '—' : `${rm>=0?'searah':'berlawanan'}, ${arti(rm)}`];
    });
    return card(tt('🔗 Hubungan Antar Metrik', P),
      table(['Pasangan metrik','Antar channel','Antar bulan','Kekuatan (antar bulan)'], baris),
      `<b>Antar channel</b> (${R.length} channel) hampir selalu mendekati 1 — wajar, karena channel besar `
      + `unggul di semua metrik sekaligus. Yang lebih berguna adalah <b>antar bulan</b> `
      + `(${M.length} bulan): apakah saat views naik, revenue ikut naik. `
      + `<br>Nilai 1 berarti bergerak seiring sempurna, 0 tidak berhubungan, −1 berlawanan arah. `
      + `<br>⚠️ Korelasi <b>bukan</b> sebab-akibat.`);
  }

  /* --- proyeksi sederhana --- */
  if(has('prediksi','perkiraan','proyeksi','forecast','ramalan','bulan depan','tahun depan','estimasi bulan')){
    SRC = 'youtube';
    const t = TS('ts_youtube'), ix = t.ix;
    const metrik = /views|tonton/.test(q) ? 'views' : 'revenue';
    const namaM = metrik === 'views' ? 'Views' : 'Revenue';
    const fmt = metrik === 'views' ? N : RP;
    const per = new Map();
    for(const r of t.rows){
      const k = r[0]*12 + r[1];
      per.set(k, (per.get(k)||0) + r[ix[metrik]]);
    }
    const seri = [...per.entries()].sort((a,b)=>a[0]-b[0]);
    if(seri.length < 4) return card('🔮 Proyeksi', '<div>Data bulanan terlalu sedikit.</div>', '');
    const n = Math.min(6, seri.length);
    const ak = seri.slice(-n);
    // regresi linear sederhana atas n bulan terakhir
    const xs = ak.map((_,i)=>i), ys = ak.map(x=>x[1]);
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let sxy=0, sxx=0;
    for(let i=0;i<n;i++){ sxy += (xs[i]-mx)*(ys[i]-my); sxx += (xs[i]-mx)**2; }
    const b1 = sxx ? sxy/sxx : 0, b0 = my - b1*mx;
    const rata = my;
    const proy = [1,2,3].map(k => ({k, lin: Math.max(0, b0 + b1*(n-1+k)), rata}));
    const akhir = seri[seri.length-1][0];
    const lbl = k => { const t2 = akhir + k; return `${BLN_ID[(t2-1)%12]} ${Math.floor((t2-1)/12)}`; };
    return card(`🔮 Proyeksi ${namaM} (sederhana)`,
      table(['Bulan','Proyeksi tren','Rata² 6 bulan terakhir'],
        proy.map(x => [lbl(x.k), fmt(x.lin), fmt(x.rata)]))
      + `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">Dasar perhitungan</div>`
      + table(['Bulan','Realisasi'], ak.map(x => [`${BLN_ID[(x[0]-1)%12]} ${Math.floor((x[0]-1)/12)}`, fmt(x[1])])),
      `Dihitung dengan garis tren lurus atas <b>${n} bulan terakhir</b> — metode paling sederhana. `
      + `Arah tren ${b1>=0 ? '<b>naik</b>' : '<b>turun</b>'} ${fmt(Math.abs(b1))} per bulan. `
      + `<br>⚠️ Ini <b>bukan ramalan</b>. Tidak memperhitungkan musim, hari besar, perubahan strategi, maupun algoritma platform. `
      + `Pakai sebagai patokan kasar saja.`);
  }

  /* --- profitable / revenue --- */
  if(has('profit','revenue','duit','uang','cuan','penghasilan','pendapatan','menguntungkan','monetisasi')){
    let CHr = channelDisebut(qRaw); let labelR = CHr;
    if(CHr) USED_ENT.push(CHr);
    if(!CHr){ const U = unitDisebut(qRaw);
      if(U){ USED_ENT.push(U); CHr = UNIT_CH[U]; labelR = U; } }
    const setR = CHr ? new Set((Array.isArray(CHr)?CHr:[CHr]).map(x=>String(x).toLowerCase())) : null;
    // kalau diminta "per cluster" dan tidak menyebut satu cluster tertentu -> gabungkan per cluster
    const revCluster = !CHr && /cluster|kluster|\bunit\b|divisi/.test(q);
    const grainR = revCluster ? 'unit' : 'channel';
    const R = rollup(TS('ts_youtube'), P, [grainR], ['revenue','views']);
    const g = R.list.filter(x => x.revenue>0 && (!setR || setR.has(x.channel.toLowerCase())))
                    .sort((a,b)=>b.revenue-a.revenue);
    if(!g.length) return card(ttc('💰 Revenue YouTube IMG', P, labelR),
      '<div>Tidak ada data revenue untuk periode itu.</div>', covNote(P,'youtube'));
    const tot = g.reduce((s,x)=>s+x.revenue,0);
    const rev = revCluster ? g : g.slice(0,10);
    const namaR = x => revCluster ? x.unit : x.channel;

    let body = table([revCluster?'Cluster':'Channel','Revenue (IDR)','Share'],
      rev.map((r,i)=>[rk(i)+esc(namaR(r)), RP(r.revenue), PC(r.revenue/tot*100)])
      .concat(revCluster ? [['<b>TOTAL</b>', `<b>${RP(tot)}</b>`, `<b>${PC(100)}</b>`]] : []));

    // Rincian sumber revenue tidak punya kolom channel, jadi angkanya selalu
    // seluruh IMG. Kalau tabel utama sedang disaring, menampilkannya di kartu yang
    // sama membuat dua angka berbeda terlihat seperti bagian dari satu hitungan.
    const src = rollup(TS('ts_revenue_source'), P, ['source'], ['revenue']).list.filter(x=>x.revenue>0);
    if(src.length && CHr){
      body += `<div style="margin-top:12px;font-size:11px;color:var(--mut);line-height:1.55">`
        + `Rincian <b>sumber revenue</b> (Watch Page ads, Premium, dll) tidak ditampilkan di sini: `
        + `sumbernya tidak memisahkan per channel, jadi angkanya seluruh IMG dan tidak sebanding `
        + `dengan tabel di atas. Hapus filter untuk melihatnya.</div>`;
    } else if(src.length){
      src.sort((a,b)=>b.revenue-a.revenue);
      body += `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">Sumber revenue</div>`
        + table(['Sumber','Revenue (IDR)'], src.slice(0,6).map((r,i)=>[rk(i)+esc(r.source), RP(r.revenue)]));
    }
    const perMo = R.months ? tot/R.months : 0;
    return card(ttc('💰 Revenue YouTube IMG', P, labelR), body,
      `Total revenue <b>${RP(tot)}</b>${P?` sepanjang ${P.label}`:' (seluruh data)'} dari ${R.months} bulan `
      + `(rata-rata <b>${RP(perMo)}</b>/bulan). <b>${esc(namaR(rev[0]))}</b> menyumbang ${PC(rev[0].revenue/tot*100)}.`
      + covNote(P,'youtube'));
  }

  /* --- subscriber (dicek lebih dulu: kata "subscriber" mengandung pola "er ") --- */
  if(has('subscriber','subs ','pelanggan','follower')){
    // "follower" untuk platform socmed ditangani blok platform di bawah
    if(!has('tiktok','instagram','facebook','twitter','socmed','sosmed','platform')){
      platformCocok('YouTube');
      const g = saringCl(rollup(TS('ts_youtube'), P, ['unit','channel'], ['subs_gained','views'], ['lifetime']).list,
                         x => x.unit, x => x.channel).sort((a,b)=>b.lifetime-a.lifetime);
      if(!g.length) return card(tt('👥 Subscriber YouTube IMG', P),
        '<div>Tidak ada data untuk periode itu.</div>', covNote(P,'youtube'));
      const totL = g.reduce((s,x)=>s+x.lifetime,0), totG = g.reduce((s,x)=>s+x.subs_gained,0);
      return card(tt('👥 Subscriber YouTube IMG', P),
        table(['Channel','Total Subscriber','Pertambahan','Views'],
          g.slice(0,12).map((c,i)=>[rk(i)+esc(c.channel)+`<div style="font-size:10.5px;color:var(--mut);margin-top:2px">${esc(c.unit)}</div>`,
            N(c.lifetime), '+'+N(c.subs_gained), N(c.views)])),
        `Total <b>${N(totL)}</b> subscriber dari ${g.length} channel, bertambah <b>+${N(totG)}</b>`
        + `${P?` sepanjang ${P.label}`:' selama seluruh data'}. `
        + `Kolom "Total Subscriber" adalah posisi di bulan terakhir rentang, bukan penjumlahan antar bulan.`
        + covNote(P,'youtube'));
    }
  }

  /* --- engagement rate --- */
  if(has('engagement','interaksi','like','komentar','comment') || /\ber\b/.test(q)){
    // cluster bisa disaring; channel tidak, karena tabel ini memang per cluster
    let s = [...DATA.cluster].sort((a,b)=>b.er-a.er);
    if(ACTIVE_CL && !ACTIVE_CH && s.some(x=>x.cluster===ACTIVE_CL)){
      s = s.filter(x=>x.cluster===ACTIVE_CL); FILTER_DIPAKAI.add('cluster'); }
    return card('📈 Engagement Rate per Cluster',
      table(['Cluster','ER','Likes','Comments','Views'],
        s.map((c,i)=>[rk(i)+esc(c.cluster)+' '+tagOf(c.cluster), PC(c.er), N(c.likes), N(c.comments), N(c.views)])),
      `<b>${s[0].cluster}</b> punya ER tertinggi (${PC(s[0].er)}) — penonton paling aktif berinteraksi. Cluster dengan views besar tapi ER rendah berarti reach luas tapi keterlibatan tipis.` + snapNote(P));
  }

  /* --- platform socmed --- */
  if(has('platform','tiktok','instagram','facebook','twitter',' x ','socmed','sosmed','media sosial')){
    let ch = rollup(TS('ts_socmed'), P, ['platform','unit','channel'], ['views','new_followers','engagement'], ['followers']).list;
    ch = saringCl(ch, x => x.unit, x => x.channel);
    if(ACTIVE_PLAT && ACTIVE_PLAT !== 'YouTube' && ACTIVE_PLAT !== 'News Portal'){
      ch = ch.filter(x => String(x.platform).toLowerCase() === ACTIVE_PLAT.toLowerCase());
      FILTER_DIPAKAI.add('platform');
    }
    if(!ch.length) return card(tt('📱 Platform Social Media', P),
      '<div>Tidak ada data untuk periode itu.</div>', covNote(P,'socmed'));
    const byP = new Map();
    for(const c of ch){
      let o = byP.get(c.platform);
      if(!o){ o = {platform:c.platform, views:0, followers:0, engagement:0, gained:0, n:0}; byP.set(c.platform,o); }
      o.views += c.views; o.followers += c.followers; o.engagement += c.engagement;
      o.gained += c.new_followers; o.n++;
    }
    const s = [...byP.values()].sort((a,b)=>b.views-a.views);
    const totF = s.reduce((a,x)=>a+x.followers,0);
    return card(tt('📱 Perbandingan Platform Social Media', P),
      table(['Platform','Followers','Views','Engagement','Akun'],
        s.map((p,i)=>[rk(i)+esc(p.platform), N(p.followers), N(p.views), N(p.engagement), p.n])),
      `<b>${esc(s[0].platform)}</b> memimpin dengan ${N(s[0].views)} views dan ${N(s[0].followers)} followers `
      + `(${PC(s[0].followers/totF*100)} dari total ${N(totF)}). `
      + `Engagement per views ${esc(s[0].platform)} = ${PC(s[0].engagement/s[0].views*100)}. `
      + `Followers adalah posisi di bulan terakhir rentang.`
      + covNote(P,'socmed'));
  }

  /* --- portal --- */
  if(has('portal','website','situs','traffic','visit','similarweb','bounce')){
    const RP_ = rollup(TS('ts_portal'), P, ['group','portal'], ['visits','pageviews','uv']);
    platformCocok('News Portal');
    let g = RP_.list.sort((a,b)=>b.visits-a.visits);
    // portal IMG memakai nama yang sama dengan cluster, jadi cluster bisa disaring;
    // channel (nama channel YouTube/socmed) tidak ada padanannya di portal
    if(ACTIVE_CL && !ACTIVE_CH && g.some(x => samaAbai(x.portal, ACTIVE_CL))){
      g = g.filter(x => samaAbai(x.portal, ACTIVE_CL));
      FILTER_DIPAKAI.add('cluster');
    }
    if(!g.length) return card(tt('🌐 Portal Performance', P),
      '<div>Tidak ada data untuk periode itu.</div>', covNote(P,'portal'));
    const img = g.filter(p=>p.group!=='Competitor');
    // pembagi diambil dari daftar SEBELUM disaring; kalau tidak, satu portal yang
    // tersaring selalu tampil "100% dari seluruh portal yang dipantau"
    const totV = RP_.list.reduce((a,x)=>a+x.visits,0);
    return card(tt('🌐 Portal Performance (Similarweb)', P),
      table(['Portal','Total Visits','Page Views','Unique Visitor','Page/Visit'],
        g.slice(0,12).map((p,i)=>[rk(i)+esc(p.portal)+' '+(p.group==='Competitor'?'<span class="tag cmp">Kompetitor</span>':'<span class="tag img">IMG</span>'),
          N(p.visits), N(p.pageviews), N(p.uv), (p.visits? p.pageviews/p.visits : 0).toFixed(2)])),
      (img.length ? `Portal IMG: <b>${img.map(p=>esc(p.portal)).join(', ')}</b> — total ${N(img.reduce((a,x)=>a+x.visits,0))} visits `
        + `(${PC(img.reduce((a,x)=>a+x.visits,0)/totV*100)} dari seluruh portal yang dipantau). ` : '')
      + `Data ${RP_.months} bulan.` + covNote(P,'portal'));
  }

  /* --- shorts vs vod / kategori --- */
  if(has('shorts','vod',' live','format konten','format video')){
    SRC = 'studio';
    let CHf = channelDisebut(qRaw);
    if(!CHf){ const U = unitDisebut(qRaw); if(U){ CHf = UNIT_CH[U]; CHf.label = U; } }
    // ts_dim menyimpan dimensi 'type' (Short/Video/Live) per tanggal & channel,
    // jadi format konten bisa ikut disaring -- DATA.category tidak bisa.
    const Rf = (CHf || P) ? dimRollup('type', P, CHf) : null;
    const s = Rf && Rf.list.length
      ? Rf.list.map(x => ({category: x.key, videos: x.videos, views: x.views,
                           er: x.views ? x.eng / x.views * 100 : 0})).sort((a,b)=>b.views-a.views)
      : [...(DATA.category||[])].sort((a,b)=>b.views-a.views);
    return card('🎬 Performa per Format Konten',
      table(['Format','Video','Total Views','Views/Video','ER'],
        s.map((c,i)=>[rk(i)+esc(c.category), N(c.videos), N(c.views), N(c.views/c.videos), PC(c.er)])),
      `Format dengan views/video tertinggi: <b>${[...s].sort((a,b)=>b.views/b.videos-a.views/a.videos)[0].category}</b>. Ini indikator efisiensi produksi konten.` + snapNote(P));
  }

  /* --- trend --- */
  if(has('trend','tren','naik','turun','growth','pertumbuhan','tahun','yoy','bulan')){
    SRC = 'youtube';
    // Dihitung ulang dari ts_youtube, bukan dari DATA.yearly/DATA.monthly yang sudah
    // teragregasi tanpa kolom cluster. Sumbernya sheet yang sama, jadi tanpa filter
    // angkanya identik -- tapi dengan cara ini tren ikut tersaring per cluster/channel.
    const _t = TS('ts_youtube'), _ix = _t.ix;
    let _baris = _t.rows;
    if(ACTIVE_CH){
      _baris = _baris.filter(r => String(r[_ix.channel]).toLowerCase() === ACTIVE_CH.toLowerCase());
      FILTER_DIPAKAI.add('channel');
    } else if(ACTIVE_CL){
      _baris = _baris.filter(r => r[_ix.unit] === ACTIVE_CL);
      FILTER_DIPAKAI.add('cluster');
    }
    const _pY = new Map(), _pM = new Map();
    for(const r of _baris){
      const yy = r[0], mm = r[1];
      let a = _pY.get(yy);
      if(!a){ a = {year: yy, views: 0, watch: 0, subs: 0, videos: 0, bl: new Set()}; _pY.set(yy, a); }
      a.views += r[_ix.views]; a.watch += r[_ix.watch];
      a.subs += r[_ix.subs_gained]; a.videos += r[_ix.videos]; a.bl.add(mm);
      const k = yy * 12 + mm;
      let b = _pM.get(k);
      if(!b){ b = {year: yy, month: mm, views: 0}; _pM.set(k, b); }
      b.views += r[_ix.views];
    }
    const y = [..._pY.values()].map(o => ({...o, months: o.bl.size})).sort((a,b)=>a.year-b.year);
    const monthly = [..._pM.values()].sort((a,b)=>(a.year*12+a.month)-(b.year*12+b.month));
    const labelF = ACTIVE_CH || (ACTIVE_CL && !ACTIVE_CH ? ACTIVE_CL : null);
    if(y.length < 2)
      return card('📊 Tren Performa YouTube' + (labelF ? ` · ${esc(labelF)}` : ''),
        `<div>Hanya ada <b>${y.length}</b> tahun data${labelF ? ` untuk ${esc(labelF)}` : ''}, `
        + `jadi tren antar tahun tidak bisa dihitung.</div>`, covNote(P,'youtube'));
    // bandingkan rata-rata per bulan supaya adil (tahun berjalan belum lengkap)
    const rows = y.map((x,i)=>{
      const pm = x.views / x.months, prev = y[i-1];
      const d = prev ? ((pm / (prev.views/prev.months) - 1) * 100) : null;
      const badge = d===null ? '—'
        : `<span style="color:${d>=0?'var(--ok)':'var(--bad)'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span>`;
      return [String(x.year) + (x.months<12?` <span style="font-size:10px;color:var(--mut)">(${x.months} bln)</span>`:''),
              N(x.views), N(pm), N(x.videos), badge];
    });
    const m = monthly.slice(-18), mx = Math.max(...m.map(x=>x.views));
    const spark = `<div style="display:flex;align-items:flex-end;gap:3px;height:72px;margin:14px 0 6px">`
      + m.map(x=>`<div title="${x.year}-${String(x.month).padStart(2,'0')}: ${N(x.views)} views"
          style="flex:1;height:${Math.max(6,x.views/mx*100)}%;border-radius:3px 3px 0 0;
          background:linear-gradient(180deg,var(--acc2),var(--acc))"></div>`).join('')
      + `</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)">
         <span>${m[0].year}-${String(m[0].month).padStart(2,'0')}</span>
         <span>views bulanan (18 bulan terakhir)</span>
         <span>${m[m.length-1].year}-${String(m[m.length-1].month).padStart(2,'0')}</span></div>`;
    const last = y[y.length-1], prev = y[y.length-2];
    const dl = (last.views/last.months) / (prev.views/prev.months) - 1;
    return card('📊 Tren Performa YouTube' + (labelF ? ` · ${esc(labelF)}` : ''),
      table(['Tahun','Total Views','Rata²/Bulan','Video','Growth'], rows) + spark,
      `Dibandingkan rata-rata bulanan, ${last.year} ${dl>=0?'<b>naik</b>':'<b>turun</b>'} ${Math.abs(dl*100).toFixed(1)}% dari ${prev.year}. `
      + `Produksi video ${last.videos/last.months < prev.videos/prev.months ? 'menurun' : 'meningkat'}, `
      + `sementara views per video ${(last.views/last.videos) > (prev.views/prev.videos) ? '<b>naik</b> — konten makin efektif' : 'turun'}. `
      + (last.months<12 ? `<br>⚠️ Data ${last.year} baru ${last.months} bulan, jadi perbandingan memakai rata-rata per bulan, bukan total.` : ''));
  }

  /* --- top video --- */
  if(has('video terbaik','video top','top video','konten terbaik','video viral','viral')){
    const v = saringCl(DATA.top_videos_all, x=>x.cluster, x=>x.channel).slice(0,10);
    return card('🔥 Video dengan Views Tertinggi',
      table(['Judul','Views','Likes','ER'],
        v.map((x,i)=>[rk(i)+esc(x.title)+`<div style="font-size:10.5px;color:var(--mut);margin-top:2px">${esc(x.channel)} · ${esc(x.cluster)}</div>`,
          N(x.views), N(x.likes), PC(x.er)])),
      `Video teratas: <b>${esc(v[0].channel)}</b> dengan ${N(v[0].views)} views.` + snapNote(P));
  }

  /* --- CTR / impression --- */
  if(has('ctr','click','impression','impresi','thumbnail')){
    const s = saringCl([...DATA.studio].filter(c=>c.impressions>0), x=>x.unit, x=>x.channel)
                .sort((a,b)=>b.ctr-a.ctr).slice(0,12);
    return card('🎯 Click-Through Rate per Channel',
      table(['Channel','CTR','Impressions','Views','% Ditonton'],
        s.map((c,i)=>[rk(i)+esc(c.channel), PC(c.ctr), N(c.impressions), N(c.views), PC(c.pct_viewed)])),
      `CTR tertinggi: <b>${s[0].channel}</b> (${PC(s[0].ctr)}) — judul & thumbnail paling menarik klik. Rata-rata CTR industri berita YouTube ada di kisaran 4–6%.` + snapNote(P));
  }

  /* --- IMG vs kompetitor / market share --- */
  if(has('kompetitor','competitor','saingan','market share','pangsa','posisi img','img vs')){
    const img = DATA.cluster.filter(c=>isIMG(c.cluster));
    const cmp = DATA.cluster.filter(c=>!isIMG(c.cluster));
    const iv = img.reduce((s,x)=>s+x.views,0), cv = cmp.reduce((s,x)=>s+x.views,0);
    const ie = img.reduce((s,x)=>s+x.er*x.videos,0)/img.reduce((s,x)=>s+x.videos,0);
    const ce = cmp.reduce((s,x)=>s+x.er*x.videos,0)/cmp.reduce((s,x)=>s+x.videos,0);
    return card('🏁 IMG vs Kompetitor',
      table(['Metrik','IMG Group','Kompetitor'],[
        ['Total views', N(iv), N(cv)],
        ['Market share views', PC(iv/(iv+cv)*100), PC(cv/(iv+cv)*100)],
        ['Jumlah video', N(img.reduce((s,x)=>s+x.videos,0)), N(cmp.reduce((s,x)=>s+x.videos,0))],
        ['Engagement Rate', PC(ie), PC(ce)],
      ]) + `<div class="bar" style="width:${(iv/(iv+cv)*100).toFixed(1)}%"></div>`,
      `IMG menguasai <b>${PC(iv/(iv+cv)*100)}</b> dari total views yang dipantau. ER IMG ${ie>ce?'<b>lebih tinggi</b>':'lebih rendah'} dari kompetitor (${PC(ie)} vs ${PC(ce)}).` + snapNote(P));
  }

  /* --- top channel (default ranking) --- */
  if(has('top','terbaik','terbanyak','ranking','peringkat','tertinggi','channel','unggul','besar',
         'views','view','tonton','ditonton','penonton','watch time','jam tayang')){
    const s = [...DATA.cluster].sort((a,b)=>b.views-a.views);
    const ch = [...DATA.channels_scraping].sort((a,b)=>b.views-a.views).slice(0,10);
    // periode ATAU filter cluster/channel -> pakai deret waktu YouTube IMG
    // (tabel cluster bawaan hanya satu bulan dan tidak punya rincian channel)
    if(P || ACTIVE_CL || ACTIVE_CH){
      const RY = rollup(TS('ts_youtube'), P, ['unit','channel'], ['views','watch','revenue','subs_gained']);
      platformCocok('YouTube');
      const g = saringCl(RY.list, x => x.unit, x => x.channel).sort((a,b)=>b.views-a.views);
      if(g.length){
        const tot = g.reduce((a,x)=>a+x.views,0);
        return card(tt('🏆 Ranking Channel YouTube IMG', P),
          table(['Channel','Views','Share','Watch Time','Revenue'],
            g.slice(0,12).map((c,i)=>[rk(i)+esc(c.channel)+`<div style="font-size:10.5px;color:var(--mut);margin-top:2px">${esc(c.unit)}</div>`,
              N(c.views), PC(c.views/tot*100), N(c.watch)+' jam', RP(c.revenue)])),
          `Total <b>${N(tot)}</b> views dari ${g.length} channel IMG ${P ? `sepanjang ${P.label}` : '(seluruh data)'} (${RY.months} bulan). `
          + `Ranking kompetitor tidak bisa difilter periode — data Scraping hanya ${rentangSumber('scraping') || 'satu bulan'}.`
          + covNote(P,'youtube'));
      }
    }
    return card('🏆 Ranking Performa',
      `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700;margin-bottom:6px">Per cluster</div>`
      + table(['Cluster','Views','Video','ER'],
          s.map((c,i)=>[rk(i)+esc(c.cluster)+' '+tagOf(c.cluster), N(c.views), N(c.videos), PC(c.er)]))
      + `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700;margin-bottom:6px">Top 10 channel</div>`
      + table(['Channel','Views','ER'],
          ch.map((c,i)=>[rk(i)+esc(c.channel)+`<div style="font-size:10.5px;color:var(--mut);margin-top:2px">${esc(c.cluster)}</div>`, N(c.views), PC(c.er)])),
      `<b>${s[0].cluster}</b> memimpin dengan ${N(s[0].views)} views dari ${N(s[0].videos)} video.`);
  }

  /* --- ringkasan / overview --- */
  if(has('ringkas','summary','overview','gambaran','laporan','report','kesimpulan','insight')){
    const s = [...DATA.cluster].sort((a,b)=>b.views-a.views);
    const p = [...DATA.platform].sort((a,b)=>b.views-a.views);
    const img = DATA.cluster.filter(c=>isIMG(c.cluster));
    const iv = img.reduce((a,x)=>a+x.views,0), tv = DATA.cluster.reduce((a,x)=>a+x.views,0);
    const rev = (DATA.yt_revenue||[]).reduce((a,x)=>a+x.revenue,0);
    return card('📋 Ringkasan Eksekutif',
      table(['Indikator','Nilai'],[
        ['Total views YouTube (semua cluster)', N(tv)],
        ['Market share IMG', PC(iv/tv*100)],
        ['Cluster teratas', `${s[0].cluster} (${N(s[0].views)})`],
        ['Platform socmed terbesar', `${p[0].platform} (${N(p[0].views)} views)`],
        ['Total followers socmed', N(DATA.platform.reduce((a,x)=>a+x.followers,0))],
        ['Revenue YouTube', RP(rev)],
        ['Konten dianalisis', N(DATA.meta.rows_scraping + DATA.meta.rows_studio)+' baris'],
      ]),
      `Periode data: <b>${DATA.meta.period}</b>. Tanya lebih spesifik untuk breakdown per channel, platform, atau portal.`);
  }


  /* --- fallback --- */
  return card('🤔 Coba lebih spesifik',
    `<div style="line-height:1.75">Saya bisa menjawab tentang:<br>
     • <b>Ranking &amp; views</b> — "channel mana paling banyak views?"<br>
     • <b>Revenue</b> — "revenue Jan-Juli 2026", "RPM per channel"<br>
     • <b>Kategori &amp; program</b> — "kategori apa paling bagus?", "program terbaik"<br>
     • <b>Part / Sub Part</b> — "performa TV Content vs Digital Content"<br>
     • <b>Original vs Repack</b> — "original atau repack yang lebih bagus?"<br>
     • <b>Durasi &amp; jam unggah</b> — "jam berapa terbaik posting?"<br>
     • <b>Harian</b> — "performa harian", "tanggal berapa terbaik?"<br>
     • <b>Demografi</b> — "demografi audiens socmed"<br>
     • <b>Platform &amp; portal</b> — "bandingkan TikTok vs Instagram", "kualitas trafik portal"<br>
     • <b>Kompetitor</b> — "posisi IMG vs kompetitor?", "iNews vs KompasTV"<br>
     • <b>Breakdown silang</b> — "breakdown kategori per cluster"<br>
     • <b>Cakupan data</b> — "berapa channel yang dipantau?"<br><br>
     Untuk memindahkan hasil ke Excel, pakai tombol <b>Salin tabel</b> atau <b>Unduh Excel</b>
     yang ada di bawah setiap jawaban.</div>`,
    `Pertanyaan kamu: "<b>${esc(qRaw)}</b>" belum saya kenali polanya.`);
}


/* Tandai tabel yang masih ada lanjutannya ke kanan. */
function tandaiGeser(el){
  el.querySelectorAll('.tw').forEach(tw => {
    const perlu = tw.querySelector('table').scrollWidth > tw.clientWidth + 2;
    tw.classList.toggle('geser', perlu);
    if (perlu && !tw.dataset.tip){
      tw.dataset.tip = '1';
      const tip = document.createElement('div');
      tip.className = 'geser-tip on';
      tip.textContent = '← geser tabel ke samping untuk melihat kolom lainnya →';
      tw.after(tip);
      tw.addEventListener('scroll', () => {
        tw.classList.toggle('geser', tw.scrollLeft + tw.clientWidth < tw.querySelector('table').scrollWidth - 2);
      }, {passive:true});
    }
  });
}
window.addEventListener('resize', () => document.querySelectorAll('.msg.bot').forEach(tandaiGeser));
