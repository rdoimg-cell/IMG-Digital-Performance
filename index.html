/* Tombol analisis lanjutan: mengirim TABEL HASIL (bukan data mentah) ke Claude
   untuk ditulis maknanya. Angkanya sudah jadi sebelum dikirim. */
function tombolAI(){
  if (!adaAI()) return '';
  return `<div class="acts"><button onclick="jelaskanAI(this)">✨ Jelaskan &amp; beri saran</button></div>`;
}
async function jelaskanAI(btn){
  const bub = btn.closest('.bub');
  const tabel = ambilTabel(btn);
  if (!tabel) return kabar(btn, 'Tidak ada tabel untuk dijelaskan');
  const hd = bub.querySelector('.hd'); const judul = hd ? hd.innerText : '';
  btn.disabled = true; const asli = btn.innerHTML; btn.innerHTML = 'Menyusun…';
  try {
    const sistem = [
      'Kamu analis media digital iNews Media Group yang menjawab langsung ke manajemen.',
      'Kamu HANYA boleh memakai angka yang ada di tabel yang diberikan. Dilarang keras',
      'menambah, menaksir, atau mengingat angka dari luar tabel itu. Kalau sesuatu tidak',
      'terjawab oleh tabel, katakan datanya tidak ada di tabel ini.',
      'Bahasa Indonesia, to the point, untuk atasan yang sibuk.',
      'Struktur: 2-3 kalimat insight utama, lalu maksimal 3 butir saran yang bisa dieksekusi.',
      'Jangan mengulang seluruh isi tabel; tabelnya sudah terlihat oleh pembaca.',
    ].join(' ');
    const isi = `Judul jawaban: ${judul}\nPertanyaan terakhir: ${LAST_Q || '-'}\n\nTabel:\n${tabel}`;
    const teks = await tanyaAI(sistem, isi, 600);
    const aman = esc(teks).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
    btn.closest('.acts').insertAdjacentHTML('beforebegin',
      `<div class="warn" style="border-color:#c7d2fe;background:#eef2ff">
         <span class="t" style="color:var(--acc)">✨ Analisis</span>
         <p>${aman}</p>
         <div style="margin-top:8px;font-size:10.5px;color:var(--mut)">
           Ditulis oleh Claude dari tabel di atas saja. Angkanya tetap berasal dari
           perhitungan lokal, bukan dari model.</div>
       </div>`);
    btn.closest('.acts').remove();
  } catch (e){
    btn.disabled = false; btn.innerHTML = asli;
    kabar(btn, 'Gagal: ' + e.message);
  }
}

/* ==================================================================
   PENULIS XLSX — Excel asli, tanpa pustaka luar
   ------------------------------------------------------------------
   Dulu tombolnya mengunduh CSV. CSV selalu berujung pada pertanyaan
   pemisah koma-atau-titik-koma, dan angka besar sering berubah jadi
   notasi ilmiah begitu dibuka. Berkas ini menulis .xlsx yang sebenarnya.

   Isi ZIP-nya disimpan tanpa kompresi (metode 0) supaya tidak perlu
   pustaka deflate — Excel menerimanya. Teks ditulis sebagai inline
   string, jadi tidak perlu tabel sharedStrings.
   ================================================================== */
const _CRC_TABEL = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function _crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = _CRC_TABEL[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const _teksKeByte = s => new TextEncoder().encode(s);

function _zip(berkas){
  const bagian = [], pusat = [];
  let offset = 0;
  const tulis32 = (a, v) => { a.push(v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255); };
  const tulis16 = (a, v) => { a.push(v & 255, (v >>> 8) & 255); };
  for (const f of berkas){
    const nama = _teksKeByte(f.nama), data = f.data;
    const crc = _crc32(data);
    const lok = [];
    tulis32(lok, 0x04034b50); tulis16(lok, 20); tulis16(lok, 0x0800); tulis16(lok, 0);
    tulis16(lok, 0); tulis16(lok, 0x21);                 // waktu & tanggal tetap
    tulis32(lok, crc); tulis32(lok, data.length); tulis32(lok, data.length);
    tulis16(lok, nama.length); tulis16(lok, 0);
    bagian.push(new Uint8Array(lok), nama, data);

    const cd = [];
    tulis32(cd, 0x02014b50); tulis16(cd, 20); tulis16(cd, 20); tulis16(cd, 0x0800); tulis16(cd, 0);
    tulis16(cd, 0); tulis16(cd, 0x21);
    tulis32(cd, crc); tulis32(cd, data.length); tulis32(cd, data.length);
    tulis16(cd, nama.length); tulis16(cd, 0); tulis16(cd, 0);
    tulis16(cd, 0); tulis16(cd, 0); tulis32(cd, 0); tulis32(cd, offset);
    pusat.push(new Uint8Array(cd), nama);
    offset += lok.length + nama.length + data.length;
  }
  const besarPusat = pusat.reduce((a, b) => a + b.length, 0);
  const akhir = [];
  tulis32(akhir, 0x06054b50); tulis16(akhir, 0); tulis16(akhir, 0);
  tulis16(akhir, berkas.length); tulis16(akhir, berkas.length);
  tulis32(akhir, besarPusat); tulis32(akhir, offset); tulis16(akhir, 0);

  const semua = [...bagian, ...pusat, new Uint8Array(akhir)];
  const total = semua.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const b of semua){ out.set(b, p); p += b.length; }
  return out;
}

const _xEsc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
  // Excel menolak berkas yang memuat aksara kendali di dalam XML-nya.
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
function _kolomHuruf(i){
  let s = '';
  i++;
  while (i > 0){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = (i - r - 1) / 26; }
  return s;
}

/* Nama sheet Excel: maksimal 31 huruf, tidak boleh []:*?/\ dan harus unik. */
function _namaSheet(nama, dipakai){
  let n = String(nama || 'Sheet').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Sheet';
  let dasar = n, k = 2;
  while (dipakai.has(n.toLowerCase())){ n = (dasar.slice(0, 28) + ' ' + k++).trim(); }
  dipakai.add(n.toLowerCase());
  return n;
}

/* sheets: [{nama, baris: [[sel, sel, ...], ...]}]
   Sel boleh angka (ditulis sebagai angka) atau teks. Baris pertama dianggap
   judul kolom dan ditebalkan. */
function bikinXLSX(sheets){
  const dipakai = new Set();
  const nama = sheets.map(s => _namaSheet(s.nama, dipakai));
  const lembar = sheets.map((s, si) => {
    const baris = (s.baris || []).map((r, ri) => {
      const sel = r.map((v, ci) => {
        const ref = _kolomHuruf(ci) + (ri + 1);
        const gaya = ri === 0 ? ' s="1"' : '';
        if (typeof v === 'number' && isFinite(v))
          return `<c r="${ref}"${gaya}><v>${v}</v></c>`;
        if (v === null || v === undefined || v === '') return '';
        return `<c r="${ref}"${gaya} t="inlineStr"><is><t xml:space="preserve">${_xEsc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${ri + 1}">${sel}</row>`;
    }).join('');
    const lebar = ((s.baris || [])[0] || []).map((_, i) =>
      `<col min="${i + 1}" max="${i + 1}" width="${i === 0 ? 34 : 17}" customWidth="1"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${
  lebar ? `<cols>${lebar}</cols>` : ''}<sheetData>${baris}</sheetData></worksheet>`;
  });

  const berkas = [
    {nama: '[Content_Types].xml', data: _teksKeByte(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${lembar.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)},
    {nama: '_rels/.rels', data: _teksKeByte(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)},
    {nama: 'xl/workbook.xml', data: _teksKeByte(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${nama.map((n, i) => `<sheet name="${_xEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>
</workbook>`)},
    {nama: 'xl/_rels/workbook.xml.rels', data: _teksKeByte(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${nama.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}
<Relationship Id="rId${nama.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)},
    {nama: 'xl/styles.xml', data: _teksKeByte(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`)},
  ];
  lembar.forEach((x, i) => berkas.push({nama: `xl/worksheets/sheet${i + 1}.xml`, data: _teksKeByte(x)}));
  return _zip(berkas);
}

function unduhXLSX(namaBerkas, sheets){
  const blob = new Blob([bikinXLSX(sheets)],
    {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = namaBerkas.endsWith('.xlsx') ? namaBerkas : namaBerkas + '.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Teks tampilan -> angka, supaya selnya bisa dijumlah di Excel dan bukan
   sekadar tulisan. Yang tidak bisa dibaca dikembalikan apa adanya. */
function keAngka(teks){
  let t = String(teks == null ? '' : teks).trim();
  if (!t || /^[-—–]$/.test(t)) return null;
  if (/^\d{1,3}:\d{2}(:\d{2})?$/.test(t)) return t;      // durasi -> biarkan teks
  const persen = /%$/.test(t);
  t = t.replace(/^Rp\s*/i, '').replace(/\s*(jam|hrs|dtk|sec|min|mnt|video|videos)\b.*$/i, '')
       .replace(/%$/, '').replace(/[▲▼]/g, '').trim();
  const skala = {rb: 1e3, k: 1e3, jt: 1e6, m: 1e6, miliar: 1e9, b: 1e9, triliun: 1e12, t: 1e12};
  const m = /^(-?[\d.,]+)\s*(rb|jt|miliar|triliun|K|M|B|T)?$/.exec(t);
  if (!m) return teks;
  let n = m[1];
  // '1.234,56' (Indonesia) vs '1,234.56' (Inggris) -- keduanya dipakai di layar
  if (/^\-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(n))      n = n.replace(/\./g, '').replace(',', '.');
  else if (/^\-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(n)) n = n.replace(/,/g, '');
  else                                              n = n.replace(',', '.');
  const v = parseFloat(n);
  if (!isFinite(v)) return teks;
  const s = m[2] ? (skala[m[2]] || skala[m[2].toLowerCase()] || 1) : 1;
  const hasil = v * s;
  return persen ? hasil : hasil;
}

function tombolSalin(){
  return `<div class="acts">
    <button onclick="salinTabel(this)">📋 Salin tabel</button>
    <button onclick="unduhTabel(this)">⬇ Unduh Excel</button></div>`;
}
function ambilTabel(btn){
  const bub = btn.closest('.bub');
  const tabel = [...bub.querySelectorAll('table')];
  if (!tabel.length) return null;
  return tabel.map(t => [...t.querySelectorAll('tr')]
    .map(tr => [...tr.querySelectorAll('th,td')]
      .map(td => td.innerText.replace(/\s+/g, ' ').trim()).join('\t')).join('\n')).join('\n\n');
}
/* Cara lama: textarea sementara + execCommand. Dipakai kalau navigator.clipboard
   tidak tersedia -- di Safari, clipboard API hanya jalan pada halaman https,
   sedangkan berkas ini biasanya dibuka lewat file:// (klik dua kali). */
function salinCaraLama(teks){
  const ta = document.createElement('textarea');
  ta.value = teks;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);   // iOS/Safari perlu ini
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function salinTabel(btn){
  const teks = ambilTabel(btn);
  if (!teks) return kabar(btn, 'Tidak ada tabel');
  const cadangan = () => kabar(btn, salinCaraLama(teks)
    ? '✓ Tersalin — tinggal tempel di Excel' : 'Gagal menyalin');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks)
      .then(() => kabar(btn, '✓ Tersalin — tinggal tempel di Excel'))
      .catch(cadangan);
  } else {
    cadangan();
  }
}
/* Satu jawaban bisa memuat lebih dari satu tabel; masing-masing jadi satu
   sheet. Angka dikembalikan ke bentuk angka supaya bisa langsung dijumlah di
   Excel, bukan sekadar tulisan. */
function tabelKeSheets(bub, judulDasar){
  const tabel = [...bub.querySelectorAll('table')];
  return tabel.map((t, i) => {
    const baris = [...t.querySelectorAll('tr')].map(tr => {
      const kepala = !!tr.querySelector('th');
      return [...tr.querySelectorAll('th,td')].map(td => {
        // nomor peringkat dibuang: urutan barisnya sudah menyimpan keterangan itu
        if (!kepala){
          // nilai asli yang diselipkan N()/RP()/PC() -- tidak dibulatkan
          const v = td.querySelector('[data-v]');
          if (v && td.querySelectorAll('[data-v]').length === 1){
            const n = parseFloat(v.getAttribute('data-v'));
            if (isFinite(n)) return n;
          }
        }
        const c = td.cloneNode(true);
        c.querySelectorAll('.rk').forEach(x => x.remove());
        const teks = (c.innerText || c.textContent || '').replace(/\s+/g, ' ').trim();
        return kepala ? teks : keAngka(teks);
      });
    });
    return {nama: tabel.length > 1 ? `${judulDasar} ${i + 1}` : judulDasar, baris};
  });
}
function unduhTabel(btn){
  const bub = btn.closest('.bub');
  const judul = ((bub.querySelector('.hd') || {}).innerText || 'Data')
    .replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim() || 'Data';
  const sheets = tabelKeSheets(bub, judul);
  if (!sheets.length) return kabar(btn, 'Tidak ada tabel');
  try {
    unduhXLSX('Ask IMG Analytics - ' + judul, sheets);
    kabar(btn, '✓ Terunduh');
  } catch (e){ kabar(btn, 'Gagal: ' + e.message); }
}
function kabar(btn, teks){
  const asli = btn.innerHTML;
  btn.innerHTML = teks;
  setTimeout(() => btn.innerHTML = asli, 1900);
}

  const tp = push('bot', '<div class="typing"><i></i><i></i><i></i></div>');
    setTimeout(()=>{

      // Mesin lokal tidak mengenali pertanyaannya -> baru minta bantuan Claude

          bub.innerHTML =
            `<div class="pf" style="margin-top:0;margin-bottom:10px">✨ Saya baca pertanyaan Anda sebagai `
            + `<b>${esc(perintah)}</b></div>`
            + html2 + peringatanDiabaikan(perintah) + periodFooter(P2) + tombolSalin() + tombolAI();
          LAST_Q = perintah; LAST_P = P2;

let ACTIVE_P = null, ACTIVE_PLAT = null, ACTIVE_CL = null, ACTIVE_CH = null;
/* Periode yang sedang dicentang, dan isian kotak Custom. */
let SEL_P = [], KUSTOM_P = null;

(function buildPicker(){
  const cov = DATA.coverage && DATA.coverage.youtube;
  if(!cov){ document.getElementById('pick').style.display = 'none'; return; }
  const [fy, fm] = cov.from, [ly, lm] = cov.to;

  // Penamaan di menu filter memakai bahasa Inggris atas permintaan tim data;
  // isi jawaban di mode Tanya tetap bahasa Indonesia.
  // Periode boleh dipilih lebih dari satu, jadi bentuknya daftar centang --
  // sama seperti menu Metrics. Tidak ada baris "All data" di daftar itu:
  // tidak mencentang apa pun SUDAH berarti seluruh data.
  const opt = [];
  opt.push({v:`last:1`, t:'Last Month'});
  opt.push({v:`last:3`, t:'Last 3 Months'});
  opt.push({v:`last:6`, t:'Last 6 Months'});
  for(let y = ly; y >= fy; y--){
    opt.push({v:`y:${y}`, t:`Year ${y}`});
    for(let k = 4; k >= 1; k--){
      const m2 = k*3;
      if(y*12 + (m2-2) < fy*12 + fm) continue;
      if(y*12 + (m2-2) > ly*12 + lm) continue;
      opt.push({v:`q:${y}:${k}`, t:`Q${k} ${y}`});
    }
  }
  opt.push({v:'custom', t:'Custom…'});

  const AWAL = kunciBln(fy, fm), AKHIR = kunciBln(ly, lm);

  /* Satu nilai pilihan -> satu potong bulan. Custom membawa rentangnya sendiri
     berikut pembandingnya, kalau pembandingnya memang diisi. */
  function potongP(v){
    if (v === 'custom'){
      if (!KUSTOM_P) return null;
      const bg = {v, jenis: 'kustom', a: KUSTOM_P.a, b: KUSTOM_P.b};
      if (KUSTOM_P.banding) bg.sbl = {a: KUSTOM_P.ca, b: KUSTOM_P.cb};
      return bg;
    }
    if (v.startsWith('last:')){
      const n = +v.split(':')[1];
      return {v, jenis: 'last', a: Math.max(AWAL, AKHIR - n + 1), b: AKHIR};
    }
    if (v.startsWith('y:')){
      const y = +v.split(':')[1];
      return {v, jenis: 'tahun', a: kunciBln(y, 1), b: Math.min(kunciBln(y, 12), AKHIR)};
    }
    if (v.startsWith('q:')){
      const [, y, k] = v.split(':').map(Number);
      return {v, jenis: 'kuartal', a: kunciBln(y, k*3 - 2), b: Math.min(kunciBln(y, k*3), AKHIR)};
    }
    return null;
  }

  /* Susun ulang ACTIVE_P dari centangan yang sedang aktif. */
  function pasangP(){
    const bagian = SEL_P.map(potongP).filter(Boolean);
    ACTIVE_P = gabungP(bagian);
  }

  // ---- daftar platform, cluster, dan channel: semuanya dari isi data ----
  const platSocmed = [...new Set(TS('ts_socmed').rows.map(r => r[TS('ts_socmed').ix.platform]))].sort();
  const PLAT = ['YouTube', ...platSocmed, ...(DATA.ts_portal ? ['Portal'] : [])];

  // cluster: gabungan unit di YouTube dan Socmed
  const clSet = new Set();
  const chPerCl = {};
  const catat = (u, ch) => {
    if (!u || u === 'nan') return;
    clSet.add(u);
    (chPerCl[u] = chPerCl[u] || new Set()).add(ch);
  };
  { const t = TS('ts_youtube'); t.rows.forEach(r => catat(r[t.ix.unit], r[t.ix.channel])); }
  { const t = TS('ts_socmed');  t.rows.forEach(r => catat(r[t.ix.unit],  r[t.ix.channel])); }
  // Urutan cluster ditetapkan tim data: iNews, Sindonews, Okezone, IDX Channel
  // (besar ke kecil). Cluster lain — yang hanya muncul di berkas Scraping —
  // menyusul di belakang, urut abjad.
  {
    const pos = k => { const i = URUT_CLUSTER.indexOf(k); return i < 0 ? 99 : i; };
    var CL = [...clSet].sort((a, b) => pos(a) - pos(b) || a.localeCompare(b));
  }
  CH_PER_CL = {}; CL.forEach(u => CH_PER_CL[u] = [...chPerCl[u]].sort());

  document.getElementById('pick').innerHTML =
    `<h3 id="judulFilter">Filter Data <span class="tanda">▾</span></h3>
     <div class="isi">
     <span class="fl">Period</span>
     <div class="mdrop" id="mdP">
       <button type="button" class="mdbtn" id="mdPBtn" aria-expanded="false">
         <span id="mdPTeks">All data</span><i>▾</i></button>
       <div class="mdlist" id="mdPList">
         ${opt.map(o=>`<label data-v="${o.v}"><input type="checkbox"><span>${o.t}</span></label>`).join('')}
       </div>
     </div>
     <div class="kustom" id="kustomP"></div>
     <div class="met-info">Pick one or more — they add up, even if they are not
       next to each other. Q1–Q4 and Year are compared with the same period a
       year earlier.</div>
     <div class="duo">
       <div><span class="fl">Platform</span>
         <select id="selPlat" class="kecil"><option value="">All</option>
           ${PLAT.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></div>
       <div><span class="fl">Cluster</span>
         <select id="selCl" class="kecil"><option value="">All</option>
           ${CL.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}</select></div>
     </div>
     <div class="satu" id="wrapCh"><span class="fl">Channel</span>
       <select id="selCh" class="kecil"><option value="">All channels</option></select></div>
     <div id="filDash" style="margin-top:11px;border-top:1px solid var(--line);padding-top:11px"></div>
     <button class="reset" id="resetF">✕ Clear all filters</button>
     <div class="now" id="nowP">Showing <b>All data</b>. Periods and names written in your question still take priority.</div>
     </div>`;

  // panel filter bisa dilipat, supaya daftar pertanyaan pintas lebih terlihat
  const pickEl = document.getElementById('pick');
  document.getElementById('judulFilter').onclick = () => pickEl.classList.toggle('lipat');

  const selPlat = document.getElementById('selPlat'), selCl = document.getElementById('selCl'),
        selCh = document.getElementById('selCh'), wrapCh = document.getElementById('wrapCh'),
        resetF = document.getElementById('resetF');

  const tulisNow = () => {
    const bag = [];
    bag.push(ACTIVE_P ? `<b>${ACTIVE_P.labelEn || ACTIVE_P.label}</b>` : '<b>All data</b>');
    if (ACTIVE_PLAT) bag.push(`Platform <b>${esc(ACTIVE_PLAT)}</b>`);
    if (ACTIVE_CH) bag.push(`Channel <b>${esc(ACTIVE_CH)}</b>`);
    else if (ACTIVE_CL) bag.push(`Cluster <b>${esc(ACTIVE_CL)}</b>`);
    document.getElementById('nowP').innerHTML = 'Showing ' + bag.join(' · ')
      + '. Periods and names written in your question still take priority.';
    resetF.classList.toggle('tampil', !!(ACTIVE_P || ACTIVE_PLAT || ACTIVE_CL || ACTIVE_CH));
    // setiap perubahan filter apa pun -- periode, platform, cluster, channel --
    // langsung menggambar ulang dashboard. Dulu hanya pemilih periode yang
    // tersambung, sehingga mengganti cluster tidak mengubah angka sama sekali.
    if (typeof renderDash === 'function') renderDash();
  };

  // Ganti platform berarti ganti berkas sumber, dan tiap berkas punya daftar
  // metrik sendiri. Menu di bawahnya harus ikut dibangun ulang -- kalau tidak,
  // menu masih memajang 24 metrik YouTube padahal Rekap Socmed cuma punya lima.
  selPlat.onchange = e => {
    ACTIVE_PLAT = e.target.value || null;
    if (typeof rapikanDash === 'function') rapikanDash();
    tulisNow();
  };

  selCl.onchange = e => {
    ACTIVE_CL = e.target.value || null;
    ACTIVE_CH = null;
    // daftar channel diisi ulang hanya untuk cluster yang dipilih
    const daftar = ACTIVE_CL ? (CH_PER_CL[ACTIVE_CL] || []) : [];
    selCh.innerHTML = `<option value="">All channels</option>`
      + daftar.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    wrapCh.classList.toggle('tampil', daftar.length > 0);
    tulisNow();
  };

  selCh.onchange = e => { ACTIVE_CH = e.target.value || null; tulisNow(); };

  resetF.onclick = () => {
    ACTIVE_P = ACTIVE_PLAT = ACTIVE_CL = ACTIVE_CH = null;
    SEL_P = []; KUSTOM_P = null;
    gambarP();
    selPlat.value = ''; selCl.value = ''; selCh.value = '';
    wrapCh.classList.remove('tampil');
    tulisNow();
  };
  TULIS_NOW = tulisNow;

  /* ---------- menu periode: boleh lebih dari satu ---------- */

        btnP  = document.getElementById('mdPBtn'),
        tksP  = document.getElementById('mdPTeks'),
        kusEl = document.getElementById('kustomP');

  btnP.onclick = ev => {
    ev.stopPropagation();
    const buka = dropP.classList.toggle('buka');
    btnP.setAttribute('aria-expanded', buka ? 'true' : 'false');
  };

  const namaOpsi = v => (opt.find(o => o.v === v) || {t: v}).t;

  /* Tulis ulang tampilan menu periode supaya selalu sama dengan SEL_P. */
  function gambarP(){
    dropP.querySelectorAll('.mdlist label').forEach(lb => {
      const on = SEL_P.includes(lb.dataset.v);

      : `${pakai.length} periods selected`;

    if (SEL_P.includes('custom') && !kusEl.dataset.siap) gambarKustom();
  }

  /* ---------- Custom: rentang sendiri, plus pembanding kalau mau ---------- */
  const pilihBln = (id, nilai) => {
    let h = `<select id="${id}" class="kecil kus">`;
    for (let t = AKHIR; t >= AWAL; t--){
      const [y, m] = dariKunci(t);
      h += `<option value="${t}"${t === nilai ? ' selected' : ''}>${BLN_EN[m-1]} ${y}</option>`;
    }
    return h + '</select>';
  };

  function gambarKustom(){
    if (!KUSTOM_P){
      // Bawaannya tiga bulan terakhir, supaya kotaknya tidak pernah kosong.
      KUSTOM_P = {a: Math.max(AWAL, AKHIR - 2), b: AKHIR, banding: false,
                  ca: Math.max(AWAL, AKHIR - 5), cb: Math.max(AWAL, AKHIR - 3)};
    }
    kusEl.innerHTML =
      `<div class="kbar">
         <div><span class="kl">From</span>${pilihBln('kusA', KUSTOM_P.a)}</div>
         <div><span class="kl">To</span>${pilihBln('kusB', KUSTOM_P.b)}</div></div>
       <label class="kcek"><input type="checkbox" id="kusCek"${KUSTOM_P.banding ? ' checked' : ''}>
         <span>Compare with another range</span></label>
       <div class="kbar kcmp${KUSTOM_P.banding ? ' tampil' : ''}" id="kusCmp">
         <div><span class="kl">Compare from</span>${pilihBln('kusCA', KUSTOM_P.ca)}</div>
         <div><span class="kl">To</span>${pilihBln('kusCB', KUSTOM_P.cb)}</div></div>
       <div class="kket" id="kusKet"></div>`;
    kusEl.dataset.siap = '1';

    const ambil = () => {
      const g = id => +document.getElementById(id).value;
      let a = g('kusA'), b = g('kusB');
      if (a > b){ const t = a; a = b; b = t; }     // dibalik sendiri, bukan ditolak
      let ca = g('kusCA'), cb = g('kusCB');
      if (ca > cb){ const t = ca; ca = cb; cb = t; }
      KUSTOM_P = {a, b, ca, cb, banding: document.getElementById('kusCek').checked};
      document.getElementById('kusCmp').classList.toggle('tampil', KUSTOM_P.banding);
      const ket = document.getElementById('kusKet');
      // Kalau pembandingnya tidak diisi, katakan apa yang dipakai -- bukan
      // diam-diam memakai rentang yang tidak pernah diminta.
      ket.textContent = KUSTOM_P.banding ? ''
        : `Without a compare range, this is measured against the ${b - a + 1} month`
          + `${b - a ? 's' : ''} immediately before it.`;
      if (SEL_P.includes('custom')){ pasangP(); gambarP(); tulisNow(); }
    };
    ['kusA','kusB','kusCA','kusCB','kusCek'].forEach(id => {
      const e = document.getElementById(id);
      if (e) e.onchange = ambil;
    });
    ambil();
  }

  dropP.querySelectorAll('.mdlist label').forEach(lb => {
    lb.onclick = ev => {
      ev.preventDefault(); ev.stopPropagation();
      const v = lb.dataset.v, i = SEL_P.indexOf(v);
      if (i >= 0) SEL_P.splice(i, 1); else SEL_P.push(v);
      if (v === 'custom' && i < 0 && !KUSTOM_P) gambarKustom();
      pasangP(); gambarP(); tulisNow();
    };
  });
  document.addEventListener('click', ev => {
    if (dropP.classList.contains('buka') && !dropP.contains(ev.target)){
      dropP.classList.remove('buka');
      btnP.setAttribute('aria-expanded', 'false');
    }
  });
  gambarP();
})();

/* ---------- tabel gabungan seluruh platform ---------- */
/* Platform "All" harus berarti benar-benar SELURUH platform, bukan diam-diam
   YouTube saja. Tabel gabungan ini dirakit sekali lalu disimpan: YouTube +
   empat socmed + revenue portal, disatukan pada metrik yang memang punya arti
   sama di semua sumbernya.

   Yang TIDAK ikut disatukan, dan alasannya:
   - Trafik portal (visits/pageviews/unique visitors). Sebuah kunjungan portal
     bukan sebuah view video; menjumlahkannya menghasilkan angka yang tidak
     berarti apa-apa. Metrik itu tetap ada di Platform = Portal.
   - Watch time, impressions, CTR, RPM/CPM, dan seluruh metrik khas YouTube.
     Tidak ada padanannya di socmed maupun portal. */
let _GABUNG = null;
function tabelGabungan(){
  if (_GABUNG) return _GABUNG;
  const cols = ['y', 'm', 'platform', 'unit', 'channel',
                'videos', 'views', 'engagement', 'lifetime', 'new_foll', 'revenue'];
  const rows = [];
  const lewat = [];

  // 1) YouTube. Engagement disusun dari like + share + komentar, karena Recap
  //    YouTube tidak punya satu kolom engagement seperti berkas socmed.
  {
    const t = TS('ts_youtube'), i = t.ix;
    for (const r of t.rows)
      rows.push([r[0], r[1], 'YouTube', r[i.unit], r[i.channel],
                 r[i.videos] || 0, r[i.views] || 0,
                 (r[i.likes] || 0) + (r[i.shares] || 0) + (r[i.comments] || 0),
                 r[i.lifetime] || 0, r[i.new_foll] || 0, r[i.revenue] || 0]);
  }

  // 2) Facebook, Instagram, TikTok, X
  {
    const t = TS('ts_socmed'), i = t.ix;
    for (const r of t.rows)
      rows.push([r[0], r[1], r[i.platform], r[i.unit], r[i.channel],
                 r[i.videos] || 0, r[i.views] || 0, r[i.engagement] || 0,
                 r[i.followers] || 0, r[i.new_followers] || 0, r[i.revenue] || 0]);
  }

  // 3) Revenue portal. Berkas ini menyebut portalnya ('INEWS ID', 'SINDONEWS.COM'),
  //    bukan clusternya, jadi clusternya dicocokkan dari nama itu. Yang tidak
  //    cocok TIDAK dibuang diam-diam -- namanya dicatat dan disebutkan.
  if (DATA.ts_portal_tipe){
    const t = TS('ts_portal_tipe'), i = t.ix;
    const daftarCl = Object.keys(UNIT_CH || {});
    const cari = nm => {
      const a = String(nm).toLowerCase().replace(/[^a-z0-9]/g, '');
      return daftarCl.find(u => a.includes(String(u).toLowerCase().replace(/[^a-z0-9]/g, ''))) || '';
    };
    for (const r of t.rows){
      const ch = String(r[i.channel]);
      const u = cari(ch);
      if (!u && !lewat.includes(ch)) lewat.push(ch);
      // Nama portal ('OKEZONE') mirip nama channel YouTube ('Okezone'), dan
      // kalau dipecah per channel keduanya berdiri bersebelahan seolah satu
      // channel muncul dua kali. Diberi keterangan supaya tidak tertukar.
      rows.push([r[0], r[1], 'Portal', u, (u || ch) + ' (portal)',
                 0, 0, 0, 0, 0, r[i.revenue] || 0]);
    }
  }

  const ix = {}; cols.forEach((c, k) => ix[c] = k);
  _GABUNG = {cols, rows, ix, lewat};
  return _GABUNG;
}

const METRIK_GABUNG = [
  {id: 'videos',     label: 'Videos published'},
  {id: 'views',      label: 'Views'},
  {id: 'engagement', label: 'Engagement'},
  {id: 'lifetime',   label: 'Lifetime Subscriber/Followers'},
  {id: 'new_foll',   label: 'New Subscribers/Followers'},
  {id: 'revenue',    label: 'Revenue (IDR)'},
];

function sumberDash(){
  const jp = jenisPlatform();

  if (jp === 'socmed'){
    if (DS.breakdown === 'overview')
      return {tabel: 'ts_socmed', src: 'socmed', nama: `Rekap Socmed — ${ACTIVE_PLAT}`,
              dim: [], plat: ACTIVE_PLAT,
              metrik: [{id: 'videos', label: 'Videos published'},
                       {id: 'views', label: 'Views'},
                       {id: 'followers', label: 'Lifetime Followers'},
                       {id: 'new_followers', label: 'New Followers'},
                       {id: 'engagement', label: 'Engagement'},
                       {id: 'revenue', label: 'Revenue (IDR)'}]};
    return {kosong: `The Rekap Socmed file only holds monthly summary figures
      (views, followers, engagement, revenue) for ${esc(ACTIVE_PLAT)}. It carries no
      per-content detail, no demographics, and no revenue sources, so this Breakdown
      is available for YouTube only.`, nama: 'Rekap Socmed', dim: [], metrik: []};
  }

  if (jp === 'portal'){
    if (DS.breakdown === 'overview')
      return {tabel: 'ts_portal', src: 'portal', nama: 'Portal Performance (Similarweb)',
              dim: [], bagi: 'n',
              metrik: [{id: 'visits', label: 'Visits'},
                       {id: 'pageviews', label: 'Pageviews'},
                       {id: 'uv', label: 'Unique Visitors'},
                       {id: 'dur_sum', label: 'Avg visit duration'},
                       {id: 'bounce_sum', label: 'Bounce rate (%)'}]};
    if (DS.breakdown === 'revenue' && DATA.ts_portal_tipe)
      return {tabel: 'ts_portal_tipe', src: 'portal', nama: 'Revenue Direct Sales Portal',
              dim: [], metrik: [{id: 'revenue', label: 'Revenue (IDR)'}]};
    return {kosong: `Similarweb only holds monthly portal traffic. It carries no
      per-content detail and no audience demographics, so this Breakdown is available
      for YouTube only.`, nama: 'Portal Performance', dim: [], metrik: []};
  }

  // ---- Platform "All": Overview membaca seluruh platform sekaligus ----
  if (!ACTIVE_PLAT && DS.breakdown === 'overview' && DATA.ts_socmed)
    return {tabel: '__gabung', src: 'gabung', nama: 'All platforms combined',
            dim: [], metrik: METRIK_GABUNG, gabung: true};

  // ---- YouTube ----
  if (DS.breakdown === 'content'){
    const n = nVideo(DS.dim);
    if (n && DS.sumber === 'komp' && DATA.top_video_komp)
      return {tabel: 'top_video_komp', metrik: DATA.metrik_video_komp || [],
              dim: ['ringkas'].concat(DIM_VIDEO),
              nama: 'Scraping YouTube (competitor)', src: 'scraping',
              video: true, n, peringkat: DATA.video_peringkat_komp || [], bagi: null};
    if (n && DS.sumber === 'img' && DATA.top_video)
      return {tabel: 'top_video', metrik: DATA.metrik_video || [],
              dim: (DATA.dim_content || []).concat(DIM_VIDEO),
              nama: 'Konten YouTube Studio', src: 'studio',
              video: true, n, peringkat: DATA.video_peringkat || [], bagi: null};
    if (DS.sumber === 'komp')
      // Kolom 'Category' di berkas Scraping isinya VOD / SHORTS / LIVE -- itu
      // Type Content, bukan kategori editorial. Jadi dia muncul sebagai pilihan
      // Grouping by, bukan sebagai Dimensi; berkas Scraping memang tidak punya
      // Program, Part, maupun Sub Part.
      // 'ringkas' = tampilan ringkasan seperti sebelumnya (dipecah lewat
      // Grouping by). Tanpa pilihan ini, memilih Kompetitor akan selalu jatuh
      // ke daftar video dan ringkasannya tidak bisa dicapai lagi.
      // Berkas Scraping punya kolom Category (VOD/SHORTS/LIVE) dan durasi
      // video, jadi keduanya bisa berdiri sebagai DIMENSI -- bukan cuma
      // sebagai pilihan Grouping by. Ambang durasinya sama dengan kolom
      // '8 Menit' di berkas Studio, jadi angkanya sebanding dengan sisi IMG.
      // Yang memang tidak ada di berkas Scraping: Program, Part, Sub Part.
      return {tabel: 'ts_komp', metrik: DATA.metrik_komp || [],
              dim: ['ringkas', 'type', 'durasi']
                     .concat(DATA.top_video_komp ? DIM_VIDEO : []),
              petaKol: {type: 'kategori', durasi: 'durasi'},
              nama: 'Scraping YouTube (competitor)', src: 'scraping', bagi: 'videos'};
    // Tabel fakta: setiap dimensi punya kolomnya sendiri pada baris yang sama,
    // jadi Dimensi APA PUN bisa dipecah per pengelompokan APA PUN -- "top
    // program di tiap Kategori", "top part di tiap Original", dan seterusnya --
    // tanpa perlu tabel silang tersendiri untuk setiap pasangan.
    if (DATA.ts_fakta)
      return {tabel: 'ts_fakta', metrik: DATA.metrik_content || [],
              dim: (DATA.dim_fakta || []).concat(DATA.top_video ? DIM_VIDEO : []),
              nama: 'Konten YouTube Studio', src: 'studio', fakta: true, bagi: 'videos'};
    return {tabel: 'ts_dim_ch', metrik: DATA.metrik_content || [],
            dim: (DATA.dim_content || []).concat(DATA.top_video ? DIM_VIDEO : []),
            nama: 'Konten YouTube Studio', src: 'studio', bagi: 'videos'};
  }
  if (DS.breakdown === 'revenue')
    // Sumber revenue adalah DIMENSI-nya breakdown ini, bukan sekadar salah satu
    // pilihan Grouping by. Dulu daftar 11 sumbernya cuma muncul kalau user
    // kebetulan memilih Grouping by "Revenue source"; tanpa itu layarnya cuma
    // satu angka total -- padahal justru rincian sumber itu isi breakdown ini.
    return {tabel: 'ts_revenue_source',
            metrik: DATA.metrik_revenue || [{id: 'revenue', label: 'Revenue (IDR)'}],
            dim: ['source'], dimKol: 'source',
            nama: 'Source Revenue YouTube', src: 'youtube'};
  return {tabel: 'ts_youtube', metrik: DATA.metrik_yt || [], dim: [],
          nama: 'Recap YouTube', src: 'youtube'};
}

/* Pilihan "Grouping by" yang benar-benar bisa dilayani sumber yang sedang aktif.
   Dihitung dari tabel DASAR (grouping dikosongkan dulu) — kalau tidak, begitu
   user memilih "Type Content" tabelnya berganti ke tabel silang yang tidak
   punya kolom channel, dan pilihan Channel ikut lenyap sehingga tidak bisa
   dikembalikan lagi. */
function grupTersedia(S){
  if (!S || S.kosong || S.video) return [];
  const simpan = DS.grup;
  DS.grup = '';
  const dasar = sumberDash();
  DS.grup = simpan;
  const ix = (TS(dasar.tabel) || {ix: {}}).ix || {};
  const out = [];
  // Platform diletakkan paling atas: kalau angkanya gabungan seluruh platform,
  // pertanyaan pertama yang wajar adalah "dari platform mana saja?".
  if (ix.platform !== undefined) out.push(['platform', 'Platform']);
  // Kolom 'group' di Portal Performance berisi IMG vs Kompetitor, BUKAN nama
  // cluster IMG. Kalau disamakan dengan Cluster, saringan cluster tampak
  // diterapkan padahal tidak -- itu jenis kesalahan yang paling sulit terlihat.
  if (ix.unit !== undefined || ix.cluster !== undefined) out.push(['cluster', 'Cluster']);
  else if (ix.group !== undefined) out.push(['cluster', 'IMG vs Competitor']);
  if (ix.channel !== undefined) out.push(['channel', 'Channel']);
  else if (ix.portal !== undefined) out.push(['channel', 'Portal']);
  // Source Revenue punya kolom channel DAN source, jadi keduanya ditawarkan --
  // bukan yang satu menutup yang lain.
  if (ix.source !== undefined && dasar.dimKol !== 'source')
    out.push(['sumber', 'Revenue source']);
  // Tabel fakta memuat ketujuh dimensi editorial sebagai kolom terpisah pada
  // baris yang sama, jadi semuanya bisa dipakai mengelompokkan. Yang sedang
  // dipakai sebagai Dimensi dikeluarkan: memecah Program per Program tidak
  // menghasilkan apa-apa selain satu baris di tiap kelompok.
  if (dasar.fakta){
    for (const d of (DATA.dim_fakta || []))
      if (d !== DS.dim) out.push([d, NAMA_DIM[d] || d]);
  }
  // Sisi kompetitor: Type Content diambil dari kolom Category berkas Scraping,
  // Duration dari kolom durasi video. Yang sedang dipakai sebagai Dimensi
  // dikeluarkan -- memecah Duration per Duration tidak menghasilkan apa-apa.
  else if (dasar.petaKol){
    for (const [d, kol] of Object.entries(dasar.petaKol))
      if (d !== DS.dim && ix[kol] !== undefined) out.push([d, NAMA_DIM[d] || d]);
  }
  return out;
}

/* Pengelompokan yang ditampilkan seluruhnya vs sepuluh teratas. Cluster,
   channel, sumber revenue, platform, Type Content, dan durasi jumlahnya sedikit
   dan sudah ditetapkan tim data untuk tampil semua; dimensi editorial seperti
   Program bisa ratusan, jadi dipotong sepuluh teratas (unduhan Excel tetap
   memuat semuanya). */
const GRUP_PENUH = ['platform', 'cluster', 'channel', 'sumber', 'type', 'durasi'];
const batasGrup = g => GRUP_PENUH.includes(g) ? Infinity : BATAS_DAFTAR.dim;

/* Kolom mana yang memuat nilai pengelompokan yang diminta. */
function kolomGrup(S, ix, grup){
  if (grup === 'platform') return ix.platform !== undefined ? 'platform' : null;
  if (grup === 'cluster')
    return ix.unit !== undefined ? 'unit' : ix.cluster !== undefined ? 'cluster'
         : ix.group !== undefined ? 'group' : null;
  if (grup === 'channel')
    return ix.channel !== undefined ? 'channel' : ix.portal !== undefined ? 'portal' : null;
  if (grup === 'sumber') return ix.source !== undefined ? 'source' : null;
  // Di tabel fakta setiap dimensi adalah kolomnya sendiri, jadi namanya
  // langsung dipakai. Ini harus didahulukan: kolom 'kategori' di tabel fakta
  // berisi kategori editorial, sedangkan di tabel kompetitor kolom bernama
  // sama berisi VOD/SHORTS/LIVE alias Type Content.
  if (S && S.fakta) return ix[grup] !== undefined ? grup : null;
  // Sisi kompetitor memakai nama kolomnya sendiri: 'kategori' di berkas
  // Scraping berisi VOD/SHORTS/LIVE, yaitu Type Content.
  if (S && S.petaKol && S.petaKol[grup])
    return ix[S.petaKol[grup]] !== undefined ? S.petaKol[grup] : null;
  if (grup === 'type') return ix.kategori !== undefined ? 'kategori' : null;
  return null;
}

/* Kolom yang memuat nilai DIMENSI (isi baris tabel). Tabel lama menaruhnya di
   satu kolom 'key' yang isinya berganti-ganti mengikuti kolom 'dim'; tabel
   fakta memberi tiap dimensi kolomnya sendiri, jadi namanya dipakai langsung. */
/* Nama dimensi yang sedang jadi isi baris. Sumber yang menyebut kolomnya
   sendiri (dimKol) dipakai duluan, supaya judul kolom tidak pernah menyebut
   dimensi lain yang kebetulan masih tersimpan di DS.dim. */
function namaDimAktif(S){
  const d = (S && S.dimKol) || DS.dim;
  return NAMA_DIM[d] || d;
}

function kolomDimDasar(S, ix){
  // Sumber yang menyebut kolom dimensinya sendiri dipakai apa adanya.
  if (S && S.dimKol) return ix[S.dimKol] !== undefined ? S.dimKol : null;
  if (S && S.petaKol && S.petaKol[DS.dim])
    return ix[S.petaKol[DS.dim]] !== undefined ? S.petaKol[DS.dim] : null;
  if (DS.breakdown !== 'content') return null;
  if (S && S.fakta) return ix[DS.dim] !== undefined ? DS.dim : null;
  return ix.key !== undefined ? 'key' : null;
}

/* Kolom yang mengisi baris tabel. Kalau sedang dipusatkan ke SATU nilai
   dimensi, dimensinya bukan lagi isi baris -- nilainya cuma satu. Yang
   mengisi baris kemudian adalah pengelompokannya, sehingga "cuma Affiliate
   program, dipecah per cluster" menghasilkan satu tabel cluster yang bersih. */
function kolomDim(S, ix){
  if (DS.fokus) return null;
  return kolomDimDasar(S, ix);
}

/* ---------- baca baris yang lolos seluruh filter ---------- */
function barisDash(P){
  const S = sumberDash();
  if (S.kosong) return {rows: [], ix: {}, S};
  const t = TS(S.tabel);
  if (!t) return {rows: [], ix: {}, S};
  const ix = t.ix;
  const clSet = ACTIVE_CH ? null
    : (ACTIVE_CL ? new Set((UNIT_CH[ACTIVE_CL] || []).map(x => x.toLowerCase())) : null);
  // Dipusatkan ke satu nilai dimensi -- misalnya hanya 'Affiliate program'.
  const kd = kolomDimDasar(S, ix);
  const kFokus = (DS.fokus && kd && ix[kd] !== undefined) ? kd : null;
  const out = [];
  for (const r of t.rows){
    if (!inP(r, P)) continue;
    if (S.plat && !S.gabung && ix.platform !== undefined && r[ix.platform] !== S.plat) continue;
    // Tabel fakta tidak punya kolom 'dim': setiap dimensi kolomnya sendiri,
    // jadi tidak ada baris yang perlu disaring -- semuanya ikut, lalu
    // dijumlahkan menurut kolom mana pun yang sedang dipakai.
    if (DS.breakdown === 'content' && DS.sumber === 'img' && !S.video && !S.fakta
        && ix.dim !== undefined && r[ix.dim] !== DS.dim) continue;
    if (kFokus && String(r[ix[kFokus]]) !== DS.fokus) continue;
    const ch = ix.channel !== undefined ? String(r[ix.channel]) : '';
    if (ACTIVE_CH){ if (!ch || ch.toLowerCase() !== ACTIVE_CH.toLowerCase()) continue; }
    else if (clSet && ch){ if (!clSet.has(ch.toLowerCase())) continue; }
    else if (ACTIVE_CL && ix.unit !== undefined){ if (r[ix.unit] !== ACTIVE_CL) continue; }
    else if (ACTIVE_CL && ix.cluster !== undefined){ if (r[ix.cluster] !== ACTIVE_CL) continue; }
    out.push(r);
  }
  return {rows: out, ix, S};
}

/* Saringan yang diminta user tapi tidak bisa dilayani tabel yang sedang dipakai.
   Ini harus dikatakan, kalau tidak angkanya tampil seolah-olah sudah tersaring. */
function saringanTakTerpakai(D){
  const ix = D.ix || {}, kur = [];
  const adaCluster = ix.unit !== undefined || ix.cluster !== undefined;
  const adaChannel = ix.channel !== undefined;
  if (ACTIVE_CL && !adaCluster) kur.push(`Cluster <b>${esc(ACTIVE_CL)}</b>`);
  if (ACTIVE_CH && !adaChannel) kur.push(`Channel <b>${esc(ACTIVE_CH)}</b>`);
  return kur;
}

/* ---------- deret bulanan satu metrik ---------- */
function deretBulan(rows, ix, id){
  const mp = new Map();
  for (const r of rows){
    const t = r[0] * 12 + r[1];
    mp.set(t, (mp.get(t) || 0) + (r[ix[id]] || 0));
  }
  return [...mp.entries()].sort((a, b) => a[0] - b[0]).map(([t, v]) => ({t, v}));
}

/* Metrik ber-akhiran _sum disimpan sebagai jumlah; nilai yang benar adalah
   rata-ratanya. Pembaginya jumlah baris yang ikut, bukan jumlah bulan. */
const perluRata = id => /_sum$/.test(id);
const namaBersih = lb => String(lb).replace(/\s*\(IDR\)/, '').replace(/Cummulative/, '').trim();

/* Berapa banyak satuan yang ada di balik satu baris tabel. Ini yang jadi
   pembagi metrik rata-rata (_sum). Salah pembagi = angka rata-rata yang jauh
   meleset: ER kompetitor pernah tampil 285% padahal yang benar 0.99%, karena
   jumlah ER seluruh video dibagi jumlah BARIS TABEL (172), bukan jumlah video
   (49.601). Sumber yang barisnya sudah satu satuan (Recap YouTube, Socmed)
   memang dibagi jumlah baris. */
function pembagiBaris(S, ix, r){
  const kol = S && S.bagi;
  if (kol && ix[kol] !== undefined) return r[ix[kol]] || 0;
  return 1;
}

function nilaiMetrik(rows, ix, id, S){
  if (ix[id] === undefined) return 0;
  if (METRIK_POSISI.includes(id)){          // nilai posisi -> bulan terakhir
    let akhir = -1, tot = 0;
    for (const r of rows) akhir = Math.max(akhir, r[0] * 12 + r[1]);
    for (const r of rows) if (r[0] * 12 + r[1] === akhir) tot += r[ix[id]] || 0;
    return tot;
  }
  let jml = 0, n = 0;
  for (const r of rows){
    const v = r[ix[id]];
    if (v === undefined) continue;
    jml += v;
    n += perluRata(id) ? pembagiBaris(S, ix, r) : 1;
  }
  return perluRata(id) ? (n ? jml / n : 0) : jml;
}

const mmss = d => `${Math.floor(d / 60)}:${String(Math.round(d % 60)).padStart(2, '0')}`;

function formatMetrik(id, lb, v){
  // 'dur_sum' ada di dua sumber dengan satuan berbeda: di Portal Performance
  // isinya DETIK (durasi kunjungan), di berkas Scraping isinya MENIT (durasi
  // video). Salah satu harus dibedakan, kalau tidak angkanya tampil dengan
  // satuan yang salah tanpa ada yang menyadari.
  if (id === 'dur_sum')
    return jenisPlatform() === 'portal' ? mmss(v) : NE(v) + ' min';
  if (id === 'bounce_sum') return PC(v * 100);
  if (/revenue|sales|rev_fresh|cpm|rpm/i.test(id)) return RPE(v);
  if (/ctr|_pct|pct/i.test(id)) return PC(v);
  if (id === 'avg_dur_sum') return NE(v) + ' sec';
  if (id === 'er_sum') return PC(v);
  if (id === 'watch' || id === 'watch_hours') return NE(v) + ' hrs';
  return NE(v);
}

/* ---------- grafik garis dengan crosshair ---------- */
function grafikGaris(deret, warna, id, lb, kunci){
  // Satu bulan bukan sifat metriknya, melainkan sifat rentangnya — keterangannya
  // ditulis sekali di kepala dashboard, bukan diulang di tiap kartu.
  if (deret.length < 2) return '';
  const W = 320, H = 84, PB = 16, PK = 4;
  const nilai = deret.map(d => d.v);
  const mx = Math.max(...nilai), mn = Math.min(0, ...nilai);
  const rg = (mx - mn) || 1;
  const x = i => PK + i * (W - PK * 2) / (deret.length - 1);
  const y = v => PB + (H - PB - 6) * (1 - (v - mn) / rg);
  const titik = deret.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H - 6} ${titik} ${x(deret.length - 1)},${H - 6}`;
  const lbl = t => `${BLN_EN[(t - 1) % 12].slice(0, 3)} ${String(Math.floor((t - 1) / 12)).slice(2)}`;
  const dot = deret.map((d, i) =>
    `<circle class="hv" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="9"
       fill="transparent" style="cursor:crosshair"></circle>`).join('');
  return `<div class="plot" data-kunci="${kunci}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Monthly trend of ${esc(namaBersih(lb))}">
      <line class="gd" x1="0" y1="${H - 6}" x2="${W}" y2="${H - 6}"></line>
      <polygon points="${area}" fill="${warna}" opacity=".08"></polygon>
      <polyline points="${titik}" fill="none" stroke="${warna}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"></polyline>
      <circle cx="${x(deret.length - 1).toFixed(1)}" cy="${y(deret[deret.length - 1].v).toFixed(1)}"
        r="3.4" fill="${warna}" stroke="#fff" stroke-width="2"></circle>
      <line class="cross" x1="0" y1="4" x2="0" y2="${H - 6}" stroke="${warna}"
        stroke-width="1" opacity="0" stroke-dasharray="3 3"></line>
      ${dot}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut);margin-top:3px">
      <span>${lbl(deret[0].t)}</span><span>${lbl(deret[deret.length - 1].t)}</span></div>
    <div class="tip"></div>
  </div>`;
}

/* ---------- daftar batang untuk rincian ---------- */
function daftarBatang(items, warna, id, lb){
  if (!items.length) return '';
  const mx = Math.max(...items.map(x => Math.abs(x.v))) || 1;
  return items.map(x => `
    <div class="bar-row">
      <span class="lb" title="${esc(x.k)}">${esc(x.k)}</span>
      <span class="vl">${formatMetrik(id, lb, x.v)}</span>
      <span class="bar-track"><span class="bar-fill"
        style="width:${Math.max(2, Math.abs(x.v) / mx * 100).toFixed(1)}%;background:${warna}"></span></span>
    </div>`).join('');
}

/* Jumlahkan satu metrik per nilai kolom. Dipakai daftar di kartu MAUPUN
   pengunduh Excel -- keduanya harus memakai hitungan yang sama persis, kalau
   tidak angka di layar dan angka di berkas bisa berbeda tanpa ketahuan. */
function agregatPer(rows, ix, S, kol, id){
  const mp = new Map();
  if (METRIK_POSISI.includes(id)){
    let akhir = -1;
    for (const r of rows) akhir = Math.max(akhir, r[0] * 12 + r[1]);
    for (const r of rows){
      if (r[0] * 12 + r[1] !== akhir) continue;
      const k = String(r[ix[kol]]);
      mp.set(k, (mp.get(k) || 0) + (r[ix[id]] || 0));
    }
  } else if (perluRata(id)){
    const n = new Map();
    for (const r of rows){
      const k = String(r[ix[kol]]);
      mp.set(k, (mp.get(k) || 0) + (r[ix[id]] || 0));
      n.set(k, (n.get(k) || 0) + pembagiBaris(S, ix, r));
    }
    for (const k of mp.keys()) mp.set(k, n.get(k) ? mp.get(k) / n.get(k) : 0);
  } else {
    for (const r of rows){
      const k = String(r[ix[kol]]);
      mp.set(k, (mp.get(k) || 0) + (r[ix[id]] || 0));
    }
  }
  return [...mp.entries()].map(([k, v]) => ({k, v})).filter(x => x.v);
}

/* Nama pengelompokan diambil dari menunya sendiri, supaya judul di kartu dan
   label di menu tidak pernah berbeda ('Portal' di menu tapi 'channel' di kartu). */
function labelGrup(g){
  const t = grupTersedia(sumberDash()).find(x => x[0] === g);
  return t ? t[1] : g;      // huruf besar/kecilnya sama persis dengan di menu
}

/* Cluster ditampilkan dengan urutan tetap (iNews, Sindonews, Okezone, IDX
   Channel) sesuai ketetapan tim data; kelompok lain mengikuti pilihan urutan. */
function urutkanGrup(arr, grup){
  if (grup === 'cluster'){
    const pos = k => { const i = URUT_CLUSTER.indexOf(k); return i < 0 ? 99 : i; };
    return arr.slice().sort((a, b) => pos(a.g) - pos(b.g) || b.tot - a.tot);
  }
  const arah = (DS.vsort && DS.vsort.arah === 1) ? 1 : -1;
  return arr.slice().sort((a, b) => (a.tot - b.tot) * arah);
}

/* Metrik yang benar-benar dipakai; kalau tidak ada yang dicentang, ambil satu. */
function metrikTerpakai(S){
  const m = (S.metrik || []).filter(x => DS.metrik.includes(x.id));
  return m.length ? m : [(S.metrik || [])[0]].filter(Boolean);
}

/* Kolom & arah yang sedang dipakai mengurutkan tabel. Tidak ada lagi menu Sort
   tersendiri: yang menentukan urutan adalah kepala kolom yang diklik, sama
   seperti tabel Top N video. Bawaannya metrik pertama, besar ke kecil. */
function urutanTabel(pakai){
  const sah = new Set(pakai.map(m => m.id).concat(['_k', '_g']));
  const id = (DS.vsort && sah.has(DS.vsort.id)) ? DS.vsort.id
           : (pakai[0] ? pakai[0].id : null);
  const arah = (DS.vsort && sah.has(DS.vsort.id)) ? DS.vsort.arah : -1;
  return {id, arah};
}

/* Satu baris per nilai kolom, dengan SELURUH metrik terpilih di sampingnya.
   Dulu tiap metrik menghasilkan kartunya sendiri, jadi views dan revenue tampil
   sebagai dua daftar terpisah dan tidak bisa dibaca berdampingan. */
function daftarGabung(rows, ix, S, kol, pakai){
  const peta = new Map();
  for (const m of pakai)
    for (const x of agregatPer(rows, ix, S, kol, m.id)){
      if (!peta.has(x.k)) peta.set(x.k, {});
      peta.get(x.k)[m.id] = x.v;
    }
  return [...peta.entries()].map(([k, v]) => ({k, v}));
}

function urutkanDaftar(arr, pakai, urut){
  const s = arr.slice();
  if (urut.id === '_k')
    s.sort((a, b) => String(a.k).localeCompare(String(b.k), 'id') * urut.arah);
  else
    s.sort((a, b) => (((a.v || {})[urut.id] || 0) - ((b.v || {})[urut.id] || 0)) * urut.arah);
  return s;
}

/* Berapa baris yang ditampilkan: channel, cluster, portal, dan sumber revenue
   ditampilkan SEMUA sesuai ketetapan tim data; dimensi editorial 10 teratas. */
function batasDaftar(kunci){
  return ['channel', 'cluster', 'sumber', 'portal', 'source'].includes(kunci)
    ? Infinity : BATAS_DAFTAR.dim;
}

function selAngka(m, v){
  return `<td class="ka">${v === undefined ? '—' : formatMetrik(m.id, m.label, v)}</td>`;
}

/* ---------- satu tabel, beberapa kolom metrik, kepala kolomnya bisa diklik ---------- */
function tabelDash(D){
  const S = D.S, ix = D.ix;
  const pakai = metrikTerpakai(S);
  if (!pakai.length) return '';
  const urut = urutanTabel(pakai);

  const gkol = DS.grup ? kolomGrup(S, ix, DS.grup) : null;
  const dalam = kolomDim(S, ix);
  const kunciDasar = gkol ? null : dalam;
  if (!gkol && !kunciDasar) return '';          // No grouping = memang tidak dipecah

  const panah = id => id === urut.id ? (urut.arah < 0 ? ' ▼' : ' ▲') : '';
  const th = (id, teks, kanan) =>
    `<th class="${kanan ? 'ka' : ''}${id === urut.id ? ' aktif' : ''}" data-urut="${id}"
       title="Click to sort by ${esc(teks)}">${esc(teks)}${panah(id)}</th>`;

  const namaKolomKunci = gkol
    ? (dalam ? namaDimAktif(S) : labelGrup(DS.grup))
    : namaDimAktif(S);

  const kepala = `<tr>${th('_k', namaKolomKunci)}${
    pakai.map(m => th(m.id, namaBersih(m.label), true)).join('')}</tr>`;

  const barisDari = (rows, batas) => {
    const it = urutkanDaftar(daftarGabung(rows, ix, S, rows === D.rows && kunciDasar
      ? kunciDasar : (dalam || gkol), pakai), pakai, urut);
    const potong = isFinite(batas) ? it.slice(0, batas) : it;
    return {it, potong};
  };

  let badan = '', kaki = '';
  if (!gkol){
    const {it, potong} = barisDari(D.rows, batasDaftar(kunciDasar));
    if (!it.length) return '';
    badan = `<tbody>${potong.map(x => `<tr>
      <td class="jd bisaFokus" data-fokus="${esc(x.k)}"
        title="Click to show only ${esc(x.k)}">${esc(x.k)}</td>
      ${pakai.map(m => selAngka(m, x.v[m.id])).join('')}</tr>`).join('')}</tbody>`;
    if (it.length > potong.length)
      kaki = `Top ${potong.length} of ${it.length} ${esc(namaKolomKunci.toLowerCase())}.`;
  } else {
    // dipecah per kelompok: tiap kelompok punya kepala dan totalnya sendiri
    const per = new Map();
    for (const r of D.rows){
      const g = String(r[ix[gkol]]);
      if (!per.has(g)) per.set(g, []);
      per.get(g).push(r);
    }
    const semuaG = urutkanGrup([...per.entries()].map(([g, rows]) =>
      ({g, rows, tot: nilaiMetrik(rows, ix, pakai[0].id, S)})), DS.grup);
    if (!semuaG.length) return '';
    // Mengelompokkan per Program bisa menghasilkan ratusan kelompok; yang
    // ditampilkan sepuluh teratas. Unduhan Excel tetap memuat semuanya.
    const batasG = dalam ? batasGrup(DS.grup) : Infinity;
    const urutG = isFinite(batasG) ? semuaG.slice(0, batasG) : semuaG;
    let dipotong = 0, semuaBaris = 0;
    badan = urutG.map(({g, rows}) => {
      if (!dalam){
        const nilai = {};
        for (const m of pakai) nilai[m.id] = nilaiMetrik(rows, ix, m.id, S);
        return {g, baris: [{k: g, v: nilai}], semua: 1};
      }
      const it = urutkanDaftar(daftarGabung(rows, ix, S, dalam, pakai), pakai, urut);
      const potong = it.slice(0, BATAS_DAFTAR.dim);
      dipotong += it.length - potong.length; semuaBaris += it.length;
      return {g, baris: potong, semua: it.length};
    }).filter(x => x.baris.length);

    if (!dalam){
      // kelompoknya sendiri yang jadi daftarnya -- satu tabel biasa
      const it = urutkanDaftar(badan.map(x => x.baris[0]), pakai, urut);
      const batas = batasGrup(DS.grup);
      const potong = isFinite(batas) ? it.slice(0, batas) : it;
      if (it.length > potong.length)
        kaki = `Top ${potong.length} of ${it.length}.`;
      badan = `<tbody>${potong.map(x => `<tr>
        <td class="jd" title="${esc(x.k)}">${esc(x.k)}</td>
        ${pakai.map(m => selAngka(m, x.v[m.id])).join('')}</tr>`).join('')}</tbody>`;
    } else {
      badan = badan.map(({g, baris, semua}) => `<tbody class="grp">
        <tr class="gh"><td colspan="${pakai.length + 1}">${esc(g)}${
          semua > baris.length
            ? `<span class="sisa">Top ${baris.length} of ${semua}</span>` : ''}</td></tr>
        ${baris.map(x => `<tr>
          <td class="jd bisaFokus" data-fokus="${esc(x.k)}"
            title="Click to show only ${esc(x.k)}">${esc(x.k)}</td>
          ${pakai.map(m => selAngka(m, x.v[m.id])).join('')}</tr>`).join('')}
      </tbody>`).join('');
      kaki = (semuaG.length > urutG.length
                ? `Top ${urutG.length} of ${semuaG.length} `
                : `${urutG.length} `)
        + `${esc(labelGrup(DS.grup).toLowerCase())} groups`
        + (dipotong ? `, top ${BATAS_DAFTAR.dim} ${esc(namaKolomKunci.toLowerCase())} each`
                     + ` (${semuaBaris} in total — the Excel download has them all).` : '.');
    }
  }

  return `<div class="kartu tab">
    <div class="tw"><table class="vtab dtab"><thead>${kepala}</thead>${badan}</table></div>
    ${kaki ? `<div class="ket">${kaki}</div>` : ''}
  </div>`;
}

/* ---------- ringkasan tiap metrik: angka besar, selisih, dan trennya ---------- */
function ubinMetrik(m, D, Dl, opt){
  const warna = warnaMetrik(m.id);
  const nilai = nilaiMetrik(D.rows, D.ix, m.id, D.S);
  const deret = deretBulan(D.rows, D.ix, m.id);

  let delta = '';
  if (opt.adaPembanding){
    const lalu = nilaiMetrik(Dl.rows, Dl.ix, m.id, Dl.S);
    if (lalu){
      const d = (nilai / lalu - 1) * 100;
      const kls = Math.abs(d) < 0.05 ? 'flat' : d > 0 ? 'up' : 'down';
      const tanda = Math.abs(d) < 0.05 ? '—' : d > 0 ? '▲' : '▼';
      delta = `<div class="delta ${kls}">${tanda} ${Math.abs(d).toFixed(1)}%
        <span class="kecil">vs ${esc(opt.Psbl.labelEn || opt.Psbl.label)}</span></div>`;
    }
  }
  return `<div class="kartu ubin">
    <div class="nm">${esc(namaBersih(m.label))}</div>
    <div class="hero">${formatMetrik(m.id, m.label, nilai)}</div>
    ${delta}
    ${grafikGaris(deret, warna, m.id, m.label, m.id)}
    ${perluRata(m.id) || METRIK_POSISI.includes(m.id)
      ? `<div class="ket">${METRIK_POSISI.includes(m.id)
          ? "Last month's standing value" : 'An average'}, not the sum of every month.</div>` : ''}
  </div>`;
}

/* Klik satu nilai dimensi -> seluruh dashboard dipusatkan ke nilai itu.
   Ini jalan keluar untuk "saya cuma mau lihat Affiliate program, dipecah per
   cluster": tanpa ini satu-satunya cara melihat satu sumber saja adalah

function pasangUrutTabel(el){
