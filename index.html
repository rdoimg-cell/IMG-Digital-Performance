<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask IMG Analytics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f8fafc; --line:#e3e8f0;
  --txt:#16202f; --mut:#64748b; --acc:#4f46e5; --acc2:#0ea5e9;
  --ok:#059669; --warn:#d97706; --bad:#e11d48;
  --shadow:0 1px 2px rgba(16,32,64,.05), 0 4px 16px rgba(16,32,64,.06);
}
body{
  font-family:'Inter','Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--txt);
  /* 100vh di browser HP memakai tinggi layar SEBELUM bilah alamat ikut
     dihitung, jadi bagian paling bawah -- kotak pertanyaan -- terpotong.
     100dvh mengikuti tinggi yang benar-benar terlihat; 100vh tetap ditulis
     lebih dulu sebagai cadangan untuk browser lama. */
  height:100vh;height:100dvh;overflow:hidden;
  background-image:radial-gradient(900px 520px at 10% -12%,rgba(79,70,229,.10),transparent 62%),
                   radial-gradient(800px 520px at 100% 0%,rgba(14,165,233,.09),transparent 58%),
                   radial-gradient(700px 460px at 50% 112%,rgba(168,85,247,.07),transparent 62%);
}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh;height:100dvh}

/* ---------- SIDEBAR ---------- */
.side{border-right:1px solid var(--line);background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  display:flex;flex-direction:column;overflow:hidden}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.logo .mark{height:30px;width:auto;object-fit:contain;display:block}
.logo h1{font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.logo span{font-size:11px;color:var(--mut);font-weight:500;display:block;margin-top:2px}
.live{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
  color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0;padding:5px 10px;border-radius:99px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Panel filter yang jadi penggulung utama sidebar. Di mode Dashboard daftar
   pertanyaan pintas disembunyikan, jadi kalau .pick tidak bisa digulir,
   menu paling bawah (Urutkan) dan daftar metrik yang terbuka ikut terpotong. */
.pick{padding:12px 14px 4px;border-bottom:1px solid var(--line);
  flex:0 1 auto;min-height:0;overflow-y:auto}
.pick h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);
  font-weight:700;margin:0 2px 7px}
.pick select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);color:var(--txt);font-size:12.5px;font-family:inherit;cursor:pointer;outline:none}
.pick select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.10)}
.pick .now{margin-top:7px;font-size:10.5px;color:var(--mut);line-height:1.45}
.pick .now b{color:var(--acc)}
/* Filter tambahan dibuat ringkas: dua kolom sejajar, dan baris channel hanya
   muncul setelah cluster dipilih -- supaya 20 channel tidak pernah tampil sekaligus. */
.pick .duo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.pick .fl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);
  font-weight:700;margin:0 2px 4px;display:block}
.pick select.kecil{padding:6px 8px;font-size:11.5px}
.pick .satu{margin-top:7px;display:none}
.pick .satu.tampil{display:block}
.pick .reset{margin-top:8px;display:none;font-size:10.5px;color:var(--acc);cursor:pointer;
  background:none;border:none;padding:0;font-family:inherit;font-weight:700;text-align:left}
.pick .reset.tampil{display:block}

.nav{flex:1;overflow-y:auto;padding:14px 14px 20px}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
.grp{margin-bottom:18px}
.grp h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);
  font-weight:700;margin:0 6px 8px}
.q{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);padding:9px 11px;border-radius:9px;font-size:12.5px;font-family:inherit;cursor:pointer;
  margin-bottom:5px;transition:.16s;line-height:1.35}
.q:hover{background:#eef2ff;border-color:#c7d2fe;color:var(--acc);transform:translateX(2px)}

.foot{padding:12px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut);line-height:1.6}
.foot .cr{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.foot .cr b{color:var(--acc);font-weight:700}
.foot .cr span{opacity:.75}

/* ---------- MAIN ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}

.chat{flex:1;overflow-y:auto;padding:26px 26px 8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:7px}.chat::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
.wrap{max-width:860px;margin:0 auto}

.msg{display:flex;gap:12px;margin-bottom:22px;animation:in .32s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.msg.bot .av{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 14px rgba(99,102,241,.35)}
.msg.me .av{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.bub{max-width:80%;min-width:0;padding:14px 17px;border-radius:14px;font-size:13.6px;line-height:1.62;
  overflow-wrap:anywhere;word-break:break-word}
.msg{min-width:0}
/* tabel lebar bisa digeser mendatar, bukan diperas sampai angka terpotong */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px -3px}
.tw::-webkit-scrollbar{height:5px}
.tw::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
.tw table{margin:0}
/* petunjuk kalau tabel masih ada lanjutannya ke kanan */
.tw{position:relative}
.tw.geser::after{content:'';position:sticky;right:0;top:0;float:right;width:26px;height:100%;
  pointer-events:none;background:linear-gradient(90deg,transparent,var(--panel) 78%)}
.geser-tip{font-size:10px;color:var(--mut);margin-top:-2px;margin-bottom:6px;display:none}
.geser-tip.on{display:block}
td.n,th{white-space:nowrap}          /* angka & judul kolom jangan dipotong */
td:first-child{overflow-wrap:anywhere;min-width:112px}
.msg.bot .bub{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;box-shadow:var(--shadow)}
.msg.me .bub{background:linear-gradient(135deg,var(--acc),#8b5cf6);border-top-right-radius:4px;font-weight:500}
.bub b{color:#0f172a;font-weight:700}
.msg.me .bub b{color:#fff}
.bub .hd{font-size:14.5px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.bub .note{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:11.8px;color:var(--mut);line-height:1.55}
.bub .pf{margin-top:10px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;font-size:11px;color:var(--mut);line-height:1.5}
.bub .pf b{color:var(--acc);font-weight:700}
.bub .acts{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.bub .acts button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);
  padding:6px 11px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;
  font-family:inherit;width:auto;transition:.15s}
.bub .acts button:hover{background:#eef2ff;border-color:#c7d2fe;color:var(--acc)}
.bub .warn{margin-top:11px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;
  border-radius:9px;font-size:12px;color:#92400e;line-height:1.6}
.bub .warn b{color:#78350f}
.bub .warn .t{font-weight:800;display:block;margin-bottom:3px}
.nope{line-height:1.75}
.nope .ok{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.nope code{background:var(--panel2);border:1px solid var(--line);padding:1px 6px;
  border-radius:5px;font-size:11.5px}

table{width:100%;border-collapse:collapse;margin:4px 0;font-size:12.6px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);
  font-weight:700;padding:6px 9px;border-bottom:1px solid var(--line)}
td{padding:7px 9px;border-bottom:1px solid #eef1f6}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:10.5px;
  font-weight:800;background:#eef2ff;color:var(--acc);margin-right:8px}
.rk.g1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2500}
.rk.g2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rk.g3{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.tag.img{background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
.tag.cmp{background:#f1f5f9;color:var(--mut);border:1px solid #e2e8f0}
.bar{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:4px}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 4px}
.cap>div{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:12.8px;font-weight:600}
.cap>div span:first-child{font-size:16px;line-height:1}
@media(max-width:520px){.cap{grid-template-columns:1fr}}

.typing{display:flex;gap:4px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bnc 1.3s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bnc{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.inp{padding:14px 26px 20px}
.box{max-width:860px;margin:0 auto;display:flex;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:7px 7px 7px 17px;transition:.2s;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.box{align-items:flex-end}
.box textarea{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.8px;
  font-family:inherit;padding:10px 0;resize:none;line-height:1.5;max-height:132px;overflow-y:auto;
  min-height:38px}
.box textarea::placeholder{color:var(--mut)}
.box textarea::-webkit-scrollbar{width:5px}
.box textarea::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
.box button{align-self:flex-end;flex-shrink:0}
.box button{background:linear-gradient(135deg,var(--acc),#8b5cf6);border:none;color:#fff;
  padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.18s}
.box button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(99,102,241,.42)}
.hint{max-width:860px;margin:9px auto 0;font-size:10.5px;color:var(--mut);text-align:center;line-height:1.7}

/* --- tombol lipat: bagan atas & panel kiri --- */
/* Baris kontrol tempat tombol menu (dan panah pembuka panel) berdiri.
   Namanya dulu .bar dan BENTROK dengan .bar milik batang perbandingan di kartu
   "IMG vs Kompetitor" -- aturan yang belakangan menang, jadi batang itu ikut
   jadi flex dan kehilangan warnanya. Sekarang barisnya bernama .ctl.
   Latar putih dan garis bawahnya dulu menyambung ke bagan ringkasan di atasnya;
   bagan itu sudah dihapus, jadi yang tersisa cuma sepotong bidang putih yang
   menggantung. Sekarang barisnya bening. */
.ctl{display:flex;align-items:center;gap:10px;padding:8px 26px 0;background:none;flex:0 0 auto}

/* Nama aplikasi di baris kontrol. Di layar lebar panel kiri sudah memuatnya,
   jadi hanya muncul di HP -- di sana panel kiri tertutup dan baris atasnya
   kosong melompong di sebelah tombol menu. */
.ctlNama{display:none}

/* Panah panel kiri ditempatkan DI DALAM panelnya sendiri. */
.lipatSide{display:none;position:absolute;top:16px;right:14px;width:26px;height:26px;
  border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:8px;
  cursor:pointer;font-size:16px;line-height:1;font-family:inherit;transition:.16s;padding:0}
.lipatSide:hover{color:var(--acc);border-color:#c7d2fe;background:#eef2ff}
@media(min-width:861px){ .lipatSide{display:grid;place-items:center} }
.brand{position:relative}

/* Saat panel disembunyikan, panah pembuka muncul di baris kontrol. */
.bukaSide{display:none;width:26px;height:26px;border:1px solid var(--line);background:var(--panel);
  color:var(--mut);border-radius:8px;cursor:pointer;font-size:16px;line-height:1;
  font-family:inherit;flex:none;transition:.16s;padding:0}
.bukaSide:hover{color:var(--acc);border-color:#c7d2fe;background:#eef2ff}
@media(min-width:861px){ .app.tanpaSide .bukaSide{display:grid;place-items:center} }
.app.tanpaSide{grid-template-columns:0 1fr}
.app.tanpaSide .side{opacity:0;pointer-events:none}

/* --- panel filter bisa dilipat --- */
.pick h3{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.pick h3 .tanda{font-size:12px;color:var(--mut);transition:transform .2s}
.pick.lipat h3 .tanda{transform:rotate(-90deg)}
.pick .isi{transition:max-height .26s ease, opacity .18s ease;overflow:hidden;max-height:1500px}
.pick.lipat .isi{max-height:0;opacity:0}
.pick.lipat{padding-bottom:10px}
.hint .by{opacity:.8}
.hint .by b{color:var(--acc);font-weight:700}

.burger{display:none}
.close{display:none}
#scrim{display:none}

@media(max-width:900px){
  .app{grid-template-columns:1fr}

  /* --- panel kiri jadi laci yang bisa ditutup --- */
  .side{position:fixed;inset:0 auto 0 0;width:284px;z-index:60;transform:translateX(-100%);
    transition:transform .25s ease;box-shadow:0 0 40px rgba(16,32,64,.22);background:#fff}
  .side.open{transform:none}
  #scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(16,32,64,.34);
    opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.on{opacity:1;pointer-events:auto}
  .brand{position:relative;padding-right:52px}
  .close{display:grid;place-items:center;position:absolute;top:16px;right:14px;
    width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
    color:var(--mut);font-size:14px;cursor:pointer;font-family:inherit;line-height:1}
  .close:active{background:#eef2ff}
  .burger{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--panel);
    border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:15px;box-shadow:var(--shadow);
    flex-shrink:0}

  /* Ruang atas dan bawah dibuat sama supaya tombol menu benar-benar duduk di
     tengah barisnya; dengan padding-bottom 0 tombolnya tampak melorot. */
  .ctl{padding:6px 12px}
  .ctlNama{display:block;font-weight:700;font-size:15px;color:var(--txt);
    letter-spacing:-.01em;line-height:1;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}

  .chat{padding:14px 13px 6px}
  /* Di layar HP percakapan didorong ke BAWAH, menempel kotak pertanyaan.
     Kalau ditumpuk dari atas seperti di layar lebar, satu kartu sapaan
     menyisakan setengah layar kosong di antara isi dan kotak pertanyaannya. */
  #wrap{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
  /* env(safe-area-inset-bottom) = tinggi bilah gestur di HP layar penuh.
     Tanpa ini kotak pertanyaan tertindih bilah itu. */
  .inp{padding:8px 13px calc(10px + env(safe-area-inset-bottom, 0px))}
  .bub{max-width:94%;font-size:13px;padding:12px 14px}
  table{font-size:11.5px}th{font-size:9px;padding:5px 7px}td{padding:6px 7px}
  .tw{margin-left:-4px;margin-right:-4px}
  td:first-child{min-width:96px}
}

/* ==================== DASHBOARD ==================== */
.mode{display:flex;gap:4px;padding:12px 14px 0}
.mode button{flex:1;padding:7px 0;border:1px solid var(--line);background:var(--panel2);
  color:var(--mut);border-radius:9px;font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:.15s}
.mode button.on{background:var(--acc);border-color:var(--acc);color:#fff;
  box-shadow:0 4px 12px rgba(79,70,229,.28)}

.dash{flex:1;overflow-y:auto;padding:20px 26px 40px;display:none;background:var(--bg)}
.dash.on{display:block}
.dash-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:4px}
.dash-hd h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.dash-sub{font-size:12px;color:var(--mut);line-height:1.6;margin-top:3px}
.dash-sub b{color:var(--acc)}
/* Tombol unduh di kepala dashboard. Sengaja di kanan atas, sejajar judulnya. */
.dash-hd{position:relative}
.unduh-dash{position:absolute;top:0;right:0;font:inherit;font-size:11.5px;font-weight:700;
  padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
  color:var(--txt);cursor:pointer;box-shadow:var(--shadow);transition:.15s;white-space:nowrap}
.unduh-dash:hover{border-color:var(--acc);color:var(--acc);background:#eef2ff}
@media(max-width:860px){
  .dash-hd{padding-right:0}
  .unduh-dash{position:static;margin-bottom:9px;width:100%}
}
.ket{font-size:11px;color:var(--mut);line-height:1.55;margin-top:10px}
.ket b{color:var(--txt)}
.dash-note{font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:6px;padding:6px 10px;
  border-left:3px solid var(--line);background:var(--panel2);border-radius:0 7px 7px 0;max-width:760px}
.chip-set{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:#eef2ff;color:var(--acc);border:1px solid #c7d2fe}
.chip.abu{background:var(--panel2);color:var(--mut);border-color:var(--line)}

.kartu-grid{display:grid;gap:14px;margin-top:16px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
/* Kartu yang isinya dipecah per kelompok jadi jauh lebih panjang — diberi
   ruang lebih lebar supaya nama program yang panjang tidak terpotong. */
.kartu-grid.lebar{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.kartu{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0}
.kartu .nm{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--mut);font-weight:700}
.kartu .hero{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:5px;
  line-height:1.15}
.kartu .delta{font-size:11.5px;font-weight:700;margin-top:3px}
.kartu .delta .kecil{color:var(--mut);font-weight:500}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.kartu .cap{font-size:10.5px;color:var(--mut);margin-top:9px;line-height:1.55}

.plot{position:relative;margin-top:12px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .gd{stroke:var(--line);stroke-width:1}
.plot .ax{fill:var(--mut);font-size:9px}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:#0f172a;color:#fff;font-size:11px;padding:6px 9px;border-radius:7px;
  white-space:nowrap;transform:translate(-50%,-130%);z-index:5;line-height:1.5}
.tip b{color:#fff}
.tip .s{color:#94a3b8}

.rinci{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}
.rinci .jd{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);
  font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  font-size:12px;margin-bottom:7px}
.bar-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar-row .vl{font-variant-numeric:tabular-nums;font-weight:700;font-size:11.5px}
.bar-track{display:block;grid-column:1/-1;height:6px;border-radius:99px;
  background:var(--panel2);overflow:hidden;margin-top:-2px}
.bar-fill{display:block;height:6px;border-radius:99px;transition:width .35s ease}

.kosong-kartu{padding:26px 18px;text-align:center;color:var(--mut);font-size:12.5px;
  line-height:1.7;background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.kosong-kartu b{color:var(--txt)}

.met-info{font-size:10px;color:var(--mut);margin-top:6px;line-height:1.5}

/* Daftar metrik: satu baris ringkas yang bisa dibuka, bentuknya sengaja
   disamakan dengan menu Platform/Breakdown supaya panel kiri tetap pendek
   walaupun metriknya 24. */
.mdrop{position:relative}
.mdbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;
  font:inherit;font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--txt);cursor:pointer;text-align:left}
.mdbtn:hover{border-color:#c7d2fe}
.mdbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdbtn i{font-style:normal;color:var(--mut);font-size:10px;transition:transform .18s}
.mdrop.buka .mdbtn{border-color:var(--acc)}
.mdrop.buka .mdbtn i{transform:rotate(180deg)}
/* Daftarnya mengalir di dalam panel (bukan melayang di atasnya): panel kiri
   punya penggulung sendiri, dan kotak melayang selalu terpotong di batasnya. */
.mdlist{display:none;margin-top:5px;max-height:240px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.mdrop.buka .mdlist{display:block}
.mdlist label{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:6px 8px;
  border-radius:7px;cursor:pointer;user-select:none;line-height:1.35}
.mdlist label:hover{background:var(--panel2)}
.mdlist label.on{background:#eef2ff;color:var(--acc);font-weight:700}
.mdlist input{width:13px;height:13px;flex:0 0 auto;accent-color:var(--acc);pointer-events:none}

/* Cap versi di kaki panel: satu-satunya cara cepat memastikan berkas mana yang
   sedang dibuka. Kalau nomornya tidak sesuai yang dikirim, yang terbuka
   salinan lama -- bukan fiturnya yang tidak jalan. */
.cr.bld{margin-top:3px;opacity:.75;font-variant-numeric:tabular-nums}

/* Kotak Custom: muncul di bawah menu periode hanya kalau Custom dicentang. */
.kustom{display:none;margin-top:7px;padding:8px 9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2)}
.kustom.tampil{display:block}
/* Dua kotak berdampingan dengan namanya di ATAS, bukan sederet "From [..] to
   [..]": pada lebar panel HP (255px) deretan itu terpaksa membungkus dan
   kedua kotaknya jadi tidak sama lebar. */
.kustom .kbar{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kustom .kbar + .kbar,.kustom .kcek{margin-top:7px}
.kustom .kl{display:block;margin-bottom:3px;font-size:10px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.04em}
.kustom select.kus{width:100%;min-width:0;font-size:11.5px;padding:5px 6px}
.kustom .kcek{display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;
  user-select:none;color:var(--txt)}
.kustom .kcek input{width:13px;height:13px;accent-color:var(--acc)}
.kustom .kcmp{display:none}
.kustom .kcmp.tampil{display:grid}
.kustom .kket{font-size:10.5px;color:var(--mut);line-height:1.4;margin-top:6px}
.kustom .kket:empty{margin:0}

/* Ubin ringkasan: satu per metrik, jauh lebih ringkas daripada kartu lama --
   rinciannya sekarang ada di satu tabel bersama di bawahnya. */
.ubin-grid{display:grid;gap:12px;margin-top:16px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.kartu.ubin{padding:13px 15px 11px}
.kartu.ubin .hero{font-size:23px}
.kartu.tab{margin-top:14px;padding:12px 12px 10px}
/* Kolom nama menyerap sisa lebarnya; kolom angka selebar isinya saja, supaya
   angkanya berdekatan dan mudah dibandingkan antar baris. */
.dtab td.jd,.dtab th:first-child{width:100%;min-width:150px}
.dtab td.jd{font-weight:500}
/* Nilai dimensi bisa diklik untuk memusatkan tampilan ke nilai itu saja. */
.dtab td.jd.bisaFokus{cursor:pointer}
.dtab td.jd.bisaFokus:hover{color:var(--acc);text-decoration:underline}
.chip.fokus{cursor:pointer;background:#eef2ff;color:var(--acc);border-color:#c7d2fe}
.chip.fokus b{margin-left:3px;opacity:.7}
.chip.fokus:hover b{opacity:1}
.dtab th.ka,.dtab td.ka{width:1%;white-space:nowrap;padding-left:20px}
.dtab tbody.grp+tbody.grp{border-top:6px solid var(--bg)}
.dtab tr.gh td{background:var(--panel2);font-weight:800;font-size:11.5px;
  padding:7px 9px;border-bottom:1px solid var(--line)}
.dtab tr.gh .sisa{float:right;font-weight:500;font-size:10px;color:var(--mut)}

/* Tabel Top N video. Kepala kolomnya bisa diklik untuk mengurutkan. */
.kartu.vid{padding:14px 14px 12px}
.vtab{width:100%;border-collapse:collapse;font-size:12px}
.vtab th{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);
  font-weight:700;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2}
.vtab th:first-child{cursor:default}
.vtab th:hover{color:var(--acc)}
.vtab th.aktif{color:var(--acc)}
.vtab th.ka,.vtab td.ka{text-align:right}
.vtab td{padding:7px 9px;border-bottom:1px solid var(--panel2);vertical-align:top}
.vtab tbody tr:hover{background:var(--panel2)}
.vtab td.no{color:var(--mut);font-variant-numeric:tabular-nums;width:26px}
.vtab td.jd{min-width:230px;max-width:420px}
.vtab td.tg{white-space:nowrap;color:var(--mut);font-variant-numeric:tabular-nums}
.vtab td.ka{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

/* Pengelompokan: tiap kelompok punya judul dan totalnya sendiri. */
.grup{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.grup:first-of-type{border-top:0;padding-top:2px;margin-top:2px}
.grup-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12px;font-weight:800;margin-bottom:7px}
.grup-hd .grup-tot{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700;
  font-size:11px}
.grup-sisa{font-size:9.5px;color:var(--mut);margin:-2px 0 2px}

@media(max-width:860px){
  .dash{padding:14px 12px 30px}
  .kartu-grid{grid-template-columns:1fr}
  .dash-hd h2{font-size:17px}
}
</style>
</head>

<script>
const DATA = window.__IMG_DATA__;

/* ====================== SAMBUNGAN KE CLAUDE (opsional) ======================
   Kosong = aplikasi bekerja persis seperti tanpa AI: mesin kata kunci saja,
   offline, gratis. Diisi = dua kemampuan tambahan menyala.

   Alamat ini menunjuk ke PERANTARA (Cloudflare Worker), bukan langsung ke API
   Anthropic. API key disimpan di perantara itu, tidak pernah ikut ke browser --
   penting, karena berkas ini berada di repo publik.

   Yang dikirim ke Claude hanya kalimat pertanyaan dan tabel hasil yang kecil.
   ANGKA TETAP DIHITUNG DI SINI, dari data lokal. Claude tidak pernah memegang
   datanya, jadi tidak punya kesempatan mengarang angka. */
const AI_URL = '';
const adaAI = () => typeof AI_URL === 'string' && /^https?:\/\//.test(AI_URL);

async function tanyaAI(system, prompt, maxTokens){
  const r = await fetch(AI_URL, {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({system, prompt, max_tokens: maxTokens || 400}),
  });
  const j = await r.json().catch(() => ({error: 'Jawaban perantara bukan JSON'}));
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return String(j.text || '').trim();
}
const IMG_UNITS = ['iNews','Sindonews','Okezone','IDX Channel'];

/* ---------- helpers ---------- */
/* Angka yang tampil dibulatkan ('545.13 jt'), tapi nilai aslinya diselipkan di
   data-v. Pengunduh Excel membaca data-v itu, jadi berkasnya memuat angka
   PERSIS -- bukan hasil membaca ulang tulisan yang sudah dibulatkan. */
const _Nteks = n => {
  n = Number(n)||0;
  if(Math.abs(n)>=1e12) return (n/1e12).toFixed(2)+' triliun';
  if(Math.abs(n)>=1e9)  return (n/1e9).toFixed(2)+' miliar';
  if(Math.abs(n)>=1e6)  return (n/1e6).toFixed(2)+' jt';
  if(Math.abs(n)>=1e3)  return (n/1e3).toFixed(1)+' rb';
  return n.toLocaleString('id-ID',{maximumFractionDigits:2});
};
const N = n => `<span data-v="${Number(n)||0}">${_Nteks(n)}</span>`;
const RP = n => `<span data-v="${Number(n)||0}">Rp ${_Nteks(n)}</span>`;
const PC = n => `<span data-v="${Number(n)||0}">${(Number(n)||0).toFixed(2)}%</span>`;

/* Angka versi Inggris -- dipakai HANYA di Dashboard, yang seluruh tulisannya
   memang bahasa Inggris. Mode Ask tetap memakai N()/RP() dengan
   triliun/miliar/jt/rb supaya jawabannya tidak ikut berubah. */
const NE = n => {
  n = Number(n)||0;
  if(Math.abs(n)>=1e12) return (n/1e12).toFixed(2)+'T';
  if(Math.abs(n)>=1e9)  return (n/1e9).toFixed(2)+'B';
  if(Math.abs(n)>=1e6)  return (n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3)  return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString('en-US',{maximumFractionDigits:2});
};
const RPE = n => 'Rp ' + NE(n);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rk = i => `<span class="rk ${i<3?'g'+(i+1):''}">${i+1}</span>`;
const isIMG = c => IMG_UNITS.some(u => String(c).toLowerCase().includes(u.toLowerCase()));
const tagOf = c => isIMG(c) ? '<span class="tag img">IMG</span>' : '<span class="tag cmp">Kompetitor</span>';

function table(head, rows){
  return `<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th${i>0?' style="text-align:right"':''}>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>0?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function card(title, body, note){
  return `<div class="hd">${title}</div>${body}${note?`<div class="note">${note}</div>`:''}`;
}


/* ---------- PERIODE ---------- */
const BLN_ID = ['Januari','Februari','Maret','April','Mei','Juni',
                'Juli','Agustus','September','Oktober','November','Desember'];

/* Nama bulan versi Inggris. Dipakai HANYA di panel kiri dan Dashboard; mode Ask
   tetap memakai BLN_ID supaya jawaban dan cara membaca pertanyaan tidak ikut
   berubah. */
const BLN_EN = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

// urut dari yang paling panjang, supaya "januari" tidak keburu cocok ke "jan"
const BLN_MAP = [
  ['januari',1],['january',1],['jan',1],
  ['februari',2],['february',2],['pebruari',2],['feb',2],
  ['maret',3],['march',3],['mar',3],
  ['april',4],['apr',4],
  ['mei',5],['may',5],
  ['juni',6],['june',6],['jun',6],
  ['juli',7],['july',7],['jul',7],
  ['agustus',8],['august',8],['agu',8],['agt',8],['aug',8],
  ['september',9],['sept',9],['sep',9],
  ['oktober',10],['october',10],['okt',10],['oct',10],
  ['november',11],['nov',11],
  ['desember',12],['december',12],['des',12],['dec',12],
];
const BLN_RE = BLN_MAP.map(x => x[0]).join('|');
const blnNo = w => (BLN_MAP.find(x => x[0] === w) || [null, null])[1];

const ymLabelBln = (P, B) => P.y1 === P.y2
  ? (P.m1 === P.m2 ? `${B[P.m1-1]} ${P.y1}`
                   : `${B[P.m1-1]}–${B[P.m2-1]} ${P.y1}`)
  : `${B[P.m1-1]} ${P.y1} – ${B[P.m2-1]} ${P.y2}`;
const ymLabel = P => ymLabelBln(P, BLN_ID);

const mkP = (y1,m1,y2,m2) => {
  const P = {y1,m1,y2,m2};
  P.label = ymLabel(P);          // dipakai mode Ask
  P.labelEn = ymLabelBln(P, BLN_EN);   // dipakai panel kiri & Dashboard
  return P;
};

/* Membaca periode dari kalimat. Mengembalikan null kalau tidak ada periode. */
function parsePeriod(qRaw){
  const q = ' ' + qRaw.toLowerCase().replace(/[–—]/g, '-') + ' ';
  const cov = (DATA.coverage && DATA.coverage.youtube) || null;
  const LY = cov ? cov.to[0] : new Date().getFullYear();
  const LM = cov ? cov.to[1] : 12;
  let m;

  /* "3 bulan terakhir" / "6 bulan terakhir" */
  if ((m = q.match(/(\d{1,2})\s*bulan\s*(terakhir|belakangan|ke\s*belakang)/))){
    const n = Math.max(1, Math.min(48, parseInt(m[1], 10)));
    const end = LY * 12 + LM, start = end - n + 1;
    return mkP(Math.floor((start - 1) / 12), (start - 1) % 12 + 1, LY, LM);
  }

  /* "bulan lalu" / "bulan kemarin" */
  if (/bulan\s*(lalu|kemarin|sebelumnya)/.test(q)){
    const t = LY * 12 + LM - 1;
    return mkP(Math.floor((t - 1) / 12), (t - 1) % 12 + 1, Math.floor((t - 1) / 12), (t - 1) % 12 + 1);
  }

  /* "bulan ini" / "bulan terakhir" */
  if (/bulan\s*(ini|terakhir)\b/.test(q)) return mkP(LY, LM, LY, LM);

  /* "ytd" / "year to date" / "tahun ini" */
  if (/\bytd\b|year\s*to\s*date|tahun\s*(ini|berjalan)/.test(q)) return mkP(LY, 1, LY, LM);

  /* "tahun lalu" */
  if (/tahun\s*(lalu|kemarin|sebelumnya)/.test(q)) return mkP(LY - 1, 1, LY - 1, 12);

  /* rentang lengkap: "januari 2025 - maret 2026" */
  if ((m = q.match(new RegExp(`\\b(${BLN_RE})\\s*(20\\d\\d)\\s*(?:-|s/?d|sampai|hingga|sd|to)\\s*(${BLN_RE})\\s*(20\\d\\d)`)))){
    return mkP(+m[2], blnNo(m[1]), +m[4], blnNo(m[3]));
  }

  /* rentang satu tahun: "jan-juli 2026", "januari sampai juli 2026" */
  if ((m = q.match(new RegExp(`\\b(${BLN_RE})\\s*(?:-|s/?d|sampai|hingga|sd|to)\\s*(${BLN_RE})\\s*(20\\d\\d)?`)))){
    const y = m[3] ? +m[3] : LY;
    return mkP(y, blnNo(m[1]), y, blnNo(m[2]));
  }

  /* kuartal: "q1 2026", "kuartal 2 2026", "triwulan 3" */
  if ((m = q.match(/\b(?:q|kuartal\s*|triwulan\s*)([1-4])\b\s*(20\d\d)?/))){
    const k = +m[1], y = m[2] ? +m[2] : LY;
    return mkP(y, k * 3 - 2, y, k * 3);
  }

  /* semester: "semester 1 2026", "h1 2026" */
  if ((m = q.match(/\b(?:semester\s*|smt\s*|h)([12])\b\s*(20\d\d)?/))){
    const h = +m[1], y = m[2] ? +m[2] : LY;
    return mkP(y, h * 6 - 5, y, h * 6);
  }

  /* satu bulan: "juli 2026" atau "bulan juli" */
  if ((m = q.match(new RegExp(`\\b(${BLN_RE})\\s*(20\\d\\d)`)))){
    return mkP(+m[2], blnNo(m[1]), +m[2], blnNo(m[1]));
  }
  if ((m = q.match(new RegExp(`\\bbulan\\s+(${BLN_RE})\\b`)))){
    return mkP(LY, blnNo(m[1]), LY, blnNo(m[1]));
  }

  /* tahun saja: "2025" atau "tahun 2025" */
  if ((m = q.match(/\b(?:tahun\s*)?(20\d\d)\b/))){
    const y = +m[1];
    return mkP(y, 1, y, y === LY ? LM : 12);
  }

  /* nama bulan berdiri sendiri tanpa tahun: "revenue Mei" -> Mei tahun terakhir */
  if ((m = q.match(new RegExp(`\\b(${BLN_RE})\\b`)))){
    const bl = blnNo(m[1]);
    const y = bl <= LM ? LY : LY - 1;     // bulan yang belum lewat -> tahun sebelumnya
    return mkP(y, bl, y, bl);
  }

  return null;
}


/* Membaca DUA periode dari kalimat, mis. "revenue Q1 vs Q2 2026".
   Kalau sisi kiri tidak menyebut tahun, tahun diambil dari sisi kanan. */
function parsePeriodPair(qRaw){
  const q = qRaw.toLowerCase().replace(/[–—]/g, '-');
  const parts = q.split(/\s+(?:vs\.?|versus|dibandingkan\s+dengan|dibandingkan|dibanding|bandingkan|banding|lebih\s+\w+\s+dari(?:pada)?|daripada|ketimbang)\s+/);
  if (parts.length !== 2) return null;

  const B = parsePeriod(parts[1]);
  if (!B) return null;

  let kiri = parts[0];
  const thn = parts[1].match(/20\d\d/);
  if (thn && !/20\d\d/.test(kiri)) kiri += ' ' + thn[0];
  const A = parsePeriod(kiri);
  if (!A) return null;
  if (A.y1 === B.y1 && A.m1 === B.m1 && A.y2 === B.y2 && A.m2 === B.m2) return null;
  return [A, B];
}

/* Kartu perbandingan dua periode. */
function comparePeriods(qRaw, A, B){
  const q = qRaw.toLowerCase();
  const hasQ = (...w) => w.some(x => q.includes(x));
  // delta(nilaiKolomA, nilaiKolomB) = perubahan DARI kolom A KE kolom B,
  // supaya panah searah dengan urutan kolom yang tampil di tabel.
  const delta = (a, b) => {
    if (!a) return '—';
    const d = (b / a - 1) * 100;
    return `<span style="color:${d >= 0 ? 'var(--ok)' : 'var(--bad)'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%</span>`;
  };
  const perCluster = /cluster|kluster|\bunit\b|divisi/.test(q);
  const sum = (ts, P, col) => rollup(TS(ts), P, ['y'], [col]).list.reduce((a, x) => a + x[col], 0);

  /* --- portal --- */
  if (hasQ('portal', 'traffic', 'visit', 'situs')){
    const f = c => [sum('ts_portal', A, c), sum('ts_portal', B, c)];
    const [v1, v2] = f('visits'), [p1, p2] = f('pageviews'), [u1, u2] = f('uv');
    return card(`⚖️ Portal — ${A.label} vs ${B.label}`,
      table(['Metrik', A.label, B.label, 'Selisih'], [
        ['Total visits', N(v1), N(v2), delta(v1, v2)],
        ['Page views', N(p1), N(p2), delta(p1, p2)],
        ['Unique visitors', N(u1), N(u2), delta(u1, u2)],
      ]), covNote(A, 'portal') + covNote(B, 'portal'));
  }

  /* --- socmed --- */
  if (hasQ('socmed', 'sosmed', 'tiktok', 'instagram', 'facebook', 'platform', 'follower')){
    const foll = P => rollup(TS('ts_socmed'), P, ['platform', 'channel'], ['views', 'engagement'], ['followers'])
      .list.reduce((a, x) => ({f: a.f + x.followers, v: a.v + x.views, e: a.e + x.engagement}), {f: 0, v: 0, e: 0});
    const a = foll(A), b = foll(B);
    return card(`⚖️ Social Media — ${A.label} vs ${B.label}`,
      table(['Metrik', A.label, B.label, 'Selisih'], [
        ['Followers (akhir periode)', N(a.f), N(b.f), delta(a.f, b.f)],
        ['Views', N(a.v), N(b.v), delta(a.v, b.v)],
        ['Engagement', N(a.e), N(b.e), delta(a.e, b.e)],
      ]), covNote(A, 'socmed') + covNote(B, 'socmed'));
  }

  /* --- YouTube: revenue / views / subscriber (default) --- */
  const gy = P => {
    const r = rollup(TS('ts_youtube'), P, ['unit', 'channel'], ['revenue', 'views', 'watch', 'subs_gained'], ['lifetime']);
    const t = r.list.reduce((a, x) => ({
      rev: a.rev + x.revenue, views: a.views + x.views, watch: a.watch + x.watch,
      sg: a.sg + x.subs_gained, life: a.life + x.lifetime}), {rev: 0, views: 0, watch: 0, sg: 0, life: 0});
    t.months = r.months; t.list = r.list;
    return t;
  };
  const a = gy(A), b = gy(B);

  const baris = [
    ['Revenue', RP(a.rev), RP(b.rev), delta(a.rev, b.rev)],
    ['Views', N(a.views), N(b.views), delta(a.views, b.views)],
    ['Watch time', N(a.watch) + ' jam', N(b.watch) + ' jam', delta(a.watch, b.watch)],
    ['Subscriber bertambah', '+' + N(a.sg), '+' + N(b.sg), delta(a.sg, b.sg)],
    ['Jumlah bulan', a.months, b.months, '—'],
    ['Revenue / bulan', RP(a.months ? a.rev / a.months : 0), RP(b.months ? b.rev / b.months : 0),
      delta(a.months ? a.rev / a.months : 0, b.months ? b.rev / b.months : 0)],
  ];

  // rincian kalau yang ditanya revenue, atau kalau diminta per cluster
  let extra = '';
  const mintaRev = hasQ('revenue', 'profit', 'duit', 'uang', 'cuan', 'pendapatan', 'penghasilan');
  if (mintaRev || perCluster){
    // grain mengikuti pertanyaan: "per cluster" -> unit, selain itu -> channel
    const grain = perCluster ? 'unit' : 'channel';
    const met   = mintaRev ? 'revenue'
                : hasQ('subscriber', 'follower') ? 'subs_gained'
                : hasQ('watch time', 'watch', 'durasi tonton') ? 'watch' : 'views';
    const namaM = {revenue: 'Revenue', views: 'Views', watch: 'Watch time',
                   subs_gained: 'Subscriber bertambah'}[met];
    const fmtM  = met === 'revenue' ? RP : met === 'watch' ? (v => N(v) + ' jam') : N;
    const mp = new Map();
    const isi = (list, sisi) => list.forEach(x => {
      const k = x[grain];
      const o = mp.get(k) || {ch: k, a: 0, b: 0};
      o[sisi] += x[met]; mp.set(k, o);
    });
    isi(a.list, 'a'); isi(b.list, 'b');
    let rows = [...mp.values()].filter(x => x.a || x.b).sort((x, y) => (y.a + y.b) - (x.a + x.b));
    const semua = rows.length;
    const totA = rows.reduce((s, x) => s + x.a, 0), totB = rows.reduce((s, x) => s + x.b, 0);
    if (grain === 'channel') rows = rows.slice(0, 10);
    const isiTabel = rows.map((r, i) => [rk(i) + esc(r.ch), fmtM(r.a), fmtM(r.b), delta(r.a, r.b)]);
    // baris TOTAL hanya benar kalau tidak ada baris yang dipotong
    if (rows.length === semua)
      isiTabel.push([`<b>TOTAL</b>`, `<b>${fmtM(totA)}</b>`, `<b>${fmtM(totB)}</b>`, delta(totA, totB)]);
    extra = `<div style="margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700">${namaM} per ${grain === 'unit' ? 'cluster' : 'channel'}</div>`
      + table([grain === 'unit' ? 'Cluster' : 'Channel', A.label, B.label, 'Selisih'], isiTabel)
      + (rows.length < semua ? `<div style="margin-top:6px;font-size:11px;color:var(--mut)">Menampilkan ${rows.length} dari ${semua} channel (diurutkan dari terbesar), jadi tidak ada baris total.</div>` : '');
  }

  const naik = b.rev >= a.rev;
  return card(`⚖️ YouTube IMG — ${A.label} vs ${B.label}`,
    table(['Metrik', A.label, B.label, 'Selisih'], baris) + extra,
    `Revenue <b>${naik ? 'naik' : 'turun'} ${Math.abs((b.rev / (a.rev || 1) - 1) * 100).toFixed(1)}%</b> dari ${A.label} ke ${B.label}. `
    + `Kolom "Selisih" = perubahan dari ${A.label} ke ${B.label}.`
    + covNote(A, 'youtube') + covNote(B, 'youtube'));
}

/* ---------- AKSES DERET WAKTU ---------- */
function TS(name){
  if (name === '__gabung') return tabelGabungan();
  const t = DATA[name] || {cols: [], rows: []};
  const ix = {}; t.cols.forEach((c, i) => ix[c] = i);
  return {ix, rows: t.rows, has: t.rows.length > 0};
}
const inP = (r, P) => {
  if (!P) return true;
  const t = r[0] * 12 + r[1];
  // Periode boleh terdiri dari beberapa potong yang tidak bersambung -- Q1 dan
  // Q3 misalnya. Kalau ada daftar bulannya, itu yang menentukan; rentang
  // y1..y2 cuma selubung terluar, dipakai untuk penamaan dan ekspor.
  if (P.set) return P.set.has(t);
  return t >= P.y1 * 12 + P.m1 && t <= P.y2 * 12 + P.m2;
};

/* ---------- potongan periode & pembandingnya ---------- */
const kunciBln = (y, m) => y * 12 + m;
const dariKunci = t => [Math.floor((t - 1) / 12), (t - 1) % 12 + 1];
const labelRentang = (a, b, B) => {
  const [y1, m1] = dariKunci(a), [y2, m2] = dariKunci(b);
  return ymLabelBln({y1, m1, y2, m2}, B);
};

/* Pembanding tiap potong. Kuartal dan tahun dibandingkan dengan periode yang
   SAMA di tahun sebelumnya: membandingkan Q1 dengan kuartal yang persis
   mendahuluinya berarti mengadu Januari-Maret dengan Oktober-Desember, dua
   musim tayang yang memang tidak sebanding. Potongan lain tetap dibandingkan
   dengan rentang sama panjang yang mendahuluinya. */
function pembandingP(bg){
  if (bg.sbl) return bg.sbl;                       // Custom: ditentukan sendiri
  if (bg.jenis === 'kuartal' || bg.jenis === 'tahun')
    return {a: bg.a - 12, b: bg.b - 12};
  const pjg = bg.b - bg.a + 1;
  return {a: bg.a - pjg, b: bg.a - 1};
}

/* Beberapa potong periode disatukan jadi satu objek P. */
function gabungP(bagian){
  if (!bagian || !bagian.length) return null;
  const bungkus = st => {
    const arr = [...st].sort((x, y) => x - y);
    const [y1, m1] = dariKunci(arr[0]), [y2, m2] = dariKunci(arr[arr.length - 1]);
    return {y1, m1, y2, m2, set: st};
  };
  const set = new Set();
  for (const bg of bagian) for (let t = bg.a; t <= bg.b; t++) set.add(t);
  const P = bungkus(set);
  P.label   = bagian.map(b => labelRentang(b.a, b.b, BLN_ID)).join(' + ');
  P.labelEn = bagian.map(b => labelRentang(b.a, b.b, BLN_EN)).join(' + ');
  P.bagian  = bagian;

  const sset = new Set(), sNama = [], sNamaEn = [];
  for (const bg of bagian){
    const s = pembandingP(bg);
    if (!s || s.a < 1) continue;
    for (let t = s.a; t <= s.b; t++) sset.add(t);
    sNama.push(labelRentang(s.a, s.b, BLN_ID));
    sNamaEn.push(labelRentang(s.a, s.b, BLN_EN));
  }
  if (sset.size){
    P.sbl = bungkus(sset);
    P.sbl.label = sNama.join(' + ');
    P.sbl.labelEn = sNamaEn.join(' + ');
  }
  return P;
}

/* Kelompokkan baris deret waktu: sum untuk metrik, max untuk nilai lifetime. */
function rollup(ts, P, keys, sums, lasts){
  const rows = ts.rows.filter(r => inP(r, P));
  // bulan terakhir di dalam rentang -> dipakai untuk nilai lifetime (follower/subscriber)
  const lastT = rows.length ? Math.max(...rows.map(r => r[0] * 12 + r[1])) : null;
  const map = new Map();
  for (const r of rows){
    const kv = keys.map(k => r[ts.ix[k]]);
    const id = kv.join('');
    let o = map.get(id);
    if (!o){ o = {_k: kv, _n: 0}; sums.forEach(c => o[c] = 0); (lasts||[]).forEach(c => o[c] = 0); map.set(id, o); }
    o._n++;
    sums.forEach(c => o[c] += Number(r[ts.ix[c]]) || 0);
    if (lasts && r[0] * 12 + r[1] === lastT)
      lasts.forEach(c => o[c] = Math.max(o[c], Number(r[ts.ix[c]]) || 0));
  }
  const list = [...map.values()].map(o => { keys.forEach((k, i) => o[k] = o._k[i]); return o; });
  // dikembalikan sebagai objek supaya jumlah bulan tidak ikut hilang saat list di-.filter()
  return {list, months: new Set(rows.map(r => r[0] * 12 + r[1])).size, lastT};
}

/* Cek apakah periode yang diminta masih tercakup datanya. */
function covNote(P, key){
  if (!P) return '';
  const c = DATA.coverage && DATA.coverage[key];
  if (!c) return '';
  const a = c.from[0] * 12 + c.from[1], b = c.to[0] * 12 + c.to[1];
  const x = P.y1 * 12 + P.m1, y = P.y2 * 12 + P.m2;
  if (y < a || x > b)
    return `<br>⚠️ Data ${key} yang tersedia hanya ${BLN_ID[c.from[1]-1]} ${c.from[0]} – ${BLN_ID[c.to[1]-1]} ${c.to[0]}. Periode yang Anda minta di luar rentang itu.`;
  if (x < a || y > b)
    return `<br>⚠️ Sebagian periode di luar data. Yang tersedia hanya ${BLN_ID[c.from[1]-1]} ${c.from[0]} – ${BLN_ID[c.to[1]-1]} ${c.to[0]}.`;
  return '';
}

/* Rentang yang benar-benar ada di satu sumber, dibaca dari coverage — bukan
   ditulis tetap di dalam kalimat. Dulu kalimatnya mengklaim "hanya satu bulan";
   begitu berkas Studio dipecah per bulan, klaim itu jadi salah tanpa ketahuan. */
function rentangSumber(src){
  const c = (DATA.coverage || {})[src];
  if (!c || !c.from || !c.to) return null;
  const a = `${BLN_ID[c.from[1] - 1]} ${c.from[0]}`;
  const b = `${BLN_ID[c.to[1] - 1]} ${c.to[0]}`;
  return a === b ? a : `${a} – ${b}`;
}

/* Peringatan untuk tabel yang dihitung dari seluruh isi berkas, bukan dari
   periode yang sedang dipilih (engagement, ranking cluster, top video, CTR). */
function snapNote(P){
  if (!P) return '';
  const s = rentangSumber('scraping'), t = rentangSumber('studio');
  const sumber = [s ? `Scraping <b>${s}</b>` : null, t ? `YouTube Studio <b>${t}</b>` : null]
    .filter(Boolean).join(', ');
  return `<br>⚠️ Angka di atas <b>bukan</b> periode ${P.label}. Tabel ini dihitung dari
    seluruh isi berkas, bukan dari periode yang dipilih${sumber ? ` — ${sumber}` : ''}.
    Untuk analisis berperiode, tanyakan revenue, views, subscriber, followers, atau portal.`;
}
const tt = (title, P) => P ? `${title} · ${P.label}` : title;

/* Apakah periode yang diminta ada di luar cakupan sumber? */
function diLuarCakupan(src, P){
  if (!P) return false;
  const c = (DATA.coverage || {})[src];
  if (!c) return false;
  const a = c.from[0]*12 + c.from[1], b = c.to[0]*12 + c.to[1];
  return (P.y2*12 + P.m2) < a || (P.y1*12 + P.m1) > b;
}

/* Pesan kalau periode yang diminta tidak tercakup sumber datanya. */
function kosong(src, P){
  const c = (DATA.coverage || {})[src];
  const NAMA = {youtube:'Recap YouTube', socmed:'Social Media', portal:'Portal (Similarweb)',
                portal_sales:'Revenue Direct Sales Portal', studio:'YouTube Studio', scraping:'Scraping'};
  const rng = c ? `${BLN_ID[c.from[1]-1]} ${c.from[0]} – ${BLN_ID[c.to[1]-1]} ${c.to[0]}` : '-';
  return `<div style="line-height:1.7">Tidak ada data untuk periode <b>${P ? P.label : '-'}</b>.<br>
    Sumbernya (${NAMA[src] || src}) hanya tersedia untuk <b>${rng}</b>.</div>`;
}


/* ---------- SARING TABEL BERDIMENSI TANGGAL ---------- */
const ymOf = t => { const y = +String(t).slice(0,4), m = +String(t).slice(5,7); return y*12 + m; };
const inDate = (t, P) => {
  if (!P) return true;
  const x = ymOf(t);
  return x >= P.y1*12 + P.m1 && x <= P.y2*12 + P.m2;
};

/* Ringkas tabel harian umum (ts_money / ts_jam). */
function tglRollup(name, P, keyCol, sums){
  const t = TS(name), ix = t.ix;
  const rows = t.rows.filter(r => inDate(r[ix.tgl], P));
  const map = new Map();
  for (const r of rows){
    const k = r[ix[keyCol]];
    let o = map.get(k);
    if (!o){ o = {[keyCol]: k}; sums.forEach(c => o[c] = 0); map.set(k, o); }
    sums.forEach(c => o[c] += Number(r[ix[c]]) || 0);
  }
  return {list: [...map.values()], hari: new Set(rows.map(r => r[ix.tgl])).size};
}

/* Ringkas tabel bulanan umum (ts_demografi / ts_portal_tipe). */
function bulanRollup(name, P, keys, sums, means){
  const t = TS(name), ix = t.ix;
  const rows = t.rows.filter(r => inP(r, P));
  const map = new Map();
  for (const r of rows){
    const kv = keys.map(k => r[ix[k]]), id = kv.join('');
    let o = map.get(id);
    if (!o){ o = {_n:0}; keys.forEach((k,i)=>o[k]=kv[i]); (sums||[]).concat(means||[]).forEach(c=>o[c]=0); map.set(id,o); }
    o._n++;
    (sums||[]).forEach(c => o[c] += Number(r[ix[c]]) || 0);
    (means||[]).forEach(c => o[c] += Number(r[ix[c]]) || 0);
  }
  const list = [...map.values()].map(o => {
    (means||[]).forEach(c => o[c] = o._n ? o[c]/o._n : 0);
    return o;
  });
  return {list, bulan: new Set(rows.map(r => r[0]*12 + r[1])).size};
}

/* Cari nama entitas yang disebut di pertanyaan. */
function entitasDisebut(qRaw){
  const q = ' ' + qRaw.toLowerCase() + ' ';
  const out = [];
  for (const [jenis, arr] of [['channel', ENTITAS.channel], ['program', ENTITAS.program],
                              ['kategori', ENTITAS.kategori], ['cluster/portal', ENTITAS.lain]]){
    for (const nama of arr){
      if (q.includes(' ' + nama.toLowerCase()) || q.includes(nama.toLowerCase() + ' '))
        out.push({jenis, nama});
    }
  }
  // satu nama bisa muncul di beberapa daftar sekaligus (mis. 'Okezone' adalah
  // channel sekaligus cluster) -> samakan dulu, baru buang yang tercakup nama
  // yang lebih panjang ('iNews' di dalam 'iNews Jabar')
  const uniq = [...new Map(out.map(e => [e.nama.toLowerCase(), e])).values()];
  return uniq.filter(a => !uniq.some(b =>
    b.nama.length > a.nama.length && b.nama.toLowerCase().includes(a.nama.toLowerCase())));
}

/* Cari satu nama dari daftar yang disebut di pertanyaan (yang terpanjang menang). */
function cariNama(qRaw, daftar){
  const q = ' ' + qRaw.toLowerCase() + ' ';
  let hit = null;
  for (const nama of daftar){
    const n = nama.toLowerCase();
    if ((q.includes(' ' + n) || q.includes(n + ' ')) && (!hit || nama.length > hit.length))
      hit = nama;
  }
  return hit;
}

   Dikumpulkan dari tiga sumber supaya cluster tetap terpetakan walau salah satu
   file tidak ada. */
const UNIT_CH = (() => {
  const m = {};
  const tambah = (u, ch) => {
    if (!u || u === 'nan' || !ch || ch === 'nan') return;
    (m[u] = m[u] || []);
    if (!m[u].includes(ch)) m[u].push(ch);
  };
  (DATA.studio || []).forEach(x => tambah(x.unit, x.channel));
  { const t = TS('ts_youtube'); t.rows.forEach(r => tambah(r[t.ix.unit], r[t.ix.channel])); }
  { const t = TS('ts_socmed');  t.rows.forEach(r => tambah(r[t.ix.unit],  r[t.ix.channel])); }
  Object.keys(m).forEach(u => m[u].sort());
  return m;
})();

/* Ringkas dimensi editorial, boleh disaring per channel.
   Tanpa channel -> pakai ts_dim (harian, bisa disaring sampai tanggal).
   Dengan channel -> pakai ts_dim_ch (bulanan, karena disilang dengan channel). */
function dimRollup(dim, P, chFilter){
  if (chFilter && DATA.ts_dim_ch){
    const t = TS('ts_dim_ch'), ix = t.ix;
    // chFilter boleh satu nama channel, atau daftar channel (untuk satu unit)
    const set = new Set((Array.isArray(chFilter) ? chFilter : [chFilter]).map(x => String(x).toLowerCase()));
    const rows = t.rows.filter(r => r[ix.dim] === dim
      && set.has(String(r[ix.channel]).toLowerCase()) && inP(r, P));
    const map = new Map();
    for (const r of rows){
      const k = r[ix.key];
      let o = map.get(k);
      if (!o){ o = {key:k, videos:0, views:0, watch:0, revenue:0, eng:0, subs:0, ctr_sum:0, pct_sum:0}; map.set(k,o); }
      o.videos += r[ix.videos]; o.views += r[ix.views]; o.watch += r[ix.watch];
      o.revenue += r[ix.revenue]; o.eng += r[ix.eng];
      o.ctr_sum += r[ix.ctr_sum]; o.pct_sum += r[ix.pct_sum];
    }
    const list = [...map.values()].map(o => ({...o,
      ctr: o.videos ? o.ctr_sum/o.videos : 0, pct: o.videos ? o.pct_sum/o.videos : 0}))
      .sort((a,b) => b.views - a.views);
    return {list, hari: null, bulan: new Set(rows.map(r => r[0]*12+r[1])).size,
            channel: chFilter};
  }

  const t = TS('ts_dim'), ix = t.ix;
  const rows = t.rows.filter(r => r[ix.dim] === dim && inDate(r[ix.tgl], P));
  const map = new Map();
  for (const r of rows){
    const k = r[ix.key];
    let o = map.get(k);
    if (!o){ o = {key:k, videos:0, views:0, watch:0, revenue:0, eng:0, subs:0, ctr_sum:0, pct_sum:0}; map.set(k,o); }
    o.videos += r[ix.videos]; o.views += r[ix.views]; o.watch += r[ix.watch];
    o.revenue += r[ix.revenue]; o.eng += r[ix.eng]; o.subs += r[ix.subs];
    o.ctr_sum += r[ix.ctr_sum]; o.pct_sum += r[ix.pct_sum];
  }
  const list = [...map.values()].map(o => ({...o,
    ctr: o.videos ? o.ctr_sum/o.videos : 0, pct: o.videos ? o.pct_sum/o.videos : 0}))
    .sort((a,b) => b.views - a.views);
  return {list, hari: new Set(rows.map(r => r[ix.tgl])).size, channel: null};
}

/* Sama seperti dimRollup, tapi hasilnya dipecah per bulan: matriks dimensi x bulan. */
function dimPerBulan(dim, P, chFilter, metrik){
  const acc = new Map(), bulanSet = new Set();
  const tambah = (key, ym, v) => {
    let m = acc.get(key); if(!m){ m = new Map(); acc.set(key, m); }
    m.set(ym, (m.get(ym) || 0) + v);
    bulanSet.add(ym);
  };
  if(chFilter && DATA.ts_dim_ch){
    const t = TS('ts_dim_ch'), ix = t.ix;
    const set = new Set((Array.isArray(chFilter) ? chFilter : [chFilter]).map(x => String(x).toLowerCase()));
    for(const r of t.rows){
      if(r[ix.dim] !== dim || !set.has(String(r[ix.channel]).toLowerCase()) || !inP(r, P)) continue;
      tambah(r[ix.key], r[0] * 12 + r[1], r[ix[metrik]]);
    }
  } else {
    const t = TS('ts_dim'), ix = t.ix;
    for(const r of t.rows){
      if(r[ix.dim] !== dim || !inDate(r[ix.tgl], P)) continue;
      const tgl = r[ix.tgl];
      tambah(r[ix.key], (+tgl.slice(0, 4)) * 12 + (+tgl.slice(5, 7)), r[ix[metrik]]);
    }
  }
  const bulan = [...bulanSet].sort((a, b) => a - b);
  const baris = [...acc.entries()].map(([key, m]) => {
    const nilai = bulan.map(b => m.get(b) || 0);
    return {key, nilai, total: nilai.reduce((a, v) => a + v, 0)};
  }).sort((a, b) => b.total - a.total);
  return {bulan, baris};
}

/* Judul yang ikut menyebut channel bila disaring. */
const namaFilter = ch => !ch ? '' : (Array.isArray(ch) ? (ch.label || 'unit terpilih') : ch);
const ttc = (judul, P, ch) => tt(judul + (ch ? ` · ${namaFilter(ch)}` : ''), P);
/* Catatan sumber saat disaring per channel (data silang bersifat bulanan). */
const catatanCh = R => R.channel
